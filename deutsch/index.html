<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bash Deutsch – njemački A1–B2</title>
<meta name="description" content="Uči njemački od A1 do B2: lekcije, slušanje, slaganje rečenica, der/die/das, video izvori. Besplatno.">
<link rel="icon" href="../assets/icons/icon-192.png">
<meta name="theme-color" content="#000000">
<style>
:root{--green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;--red:#ff4b4b;--red-d:#ea2b2b;--yellow:#ffc800;--orange:#ff9600;
--bg:#fff;--text:#3c3c3c;--muted:#8a8a8a;--line:#e5e5e5;--line-d:#cfcfcf;--card:#fff;--soft:#f7f7f7;--okbg:#d7ffb8;--okfg:#58a700;--badbg:#ffdfe0;--badfg:#ea2b2b}
@media (prefers-color-scheme: dark){:root{--bg:#131f24;--text:#f1f7fb;--muted:#8fa6b2;--line:#37464f;--line-d:#2a383f;--card:#131f24;--soft:#202f36;--okbg:#1e3a14;--okfg:#79d634;--badbg:#3d1a1d;--badfg:#ff7878}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-weight:700}
button{font-family:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.stat.fire{color:var(--orange)}.stat.xp{color:#e5a800}.stat.heart{color:var(--red)}
.flag{font-size:24px}
main{padding:16px 16px 110px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--line);z-index:5}
nav.bottom .in{display:flex;max-width:560px;margin:0 auto}
nav.bottom button{flex:1;min-width:0;background:none;border:0;padding:9px 0 12px;font-size:10px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button .ic{font-size:23px;filter:grayscale(1);opacity:.6}
nav.bottom button.on{color:var(--blue)}
nav.bottom button.on .ic{filter:none;opacity:1}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-d);cursor:default;transform:none}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.card{border:2px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)}.small{font-size:13px}
.goal{display:flex;align-items:center;gap:12px}
.gtxt{flex:1}
.gbar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0;position:relative}
.vt summary{cursor:pointer;font-weight:900;color:var(--blue);margin-top:12px}
.gbar i{display:block;height:100%;background:var(--yellow);border-radius:8px}
.lvl{display:flex;align-items:center;gap:10px;margin:34px 0 -6px;font-weight:900;font-size:18px}
.lvl span{background:var(--text);color:var(--bg);border-radius:10px;padding:3px 10px;font-size:15px}
.unit{border-radius:16px;padding:14px 16px;color:#fff;margin:26px 0 22px;display:flex;justify-content:space-between;align-items:center}
.ulbl{font-size:12px;opacity:.9;font-weight:800;letter-spacing:.4px}
.utit{font-size:20px;font-weight:900}
.tipbtn{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);border-radius:12px;font-size:20px;padding:6px 10px;cursor:pointer}
.path{display:flex;flex-direction:column;align-items:center;gap:22px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:72px;height:66px;border-radius:50%;border:0;font-size:28px;font-weight:900;cursor:pointer;background:var(--c);box-shadow:0 7px 0 var(--cd);color:#fff}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.locked{background:var(--line);box-shadow:0 7px 0 var(--line-d);color:var(--muted);font-size:24px}
.node.done{background:var(--yellow);box-shadow:0 7px 0 #e0a800}
.node.cur{outline:5px solid var(--line);outline-offset:6px}
.startb{position:absolute;top:-40px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-weight:900;color:var(--green);font-size:14px;animation:bob 1.2s ease-in-out infinite;white-space:nowrap}
@keyframes bob{50%{transform:translateY(-5px)}}
h2.t{font-size:24px;font-weight:900;margin:6px 0 14px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 30px;max-height:86vh;overflow:auto;animation:up .22s ease-out}
.sheet h3{font-size:22px;margin:4px 0 6px;font-weight:900}
.sh-h{font-weight:900;font-size:14px;letter-spacing:.4px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.tip p{line-height:1.5}
.tip table{border-collapse:collapse;width:100%;margin:8px 0}
.tip td{border:2px solid var(--line);padding:7px 10px}
.tip b{color:var(--blue)}
/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:14px;padding:16px 16px 8px;max-width:600px;margin:0 auto;width:100%}
.xbtn{background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1}
.prog{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.lbody{flex:1;overflow:auto;padding:10px 18px 20px;max-width:600px;margin:0 auto;width:100%}
.lbody.lock .opt,.lbody.lock .tile,.lbody.lock input,.lbody.lock .chars button{pointer-events:none}
.lfoot{border-top:2px solid var(--line);padding:14px 18px 22px}
.lfoot .fin{max-width:600px;margin:0 auto}
.lfoot.ok{background:var(--okbg);border-color:transparent}
.lfoot.bad{background:var(--badbg);border-color:transparent}
.fbt{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.lfoot.ok .fbt,.lfoot.ok .fbd{color:var(--okfg)}.lfoot.bad .fbt,.lfoot.bad .fbd{color:var(--badfg)}
.fbd{margin-top:4px;font-size:16px}
.combo{display:inline-block;margin-top:6px;background:var(--orange);color:#fff;border-radius:10px;padding:2px 10px;font-size:13px}
.q h2{font-size:22px;font-weight:900;margin:6px 0 18px}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.bubble{border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:19px;flex:1}
.bubble .sub{font-size:14px;color:var(--muted);margin-top:3px}
.spk{width:50px;height:50px;border-radius:14px;border:0;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#fff;font-size:22px;cursor:pointer;flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.spk.big{width:96px;height:96px;border-radius:24px;font-size:42px}
.spk.slow{width:60px;height:60px;font-size:26px;border-radius:18px}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:10px 0 26px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;background:var(--card);font-size:17px;font-weight:700;color:var(--text);text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .k{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:rgba(88,204,2,.15);color:var(--okfg)}
.opt.wrong{border-color:var(--red);background:rgba(255,75,75,.12);color:var(--badfg)}
.opt.gone{opacity:.3;pointer-events:none}
.art{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.art .opt{justify-content:center;font-size:22px;font-weight:900;padding:22px 8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{justify-content:center;text-align:center;min-height:58px}
.answer-line{min-height:120px;background:repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:26px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 14px;background:var(--card);font-size:17px;font-weight:700;color:var(--text);cursor:pointer;height:48px}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
input.typ{width:100%;font:inherit;font-size:19px;padding:15px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);outline:none}
input.typ:focus{border-color:var(--blue)}
.chars{display:flex;gap:8px;margin-top:10px}
.chars button{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--card);color:var(--text);font-size:18px;font-weight:800;padding:8px 0;cursor:pointer}
.badge{display:inline-block;background:var(--purple,#ce82ff);color:#fff;font-size:12px;font-weight:900;border-radius:8px;padding:3px 10px;letter-spacing:.5px;margin-bottom:12px}
.intro{text-align:center;padding-top:10px}
.intro .de{font-size:34px;font-weight:900;margin:18px 0 6px}
.intro .bs{font-size:20px;color:var(--muted)}
.result{text-align:center;padding-top:30px}
.result h1{font-size:30px;font-weight:900;color:var(--yellow);margin:12px 0 6px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.rs{border:2px solid var(--c);border-radius:14px;overflow:hidden}
.rs .h{background:var(--c);color:#fff;font-size:11px;font-weight:900;padding:5px;letter-spacing:.4px}
.rs .v{font-size:20px;font-weight:900;padding:12px 4px;color:var(--c)}
/* words */
.search{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);outline:none;margin-bottom:6px}
.wgrp{margin-top:20px;font-weight:900;font-size:14px;color:var(--muted);letter-spacing:.4px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}
.wrow .spk{width:40px;height:40px;font-size:17px;border-radius:12px}
.wrow .tx{flex:1}
.wrow .d{font-size:17px;font-weight:800}
.wrow .b{font-size:14px;color:var(--muted)}
.str{letter-spacing:2px;color:var(--yellow);font-size:12px}
/* resources */
.res{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;margin-bottom:12px}
.res .e{font-size:32px;flex:none}
.res .tt{font-weight:900;font-size:17px}
.res .ds{font-size:14px;color:var(--muted);margin-top:2px;font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:900;border-radius:6px;padding:1px 7px;margin-left:6px;background:var(--blue);color:#fff;vertical-align:middle}
/* profile */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.sbox .n{font-size:20px;font-weight:900}
.sbox .l{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px}
.chart .bar.g{background:var(--yellow)}
.chart .lb{font-size:11px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);color:var(--text);padding:10px 6px;font-weight:800;cursor:pointer;font-size:14px}
.seg button.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.1)}
select{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text)}
.sec{margin-top:26px}
.sec h3{font-size:18px;font-weight:900;margin:0 0 10px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;font-weight:600}
/* exam */
.xlv{margin-top:14px;padding:12px}
.xlh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lvb{background:var(--blue);color:#fff;border-radius:12px;padding:8px 10px;font-weight:900;font-size:18px}
.pass{background:var(--green);color:#fff;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:900;white-space:nowrap}
.xmod{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:2px solid var(--line);padding:12px 2px;color:var(--text);text-align:left;cursor:pointer;font-size:15px}
.xmod .xi{font-size:24px}.xmod .xt{flex:1;line-height:1.35}
.xs{font-weight:900;color:var(--muted);font-size:16px}.xs.ok{color:var(--green)}.xs.bad{color:var(--red)}
.timer{font-weight:900;font-variant-numeric:tabular-nums;background:var(--soft);border-radius:10px;padding:4px 10px}
.timer.low{color:#fff;background:var(--red)}
.xm-part{border-top:2px solid var(--line);padding-top:16px;margin-top:18px}
.xm-pt{font-weight:900;font-size:20px}
.xm-ins{font-weight:700;margin:4px 0 2px;line-height:1.4}
.xm-de{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:10px;font-weight:600}
.xm-text{background:var(--soft);border-radius:14px;padding:14px;margin:10px 0;line-height:1.55;font-weight:600;font-size:15px}
.xm-text.sm{font-size:14px;padding:11px;margin:6px 0}
.xm-ads{display:grid;gap:8px;margin:10px 0}
.xm-ads div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;font-weight:600}
.xm-ads b{color:var(--blue);margin-right:4px}
.xm-sign{border:3px solid var(--text);border-radius:8px;padding:10px;text-align:center;font-weight:900;margin:6px 0;font-size:15px;line-height:1.35}
.xm-item{margin:16px 0}
.xm-q{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.xn{background:var(--text);color:var(--bg);border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;font-weight:900;margin-top:1px}
.xm-qt{font-weight:800;line-height:1.4}
.xm-opts{display:grid;gap:8px}
.xm-opts.two{grid-template-columns:1fr 1fr}
.xm-opts.chips{display:flex;flex-wrap:wrap;gap:6px}
.xo{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:11px 12px;background:var(--card);color:var(--text);font-size:15px;font-weight:700;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}
.xm-opts.two .xo,.xm-opts.chips .xo{justify-content:center;text-align:center}
.xm-opts.chips .xo{min-width:46px;padding:9px 12px}
.xo .xl{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.xo.sel{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
.xo.right{border-color:var(--green);background:rgba(88,204,2,.15);color:var(--okfg)}
.xo.wrong{border-color:var(--red);background:rgba(255,75,75,.12);color:var(--badfg)}
.xm-fb{font-size:13px;margin-top:6px}
.cfb{display:block;margin-top:8px;background:rgba(255,200,0,.12);border:1px solid rgba(255,200,0,.45);color:#ffc800;font-weight:800;border-radius:12px;padding:8px 12px;font-size:14px;cursor:pointer;text-align:left}
.gt{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}.gt th,.gt td{border:1px solid rgba(255,255,255,.12);padding:5px 6px;text-align:left}.gt th{background:rgba(28,176,246,.12)}
.gx{line-height:1.55;font-weight:600;font-size:14.5px}.gx b{color:#ffc800}
.rph{cursor:pointer}.flashok{background:rgba(88,204,2,.25)!important}
.plan,.plan0{display:block;width:100%;text-align:left;margin-bottom:12px;color:inherit;font-size:15px}.plan0{cursor:pointer}.ptodo{font-weight:800;font-size:14px;padding:4px 0}.ptodo.ok{opacity:.6;text-decoration:line-through}
.gf{margin-top:10px;font-size:15px;font-weight:800;color:#ffc800;background:rgba(255,200,0,.1);border:1px solid rgba(255,200,0,.3);border-radius:10px;padding:4px 10px;display:inline-block}.gfi{color:#ffc800;font-weight:700}
.blank{display:inline-block;min-width:60px;border-bottom:3px solid #ffc800;color:#ffc800}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.pbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);backdrop-filter:blur(14px);color:inherit;font-size:22px;cursor:pointer;text-align:left}.pbtn b{font-size:15px}.pbtn span{font-size:12px;opacity:.7;font-weight:700}
.xexp{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(28,176,246,.08);border:1px solid rgba(28,176,246,.25);font-size:13.5px;font-weight:600;line-height:1.45}
.xexp blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid #ffc800;font-style:italic;background:rgba(255,200,0,.07);border-radius:0 8px 8px 0}
.xev{background:none;border:0;color:var(--blue);font-weight:800;font-size:13px;padding:2px 0;cursor:pointer}
mark.evm{background:rgba(255,200,0,.28);color:inherit;border-radius:4px;padding:0 2px;box-shadow:0 0 0 1px rgba(255,200,0,.5)}
mark.evm::before{content:attr(data-n);font-size:10px;font-weight:900;background:#ffc800;color:#000;border-radius:6px;padding:0 4px;margin-right:3px;vertical-align:top}
mark.evm.flash{animation:evf 1.4s}@keyframes evf{0%,60%{background:rgba(255,200,0,.85)}100%{background:rgba(255,200,0,.28)}}
.xtip{margin:8px 0;font-size:13.5px}.xtip summary{cursor:pointer;font-weight:800;color:#ffc800}.xtip div{padding:10px 12px;margin-top:6px;border-radius:12px;background:rgba(255,200,0,.07);border:1px solid rgba(255,200,0,.25);line-height:1.5;font-weight:600}
.onlybad .xm-item.okit{display:none}
.okc{color:var(--okfg);font-weight:900}.badc{color:var(--badfg);font-weight:900}
.xplay{border:0;background:var(--blue);box-shadow:0 3px 0 var(--blue-d);color:#fff;border-radius:12px;padding:9px 14px;font-weight:900;font-size:14px;cursor:pointer;margin:4px 8px 6px 0}
.xplay:disabled{background:var(--line);box-shadow:none;color:var(--muted)}
.xplay .pl{background:rgba(255,255,255,.25);border-radius:6px;padding:1px 6px;margin-left:4px}
.xtr{border:2px solid var(--line);background:none;color:var(--text);border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer}
.xtrans{margin:6px 0;font-size:14px}.xtrans summary{cursor:pointer;font-weight:800;color:var(--blue)}.xtrans div{background:var(--soft);border-radius:12px;padding:12px;margin-top:6px;line-height:1.55;font-weight:600}
.xres{display:flex;gap:14px;align-items:center;border-radius:18px;padding:14px 16px;margin-bottom:8px}
.xres.ok{background:var(--okbg)}.xres.bad{background:var(--badbg)}

function vocStats(lv,cat){const ws=VOCW.filter(w=>w.lv===lv&&(cat==null||w.cat===cat)),now=Date.now();let learned=0,due=0,seen=0;ws.forEach(w=>{const r=(S.vocab||{})[w.id];if(!r)return;seen++;if(r.b>=3)learned++;if(r.d<=now)due++;});return {total:ws.length,learned,due,seen};}
function buildVocab(lv,cat){
  const now=Date.now(),V=S.vocab||{},ws=VOCW.filter(w=>w.lv===lv&&(cat==null||w.cat===cat));
  const due=shuf(ws.filter(w=>V[w.id]&&V[w.id].d<=now)).slice(0,8);
  const fresh=ws.filter(w=>!V[w.id]).slice(0,Math.max(3,6-Math.floor(due.length/2)));
  const q=[],T=['mc_de_bs','mc_bs_de','listen_mc','type','mc_de_bs'];
  const fix=t=>(!TTS&&t==='listen_mc')?'mc_bs_de':t;
  fresh.forEach(w=>{q.push({type:'intro',w,voc:1});q.push({type:'mc_de_bs',w,voc:1});});
  due.forEach(w=>q.push({type:fix(ART.test(w.de)&&Math.random()<.3?'article':pick(T)),w,voc:1}));
  const pool=due.concat(fresh);
  if(pool.length>=5)q.push({type:'match',ws:shuf(pool).slice(0,5)});
  shuf(fresh).forEach(w=>q.push({type:fix(pick(['mc_bs_de','type','listen_mc'])),w,voc:1}));
  q.forEach(x=>{if(x.type==='type'&&x.w&&(x.w.de.length>18||/[…!?.]/.test(x.w.de)))x.type='mc_bs_de';});
  return q;
}

P:['mc_de_bs','type','listen_mc','match','build_de','article','mc_bs_de','listen_build','type','build_bs']
};
function buildQueue(words,sents,plan,skipIntro){
  const wq=shuf(words),sq=shuf(sents);let wi=0,si=0,ii=0;const out=[];
  for(let t of plan){
    if(!TTS){if(t==='listen_mc')t='mc_bs_de';if(t==='listen_build')t='build_de';}
    if(t==='intro'){if(!skipIntro)out.push({type:'intro',w:wq[ii++%wq.length]});continue;}
    if(t==='article'){const c=shuf(words).find(w=>ART.test(w.de));if(c){out.push({type:'article',w:c});continue;}t='mc_de_bs';}
    if(t==='match'){const seen=new Set(),ws=[];for(const w of shuf(words.length>=5?words:words.concat(words[0].u>=0?UNITS[words[0].u].words:VOCW.filter(x=>x.lv===words[0].lv&&x.cat===words[0].cat)))){const k=norm(w.de)+'|'+norm(w.bs);if(!seen.has(k)&&!ws.some(x=>norm(x.bs)===norm(w.bs)||norm(x.de)===norm(w.de))){seen.add(k);ws.push(w);}if(ws.length>=5)break;}out.push({type:'match',ws});continue;}
    if(t==='build_de'||t==='build_bs'||t==='listen_build'){if(sq.length){out.push({type:t,s:sq[si++%sq.length]});continue;}t='type';}
    out.push({type:t,w:wq[wi++%wq.length]});
  }
  return out;
}
function distract(w,field,n){const pool=w.u>=0?UNITS[w.u].words:VOCW.filter(x=>x.lv===w.lv&&x.cat===w.cat);const sd=new Set([norm(w.de)]),sb=new Set([norm(w.bs)]),out=[];for(const x of shuf(pool).concat(shuf(ALLW.concat(VOCW)))){const kd=norm(x.de),kb=norm(x.bs);if(sd.has(kd)||sb.has(kb))continue;sd.add(kd);sb.add(kb);out.push(x);if(out.length>=n)break;}return out;}
function extraToks(answer,lang,n){const own=new Set(tok(answer).map(t=>t.toLowerCase()));const c=[];for(const s of shuf(ALLS)){for(const t of tok(s[lang])){const k=t.toLowerCase();if(!own.has(k)&&!c.some(x=>x.toLowerCase()===k))c.push(t);}if(c.length>30)break;}return shuf(c).slice(0,n);}

let L=null;

  else if(mode==='jump'||l===3)q=buildQueue(U.words,U.sents,PLANS[3],true);
  else{const W=U.words,h=Math.ceil(W.length/2);
    if(l===0)q=buildQueue(W.slice(0,h),U.sents.slice(0,3),PLANS[0],!!S.done[u*4]);
    else if(l===1)q=buildQueue(W.slice(h),U.sents.slice(2,5),PLANS[1],!!S.done[u*4+1]);
    else q=buildQueue(W,U.sents,PLANS[2],true);}
  L={q,base:q.length,solved:0,okc:0,att:0,mist:0,combo:0,t0:Date.now(),mode,u,l,state:'ask'};
  const d=document.createElement('div');d.className='lesson';d.id='lesson';

function buildPractice(){
  const us=UNITS.filter((U,u)=>isOpen(u*4)||S.done[u*4]);

  const sc=w=>{const r=S.words[w.de]||{ok:0,bad:0};return r.ok-r.bad*2+Math.random()*1.5;};

const LVS=['A1','A2','B1','B2'];
function planStats(){const P=S.plan;if(!P)return null;const upto=LVS.indexOf(P.lv);
  const lessTot=UNITS.reduce((a,U,u)=>a+(LVS.indexOf(U.lvl)<=upto?4:0),0),lessDone=UNITS.reduce((a,U,u)=>a+(LVS.indexOf(U.lvl)<=upto?[0,1,2,3].filter(j=>S.done[u*4+j]).length:0),0);
  const V=S.vocab||{},vw=VOCW.filter(w=>LVS.indexOf(w.lv)<=upto),vTot=vw.length,vSeen=vw.filter(w=>V[w.id]).length;
  const days=Math.max(1,Math.ceil((new Date(P.date+'T23:59')-Date.now())/864e5));
  const today=dk();if(!S.planSnap||S.planSnap.d!==today){S.planSnap={d:today,l:Object.keys(S.done).length,v:Object.keys(V).length,g:Object.keys(S.gram||{}).length};save();}
  const lpd=Math.ceil((lessTot-lessDone)/Math.max(1,days-7)),vpd=Math.ceil((vTot-vSeen)/Math.max(1,days-7));
  const dl=Object.keys(S.done).length-S.planSnap.l,dv=Object.keys(V).length-S.planSnap.v;
  const gTot=GRAM.filter(g=>LVS.indexOf(g.lv)<=upto).length,gDone=GRAM.filter(g=>LVS.indexOf(g.lv)<=upto&&(S.gram||{})[g.id]>=70).length;
  const ex=(S.exam||{})[P.lv]||{},exDone=MODS.filter(([k])=>ex[k]!=null).length;
  return {P,days,lessTot,lessDone,vTot,vSeen,lpd:Math.max(0,lpd),vpd:Math.max(0,vpd),dl,dv,gTot,gDone,exDone,final:days<=7};}
function planCard(){const st=planStats();if(!st)return `<button class="card plan0" data-plan="1"><b>📅 Napravi plan učenja</b><br><span class="small muted">Izaberi nivo i datum ispita, a aplikacija ti kaže koliko dnevno da učiš.</span></button>`;

function certDraw(cv,lv,name){const W=2339,H=1654;cv.width=W;cv.height=H;const c=cv.getContext('2d'),r=(S.exam||{})[lv]||{},G='#b8860b',SERIF='Georgia,"Times New Roman",serif',SANS='Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  c.fillStyle='#fffdf7';c.fillRect(0,0,W,H);

  c.strokeStyle=G;c.lineWidth=6;c.strokeRect(70,70,W-140,H-140);c.lineWidth=2;c.strokeRect(92,92,W-184,H-184);
  [[110,110],[W-110,110],[110,H-110],[W-110,H-110]].forEach(([x,y])=>{c.fillStyle=G;c.beginPath();c.arc(x,y,12,0,7);c.fill();});
  c.textAlign='center';c.fillStyle='#3c3c3c';

function vProfile(m){

  <div class="sec"><h3>Dnevni cilj</h3><div class="seg">${[[10,'Lagano'],[20,'Normalno'],[30,'Ozbiljno'],[50,'Intenzivno']].map(([v,n])=>`<button data-goal="${v}" class="${S.goal===v?'on':''}">${n}<br><span class="small muted">${v} XP</span></button>`).join('')}</div></div>
  <div class="sec"><h3>Zvuk i izgovor</h3>
  <div class="seg"><button data-snd="1" class="${S.sound?'on':''}">🔔 Efekti uklj.</button><button data-snd="0" class="${!S.sound?'on':''}">🔕 Isklj.</button></div>
  <div class="seg" style="margin-top:8px">${[[0.75,'🐢 Sporije'],[0.9,'Normalno'],[1.05,'⚡ Brže']].map(([v,n])=>`<button data-rate="${v}" class="${S.rate===v?'on':''}">${n}</button>`).join('')}</div>
  ${TTS?(voices.length?`<div style="margin-top:10px"><select id="vs">${voices.map(v=>`<option value="${esc(v.name)}" ${S.voice===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div><button class="btn ghost" data-say="Hallo! Ich lerne Deutsch.">🔊 Probaj glas</button>`:`<div class="note" style="margin-top:10px">Nema njemačkog glasa na uređaju. Na Androidu: Postavke → Pretvaranje teksta u govor → instaliraj njemački jezik, ili otvori aplikaciju u Chrome-u.</div>`):`<div class="note" style="margin-top:10px">🔇 Izgovor nije podržan ovdje. Otvori aplikaciju u Chrome-u.</div>`}
  </div>
  <div class="sec"><a class="card res" href="../"><span class="e">🧪</span><span><div class="tt">bashlab</div><div class="ds">Sve moje aplikacije · @basa.gtm</div></span></a></div>
  ${myDataSection()}${(isStaff()||admHasKey()||modHasKey())?'<div class="sec"><button class="btn" data-tab="admin" style="background:#ffc800;box-shadow:0 4px 0 #e0a800;color:#3c3c3c">👑 Admin / moderator panel</button></div>':''}

  const vs=$('#vs');if(vs)vs.onchange=()=>{S.voice=vs.value;save();};
  bindMyData();
  $('#bkx').onclick=backupExport;$('#bki').onclick=backupImport;
  $('#rst').onclick=()=>{sheet(`<div style="text-align:center">${mascot(80,'sad')}<h3>Obrisati sav napredak?</h3><p class="muted">XP, niz i završene lekcije biće izbrisani.</p><button class="btn red" id="ry">Da, obriši</button><button class="btn ghost" id="rn">Odustani</button></div>`);$('#ry').onclick=()=>{S=def();save();closeSheet();render();};$('#rn').onclick=closeSheet;};

{id:'wenn',lv:'A2',t:'wenn / als / ob',k:'wenn|als|ob',x:'<b>wenn</b> = kad (sadašnjost/budućnost ili <i>svaki put</i> u prošlosti) i ako.<br><b>als</b> = kad (<i>jednom</i> u prošlosti): Als ich Kind war…<br><b>ob</b> = da li: Ich weiß nicht, ob er kommt.',

{id:'termin',lv:'A2',t:'Termin / Verabredung / Treffen',k:'termin\\w*|verabred\\w*|treff\\w*',x:'<b>der Termin</b> = zvanični termin (doktor, ured, posao).<br><b>die Verabredung</b> = privatni dogovor / izlazak s nekim.<br><b>das Treffen</b> = susret, sastanak (općenito).',

{id:'fragen',lv:'A1',t:'fragen / bitten / bestellen',k:'frag\\w*|bitt\\w*|bat\\w*|gebeten|bestell\\w*',x:'<b>fragen</b> = pitati (informaciju).<br><b>bitten (um)</b> = zamoliti (za nešto).<br><b>bestellen</b> = naručiti.',

{id:'spaet',lv:'A1',t:'spät / später / zu spät / Verspätung',k:'spät\\w*|verspät\\w*',x:'<b>spät</b> = kasno. <b>später</b> = kasnije. <b>zu spät</b> = prekasno (zakasniti).<br><b>die Verspätung</b> = kašnjenje (voz, avion): Der Zug hat 10 Minuten Verspätung.',

{id:'also',lv:'A2',t:'also / auch / so',k:'also|auch|so',x:'⚠️ <b>also</b> = dakle, znači (NE „također").<br><b>auch</b> = također, i.<br><b>so</b> = tako.',

{id:'nach',lv:'A1',t:'nach / zu / in (kretanje)',k:'nach|zu|zum|zur|in|ins',x:'<b>nach</b> + gradovi i države bez člana, i <b>nach Hause</b>: nach Wien.<br><b>zu</b> + osobe i institucije: zum Arzt, zur Arbeit, zu Oma.<br><b>in</b> + akuzativ: u zatvoreni prostor / države s članom: ins Kino, in die Schweiz.',

{id:'zuhause',lv:'A1',t:'zu Hause / nach Hause',k:'hause',x:'<b>zu Hause</b> = kod kuće (Wo?): Ich bin zu Hause.<br><b>nach Hause</b> = kući (Wohin?): Ich gehe nach Hause.',

{id:'aendern',lv:'A2',t:'ändern / wechseln / tauschen / umziehen',k:'änder\\w*|wechsel\\w*|tausch\\w*|umzieh\\w*|umgezogen',x:'<b>ändern</b> = promijeniti (plan, tekst, mišljenje).<br><b>wechseln</b> = zamijeniti jedno drugim (posao, novac, gume): Geld wechseln.<br><b>(um)tauschen</b> = razmijeniti / vratiti robu za drugu.<br><b>umziehen</b> = preseliti se.',

 ex:[['Es ist kalt. ___ dir eine Jacke an!','Zieh',['Zieh','Nimm'],'Hladno je. Obuci jaknu!'],['Wir ___ nächsten Monat in eine neue Wohnung ___.','ziehen … ein',['ziehen … ein','ziehen … aus'],'Sljedeći mjesec se useljavamo u novi stan.']]},

{id:'wie',lv:'A2',t:'wie / als (poređenje)',k:'wie|als',x:'<b>so … wie</b> = jednako kao: Er ist so groß wie ich.<br><b>-er als</b> = više nego (komparativ): Er ist größer als ich.',
 ex:[['Berlin ist größer ___ München.','als',['als','wie'],'Berlin je veći od Münchena.'],['Mein Auto ist so alt ___ deins.','wie',['wie','als'],'Moj auto je star kao tvoj.']]},
{id:'denn',lv:'A2',t:'weil / denn / deshalb',k:'weil|denn|deshalb|deswegen',x:'Sve znači „jer / zato", ali red riječi je drugačiji:<br><b>weil</b> → glagol na <b>kraj</b>: …, weil ich krank <b>bin</b>.<br><b>denn</b> → normalan red: …, denn ich <b>bin</b> krank.<br><b>deshalb</b> = zato → glagol <b>odmah iza</b>: Ich bin krank, deshalb <b>bleibe</b> ich zu Hause.',
 ex:[['Ich komme nicht, ___ ich krank bin.','weil',['weil','denn'],'Ne dolazim jer sam bolestan.'],['Ich komme nicht, ___ ich bin krank.','denn',['denn','weil'],'Ne dolazim, jer sam bolestan.'],['Ich bin müde, ___ gehe ich früh schlafen.','deshalb',['deshalb','weil'],'Umoran sam, zato idem rano spavati.']]},
{id:'sondern',lv:'A2',t:'aber / sondern',k:'aber|sondern',x:'<b>aber</b> = ali (dodaje suprotnost): Das Auto ist alt, aber gut.<br><b>sondern</b> = nego / već, samo poslije <b>nicht/kein</b>: Nicht heute, sondern morgen.',
 ex:[['Ich trinke keinen Kaffee, ___ Tee.','sondern',['sondern','aber'],'Ne pijem kafu, nego čaj.'],['Die Wohnung ist klein, ___ billig.','aber',['aber','sondern'],'Stan je mali, ali jeftin.']]},
{id:'nicht',lv:'A1',t:'nicht / kein',k:'nicht|kein\\w*',x:'<b>kein</b> negira imenicu bez člana ili s „ein": Ich habe <b>kein</b> Auto.<br><b>nicht</b> negira glagol, pridjev ili imenicu s određenim članom: Ich komme <b>nicht</b>. Das ist <b>nicht</b> mein Auto.',
 ex:[['Ich habe ___ Zeit.','keine',['keine','nicht'],'Nemam vremena.'],['Das Essen ist ___ gut.','nicht',['nicht','kein'],'Hrana nije dobra.'],['Er hat ___ Kinder.','keine',['keine','nicht'],'On nema djece.']]},
{id:'mal',lv:'A2',t:'Mal / Zeit / Uhr / Stunde',k:'mal\\w*|zeit\\w*|uhr\\w*|stund\\w*',x:'<b>das Mal</b> = put (koliko puta): zum ersten Mal, dreimal.<br><b>die Zeit</b> = vrijeme (općenito): Ich habe keine Zeit.<br><b>die Uhr</b> = sat (uređaj) / koliko je sati: Es ist 3 Uhr.<br><b>die Stunde</b> = sat (60 minuta).',
 ex:[['Ich bin zum ersten ___ in Hamburg.','Mal',['Mal','Zeit'],'Prvi put sam u Hamburgu.'],['Der Film dauert zwei ___.','Stunden',['Stunden','Uhr'],'Film traje dva sata.'],['Wie viel ___ ist es?','Uhr',['Uhr','Stunde'],'Koliko je sati?']]},
{id:'machen',lv:'A1',t:'machen / tun',k:'mach\\w*|gemacht|tu|tue|tun|tut|getan',x:'Često isto (raditi), ali u izrazima:<br><b>machen</b>: Hausaufgaben machen, Urlaub machen, Sport machen, Pause machen.<br><b>tun</b>: Das tut weh (boli), Es tut mir leid (žao mi je), Was kann ich für Sie tun?',
 ex:[['Mein Kopf ___ weh.','tut',['tut','macht'],'Boli me glava.'],['Im Sommer ___ wir Urlaub in Kroatien.','machen',['machen','tun'],'Ljeti idemo na odmor u Hrvatsku.']]},
{id:'erinnern',lv:'B1',t:'erinnern / sich erinnern / merken',k:'erinner\\w*|merk\\w*',x:'<b>jdn. an etw. erinnern</b> = podsjetiti nekoga: Erinnere mich an den Termin!<br><b>sich an etw. erinnern</b> = sjetiti se: Ich erinnere mich an den Urlaub.<br><b>sich etw. merken</b> = zapamtiti: Das muss ich mir merken.',
 ex:[['Kannst du mich morgen an den Termin ___?','erinnern',['erinnern','merken'],'Možeš li me sutra podsjetiti na termin?'],['Ich kann mir keine Namen ___.','merken',['merken','erinnern'],'Ne mogu zapamtiti imena.'],['___ du dich an unseren ersten Tag?','Erinnerst',['Erinnerst','Merkst'],'Sjećaš li se našeg prvog dana?']]},
{id:'entscheiden',lv:'B1',t:'entscheiden / beschließen / sich entschließen',k:'entscheid\\w*|entschied\\w*|beschließ\\w*|beschloss\\w*|entschloss\\w*',x:'<b>(sich) entscheiden</b> = odlučiti (između opcija): Ich habe mich für das blaue Auto entschieden.<br><b>beschließen</b> = zaključiti / odlučiti (formalno, grupa): Die Firma hat beschlossen…<br><b>sich entschließen</b> = odlučiti se (nakon dugog razmišljanja).',
 ex:[['Ich kann mich nicht ___.','entscheiden',['entscheiden','beschließen'],'Ne mogu se odlučiti.'],['Der Stadtrat hat ___, ein neues Bad zu bauen.','beschlossen',['beschlossen','entschieden sich'],'Gradsko vijeće je odlučilo izgraditi novi bazen.']]},
{id:'scheinen',lv:'B1',t:'scheinen / aussehen / wirken',k:'schein\\w*|schien\\w*|aussehen|sieht … aus|wirk\\w*',x:'<b>aussehen</b> = izgledati (vanjski izgled): Du siehst müde aus.<br><b>scheinen (zu)</b> = činiti se: Er scheint krank zu sein.<br><b>wirken</b> = djelovati (utisak): Sie wirkt nervös.',
 ex:[['Du ___ heute toll aus!','siehst',['siehst','scheinst'],'Danas izgledaš super!'],['Die Lösung ___ einfach zu sein.','scheint',['scheint','sieht'],'Rješenje se čini jednostavnim.']]},
{id:'bekannt',lv:'B1',t:'bekannt / berühmt / beliebt',k:'bekannt\\w*|berühmt\\w*|beliebt\\w*',x:'<b>bekannt</b> = poznat (ljudi ga znaju) / poznanik.<br><b>berühmt</b> = slavan (jako poznat).<br><b>beliebt</b> = omiljen, popularan (ljudi ga vole).',
 ex:[['Mozart ist auf der ganzen Welt ___.','berühmt',['berühmt','beliebt'],'Mozart je slavan u cijelom svijetu.'],['Der Lehrer ist bei allen Schülern sehr ___.','beliebt',['beliebt','berühmt'],'Nastavnik je jako omiljen kod svih učenika.']]},
{id:'eigentlich',lv:'B1',t:'eigentlich / tatsächlich / wirklich',k:'eigentlich|tatsächlich|wirklich',x:'<b>eigentlich</b> = zapravo, u stvari (ublažava ili mijenja plan): Eigentlich wollte ich heute arbeiten, aber…<br><b>tatsächlich</b> = zaista, stvarno (potvrda činjenice).<br><b>wirklich</b> = stvarno (pojačanje): Das ist wirklich gut.',
 ex:[['___ wollte ich zu Hause bleiben, aber dann bin ich doch gekommen.','Eigentlich',['Eigentlich','Tatsächlich'],'Zapravo sam htio ostati kod kuće, ali sam ipak došao.']]},
{id:'brauchen',lv:'B1',t:'brauchen / müssen / nicht brauchen zu',k:'brauch\\w*|muss\\w*|müss\\w*',x:'<b>müssen</b> = morati. <b>brauchen</b> = trebati (nešto).<br>Negacija od „müssen" je često <b>nicht brauchen zu</b> = ne treba: Du brauchst nicht zu kommen. (= Du musst nicht kommen.)<br>⚠️ <b>Du musst nicht</b> = ne moraš (≠ ne smiješ = du darfst nicht).',
 ex:[['Du ___ morgen nicht zu kommen, wir sind fertig.','brauchst',['brauchst','musst'],'Ne trebaš sutra doći, gotovi smo.'],['Hier ___ man nicht rauchen. Das ist verboten!','darf',['darf','muss'],'Ovdje se ne smije pušiti. Zabranjeno je!']]},
{id:'bis',lv:'B1',t:'bis / bevor / während / nachdem',k:'bis|bevor|während|nachdem',x:'<b>bis</b> = dok ne / do: Warte, bis ich komme.<br><b>bevor</b> = prije nego što.<br><b>während</b> = dok / za vrijeme (istovremeno).<br><b>nachdem</b> = nakon što (+ pluskvamperfekt / perfekt).',
 ex:[['Wasch dir die Hände, ___ du isst.','bevor',['bevor','bis'],'Operi ruke prije nego što jedeš.'],['Ich warte hier, ___ du fertig bist.','bis',['bis','während'],'Čekam ovdje dok ne završiš.'],['___ ich koche, höre ich Musik.','Während',['Während','Nachdem'],'Dok kuham, slušam muziku.']]},
{id:'dass',lv:'B1',t:'dass / das',k:'dass|das',x:'<b>das</b> = član ili zamjenica (to, koji): das Auto, das ich kaufe.<br><b>dass</b> = veznik „da": Ich glaube, <b>dass</b> er kommt.<br>Trik: ako možeš reći „dieses/welches", piše se <b>das</b>.',
 ex:[['Ich hoffe, ___ du bald kommst.','dass',['dass','das'],'Nadam se da ćeš brzo doći.'],['Das ist das Buch, ___ ich gelesen habe.','das',['das','dass'],'To je knjiga koju sam pročitao.']]},
{id:'zwar',lv:'B2',t:'zwar … aber / einerseits … andererseits / sowohl … als auch',k:'zwar|einerseits|andererseits|sowohl',x:'<b>zwar … aber</b> = doduše … ali (priznaješ nešto, pa suprotno).<br><b>einerseits … andererseits</b> = s jedne strane … s druge strane (dvije strane).<br><b>sowohl … als auch</b> = i … i (oboje).',
 ex:[['Die Wohnung ist ___ teuer, aber sehr schön.','zwar',['zwar','sowohl'],'Stan je doduše skup, ali jako lijep.'],['Ich spreche ___ Deutsch als auch Englisch.','sowohl',['sowohl','zwar'],'Govorim i njemački i engleski.']]},
{id:'obwohl',lv:'B1',t:'obwohl / trotzdem / trotz',k:'obwohl|trotzdem|trotz',x:'Sve znači „iako/ipak", ali:<br><b>obwohl</b> + glagol na kraj: Obwohl es regnet, gehe ich raus.<br><b>trotzdem</b> + glagol odmah iza: Es regnet, trotzdem gehe ich raus.<br><b>trotz</b> + genitiv: Trotz des Regens gehe ich raus.',
 ex:[['___ ich müde bin, lerne ich noch.','Obwohl',['Obwohl','Trotzdem'],'Iako sam umoran, još učim.'],['Ich bin müde, ___ lerne ich noch.','trotzdem',['trotzdem','obwohl'],'Umoran sam, ipak još učim.'],['___ des Staus sind wir pünktlich.','Trotz',['Trotz','Obwohl'],'Uprkos gužvi stigli smo na vrijeme.']]},
{id:'damit',lv:'B1',t:'damit / um … zu',k:'damit|um',x:'Oba = „da bi":<br><b>um … zu</b> kad je <i>isti</i> subjekt: Ich lerne, um die Prüfung zu bestehen.<br><b>damit</b> kad su <i>različiti</i> subjekti (ili oboje moguće): Ich spreche langsam, damit du mich verstehst.',
 ex:[['Ich spare, ___ ein Auto zu kaufen.','um',['um','damit'],'Štedim da bih kupio auto.'],['Ich erkläre es dir, ___ du es verstehst.','damit',['damit','um'],'Objašnjavam ti da bi razumio.']]},
{id:'lassen',lv:'B1',t:'lassen / verlassen / zulassen',k:'lass\\w*|ließ\\w*|gelassen|verlass\\w*|verließ\\w*',x:'<b>lassen</b> = ostaviti / pustiti / dati da neko uradi: Ich lasse das Auto reparieren (dajem auto na popravku).<br><b>verlassen</b> = napustiti (mjesto, osobu): Er verlässt das Haus um 7.<br><b>zulassen</b> = dozvoliti / registrovati (auto).',
 ex:[['Ich ___ mir die Haare schneiden.','lasse',['lasse','verlasse'],'Šišam se (kod frizera).'],['Bitte ___ Sie den Raum.','verlassen',['verlassen','lassen'],'Molim vas napustite prostoriju.']]},
{id:'ausmachen',lv:'B1',t:'ausmachen (3 značenja)',k:'ausmach\\w*|macht … aus|ausgemacht',x:'<b>ausmachen</b> ima tri značenja:<br>1) isključiti: Mach das Licht aus!<br>2) dogovoriti: einen Termin ausmachen.<br>3) smetati: Das macht mir nichts aus (ne smeta mi).',
 ex:[['Macht es dir etwas ___, wenn ich das Fenster öffne?','aus',['aus','an'],'Smeta li ti ako otvorim prozor?']]},
{id:'aufhoeren',lv:'B1',t:'aufhören / beenden / enden',k:'aufhör\\w*|hört … auf|beend\\w*|end\\w*',x:'<b>aufhören (mit)</b> = prestati (osoba prestaje nešto raditi): Ich höre mit dem Rauchen auf.<br><b>beenden</b> = završiti nešto (+ akuzativ): Ich beende das Gespräch.<br><b>enden</b> = završiti se (samo od sebe): Der Film endet um 22 Uhr.',
 ex:[['Der Kurs ___ im Juli.','endet',['endet','beendet'],'Kurs se završava u julu.'],['Ich möchte mit dem Rauchen ___.','aufhören',['aufhören','beenden'],'Želim prestati pušiti.']]},
{id:'gewinnen',lv:'B1',t:'gewinnen / verdienen / bekommen',k:'gewinn\\w*|gewann\\w*|gewonnen|verdien\\w*',x:'<b>gewinnen</b> = pobijediti / dobiti na igri, lotu.<br><b>verdienen</b> = zaraditi (radom) / zaslužiti.<br><b>bekommen</b> = dobiti (nešto što ti neko da).',
 ex:[['Wie viel ___ du im Monat?','verdienst',['verdienst','gewinnst'],'Koliko zarađuješ mjesečno?'],['Bayern hat das Spiel ___.','gewonnen',['gewonnen','verdient'],'Bayern je pobijedio u utakmici.']]},
{id:'vorstellen',lv:'B1',t:'sich vorstellen (2 značenja)',k:'vorstell\\w*|stell\\w* … vor',x:'<b>sich (A) vorstellen</b> = predstaviti se: Darf ich mich vorstellen?<br><b>sich (D) etwas vorstellen</b> = zamisliti: Ich kann <b>mir</b> das nicht vorstellen.',
 ex:[['Ich kann ___ ein Leben ohne Handy nicht vorstellen.','mir',['mir','mich'],'Ne mogu zamisliti život bez mobitela.'],['Darf ich ___ kurz vorstellen? Ich heiße Anel.','mich',['mich','mir'],'Smijem li se kratko predstaviti? Zovem se Anel.']]},
{id:'ergebnis',lv:'B2',t:'Ergebnis / Folge / Wirkung / Auswirkung',k:'ergebnis\\w*|folge\\w*|wirkung\\w*|auswirkung\\w*',x:'<b>das Ergebnis</b> = rezultat (ispita, istraživanja).<br><b>die Folge</b> = posljedica (često negativna).<br><b>die Wirkung</b> = djelovanje, efekat (lijeka, mjere).<br><b>die Auswirkung (auf)</b> = uticaj / posljedica na nešto.',
 ex:[['Die ___ des Tests sind sehr gut.','Ergebnisse',['Ergebnisse','Folgen'],'Rezultati testa su jako dobri.'],['Das Medikament zeigt keine ___.','Wirkung',['Wirkung','Folge'],'Lijek ne djeluje.'],['Der Klimawandel hat große ___ auf die Landwirtschaft.','Auswirkungen',['Auswirkungen','Ergebnisse'],'Klimatske promjene imaju velik uticaj na poljoprivredu.']]},
{id:'zunehmen',lv:'B2',t:'zunehmen / steigen / erhöhen / sich verbessern',k:'zunehm\\w*|nimmt … zu|zugenommen|steig\\w*|stieg\\w*|erhöh\\w*|verbesser\\w*',x:'<b>steigen</b> = rasti (cijene, broj): Die Preise steigen.<br><b>zunehmen</b> = povećati se / udebljati se.<br><b>erhöhen</b> = povećati nešto (+ akuzativ): Die Firma erhöht die Löhne.<br><b>sich verbessern</b> = poboljšati se.',
 ex:[['Die Mieten sind stark ___.','gestiegen',['gestiegen','erhöht'],'Najamnine su jako porasle.'],['Die Regierung will die Steuern ___.','erhöhen',['erhöhen','steigen'],'Vlada želi povećati poreze.']]},
{id:'meinung',lv:'B2',t:'meinen / denken / glauben / finden / halten für',k:'mein\\w*|denk\\w*|glaub\\w*|find\\w*|halt\\w*|hält',x:'Za mišljenje:<br><b>Ich finde</b> (lični ukus/ocjena): Ich finde den Film gut.<br><b>Ich glaube / denke</b> (pretpostavka): Ich glaube, er kommt.<br><b>Ich meine</b> (moj stav): Ich meine, dass…<br><b>Ich halte X für Y</b> = smatram X za Y: Ich halte das für falsch.',
 ex:[['Ich ___ das für eine gute Idee.','halte',['halte','finde'],'Smatram to dobrom idejom.'],['Wie ___ du mein neues Kleid?','findest',['findest','hältst'],'Kako ti se sviđa moja nova haljina?']]},
{id:'bewerben',lv:'B2',t:'sich bewerben / bewerten / bewältigen',k:'bewerb\\w*|bewarb\\w*|beworben|bewert\\w*|bewältig\\w*',x:'<b>sich bewerben (um/bei)</b> = prijaviti se za posao.<br><b>bewerten</b> = ocijeniti, vrednovati.<br><b>bewältigen</b> = savladati (težak zadatak, problem).',
 ex:[['Ich habe mich bei Siemens ___.','beworben',['beworben','bewertet'],'Prijavio sam se u Siemens.'],['Die Prüfer ___ den Text.','bewerten',['bewerten','bewerben'],'Ispitivači ocjenjuju tekst.']]},
{id:'aktuell',lv:'B2',t:'⚠️ aktuell / eventuell / Chef (lažni prijatelji)',k:'aktuell\\w*|eventuell\\w*',x:'<b>aktuell</b> = trenutan, aktuelan (NE „stvaran").<br><b>eventuell</b> = možda, eventualno.<br><b>der Chef</b> = šef (NE „kuhar" = der Koch).<br><b>die Kritik</b> = kritika · <b>das Gymnasium</b> = gimnazija (NE teretana = das Fitnessstudio).',
 ex:[['Ich komme ___ später, ich weiß es noch nicht.','eventuell',['eventuell','aktuell'],'Možda dođem kasnije, još ne znam.']]},
{id:'passieren',lv:'B1',t:'passieren / geschehen / stattfinden',k:'passier\\w*|gescheh\\w*|geschah\\w*|stattfind\\w*|findet … statt|stattgefunden',x:'<b>passieren / geschehen</b> = desiti se (često neplanirano): Was ist passiert?<br><b>stattfinden</b> = održati se (planiran događaj): Das Konzert findet morgen statt.',
 ex:[['Das Fest ___ im Park ___.','findet … statt',['findet … statt','passiert'],'Proslava se održava u parku.'],['Was ist hier ___?','passiert',['passiert','stattgefunden'],'Šta se ovdje desilo?']]},
];
const confById=id=>CONF.find(c=>c.id===id);
const CONFRX=CONF.map(c=>[c,new RegExp('^(?:'+c.k+')$','i')]);
const CNOUN=new Set(['stelle','termin','mal','ergebnis']);
function confFor(ex){if(!ex||!ex.w||ex.s)return null;const toks=String(ex.w.de).replace(/^(der|die|das|sich)\s+/i,'').split(/[\s\/,]+/).filter(Boolean);
  for(const [c,rx] of CONFRX)if(toks.some(t=>rx.test(t)&&(CNOUN.has(c.id)?/^[A-ZÄÖÜ]/.test(t):/^[a-zäöüß]/.test(t))))return c;return null;}
const fillBl=(s,a)=>{const p=a.split(' … ');let i=0;let o=s.replace(/___/g,()=>{const v=p[i]!==undefined?p[i]:'';i++;return v;});return o;};
function confCard(c){return `<div class="sh-h" style="color:#ffc800">⚖️ Pazi na razliku · ${c.lv}</div><h3>${esc(c.t)}</h3><div class="note" style="line-height:1.55">${c.x}</div>
  <div class="small" style="font-weight:900;margin:10px 0 4px">Primjeri</div>${c.ex.map(e=>`<div class="wrow">${spkBtn(fillBl(e[0],e[1]))}<div class="tx"><div class="d">${esc(fillBl(e[0],e[1]))}</div><div class="b">${esc(e[3])}</div></div></div>`).join('')}`;}
function confSheet(id){const c=confById(id);if(!c)return;sheet(confCard(c)+`<button class="btn" id="cdr">✏️ Vježbaj ovaj par</button><button class="btn ghost" id="ccx">Zatvori</button>`);$('#cdr').onclick=()=>confDrill([id]);$('#ccx').onclick=closeSheet;}
function confDrill(ids){drillRun(shuf(CONF.filter(c=>ids.includes(c.id)).flatMap(c=>c.ex.map(e=>({t:'⚖️ '+c.t,e})))).slice(0,10),pct=>{if(pct>=70)ids.forEach(id=>{if(S.confm)delete S.confm[id];});});}
function drillRun(pool,done){let i=0,ok=0;
  const step=()=>{if(i>=pool.length){const pct=Math.round(ok/pool.length*100);if(done)done(pct);save();sheet(`<div style="text-align:center">${mascot(80,pct>=70?'happy':'sad')}<h3>${ok} / ${pool.length} tačno</h3><p class="muted">${pct>=70?'Odlično! 💪':'Pročitaj objašnjenje još jednom i probaj ponovo.'}</p></div><button class="btn" id="cdx">Gotovo</button>`);$('#cdx').onclick=()=>{closeSheet();render();};return;}
    const {t,e}=pool[i];sheet(`<div class="sh-h" style="color:#ffc800">${esc(t)} · ${i+1}/${pool.length}</div><h3 style="line-height:1.4">${esc(e[0]).replace(/___/g,'<span class="blank">____</span>')}</h3><p class="muted small" style="font-weight:600">${esc(e[3])}</p><div class="opts">${shuf(e[2].slice()).map(o=>`<button class="opt" data-co="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="cfb"></div>`);
    document.querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>{const good=b.dataset.co===e[1];if(good)ok++;beep(good?'ok':'bad');document.querySelectorAll('[data-co]').forEach(x=>{x.disabled=true;if(x.dataset.co===e[1])x.classList.add('right');else if(x===b)x.classList.add('wrong');});
      const full=fillBl(e[0],e[1]).replace(/\s–\s/,' ');$('#cfb').innerHTML=`<div class="note" style="margin-top:10px">${good?'✅':'❌'} ${esc(full)}</div><button class="btn" id="cnx">Dalje</button>`;speak(full);$('#cnx').onclick=()=>{i++;step();};});};
  step();}
function vConf(m){const lv=S.confLv||'A1',mis=S.confm||{};
  m.innerHTML=`<h2 class="t">⚖️ Pazi na razliku</h2><p class="muted" style="font-weight:600;margin-top:-6px">Riječi koje zvuče slično ili imaju slično značenje, a koriste se drugačije. Kad pogriješiš u lekciji, ovdje se označi par (🔴).</p>
  <div class="seg" style="margin-bottom:10px">${['A1','A2','B1','B2'].map(l=>`<button class="${l===lv?'on':''}" data-clv="${l}">${l}</button>`).join('')}</div>
  <button class="btn blue" id="cdall">✏️ Vježbaj sve parove ${lv}</button>${Object.keys(mis).length?`<button class="btn red" id="cdmis">🔴 Vježbaj moje greške (${Object.keys(mis).length})</button>`:''}

{id:'adjdekl',lv:'A2',ic:'🎨',t:'Pridjevi ispred imenice (nastavci)',x:'Poslije <b>der/die/das</b>: najčešće <b>-e</b>, a u akuzativu muškog, dativu i množini <b>-en</b>: der alt<b>e</b> Mann, den alt<b>en</b> Mann, mit dem alt<b>en</b> Mann.<br>Poslije <b>ein</b>: pridjev pokazuje rod: ein alt<b>er</b> Mann, eine alt<b>e</b> Frau, ein alt<b>es</b> Auto, einen alt<b>en</b> Mann.<br>Bez člana: frisch<b>es</b> Brot, kalt<b>e</b> Milch, heiß<b>er</b> Kaffee.',

{id:'relativ',lv:'B1',ic:'🔁',t:'Odnosne rečenice (der, die, das…)',x:'Odnosna zamjenica = član, ali u dativu množine <b>denen</b> i genitivu <b>dessen/deren</b>. Rod i broj od imenice, padež od glagola u odnosnoj rečenici. Glagol na kraj.<br>Der Mann, <b>der</b> dort steht, ist mein Chef. (nom.)<br>Der Mann, <b>den</b> ich kenne… (akuz.)<br>Der Mann, <b>dem</b> ich helfe… (dat.)<br>Die Kollegen, <b>mit denen</b> ich arbeite…',

{id:'passiv',lv:'B1',ic:'🏭',t:'Pasiv',x:'<b>werden + particip</b>: fokus na radnji, ne na osobi.'+GT([['vrijeme','primjer'],['prezent','Das Auto <b>wird repariert</b>.'],['präteritum','Das Auto <b>wurde repariert</b>.'],['perfekt','Das Auto <b>ist repariert worden</b>.'],['s modalnim','Das Auto <b>muss repariert werden</b>.']])+'Ko radi: <b>von</b> + dativ: Das Haus wurde von meinem Opa gebaut.',

{id:'konj2',lv:'B1',ic:'💭',t:'Konjunktiv II: želje i nestvarno',x:'<b>würde + infinitiv</b> za većinu glagola: Ich <b>würde</b> gern reisen.<br>Posebni oblici: wäre, hätte, könnte, müsste, dürfte, sollte, wüsste, käme, ginge.<br>Kondicional: <b>Wenn</b> ich Zeit <b>hätte</b>, <b>würde</b> ich mehr lernen.<br>Prošlost: Wenn ich das gewusst <b>hätte</b>, <b>wäre</b> ich gekommen.<br>Savjet: An deiner Stelle <b>würde</b> ich…',

{id:'zuinf',lv:'B1',ic:'➡️',t:'Infinitiv sa zu · um … zu · ohne … zu',x:'Poslije mnogih glagola i izraza: Ich habe keine Lust, heute <b>zu</b> arbeiten. Es ist wichtig, pünktlich <b>zu</b> sein. Ich versuche, mehr <b>zu</b> lernen.<br>Odvojivi: an<b>zu</b>rufen, auf<b>zu</b>stehen.<br><b>um … zu</b> = da bi · <b>ohne … zu</b> = bez da · <b>(an)statt … zu</b> = umjesto da.<br>Modalni glagoli NEMAJU zu: Ich muss arbeiten.',

{id:'plusq',lv:'B1',ic:'⏮️',t:'Pluskvamperfekt',x:'Radnja <b>prije</b> druge radnje u prošlosti: <b>hatte/war + particip</b>.<br><b>Nachdem</b> ich gegessen <b>hatte</b>, ging ich spazieren.<br>Als ich ankam, <b>war</b> der Zug schon <b>abgefahren</b>.',

{id:'genitiv',lv:'B1',ic:'🔑',t:'Genitiv (čiji?)',x:GT([['','muški','ženski','srednji','množina'],['genitiv','des …(e)s','der','des …(e)s','der']])+'das Auto <b>des</b> Vater<b>s</b> · die Wohnung <b>der</b> Frau · die Farbe <b>des</b> Haus<b>es</b>.<br>Prijedlozi s genitivom: <b>wegen, trotz, während, statt, innerhalb, außerhalb</b>.<br>U govoru često <b>von + dativ</b>: das Auto von meinem Vater.',

{id:'futur',lv:'B1',ic:'🔮',t:'Futur I',x:'<b>werden + infinitiv</b> (kraj): Ich <b>werde</b> morgen <b>arbeiten</b>.<br>Koristi se za planove, obećanja i pretpostavke: Er <b>wird</b> wohl krank <b>sein</b> (vjerovatno je bolestan).<br>Za budućnost često dovoljan prezent + vrijeme: Morgen fahre ich nach Wien.',

{id:'ndekl',lv:'B1',ic:'🧑‍🎓',t:'N-deklinacija',x:'Neke muške imenice dobijaju <b>-(e)n</b> u svim padežima osim nominativa: der Kunde → den Kunde<b>n</b>, dem Kunde<b>n</b>.<br>Grupe: osobe na <b>-e</b> (Kollege, Junge, Kunde), <b>-ent, -ant, -ist</b> (Student, Praktikant, Polizist), i: Herr (→ Herr<b>n</b>), Mensch, Nachbar, Bauer.',

{id:'passiv2',lv:'B2',ic:'🏗️',t:'Pasiv: stanje, alternative i modalni',x:'<b>Zustandspassiv</b> (stanje) = sein + particip: Die Tür <b>ist geöffnet</b>. (vs. Die Tür <b>wird geöffnet</b> – radnja)<br><b>Alternative pasivu</b>:<br>• man: Man repariert das Auto.<br>• sein + zu: Das Formular <b>ist</b> bis Freitag ab<b>zu</b>geben (= muss abgegeben werden).<br>• sich lassen: Das Problem <b>lässt sich</b> lösen (= kann gelöst werden).<br>• -bar: Das ist <b>machbar</b> (= kann gemacht werden).',

{id:'konj1',lv:'B2',ic:'🗞️',t:'Konjunktiv I (indirektni govor)',x:'U novinama za prenošenje tuđih riječi: osnova + <b>-e</b>.<br>Er sagt, er <b>habe</b> keine Zeit. · Sie sagt, sie <b>sei</b> krank. · Der Minister erklärte, die Lage <b>werde</b> besser.<br><b>sein</b>: ich sei, du sei(e)st, er sei, wir seien, sie seien.<br>Ako je Konj. I isti kao prezent (wir haben), koristi se Konj. II: Sie sagen, sie <b>hätten</b> keine Zeit.<br>Prošlost: Er sagt, er <b>habe</b> das nicht <b>gewusst</b>.',
 ex:[['Der Sprecher sagte, die Firma ___ in einer schwierigen Lage.','sei',['sei','ist','wäre'],'Glasnogovornik je rekao da je firma u teškoj situaciji.'],['Sie behauptet, sie ___ nichts gesehen.','habe',['habe','hat','hätte'],'Ona tvrdi da ništa nije vidjela.'],['Die Arbeiter sagen, sie ___ mehr Geld. (wir haben = isto)','hätten',['hätten','haben','habe'],'Radnici kažu da imaju (žele) više novca.']]},
{id:'partizip',lv:'B2',ic:'🧩',t:'Particip kao pridjev',x:'<b>Partizip I</b> (radnja traje, aktivno) = infinitiv + d: das <b>schlafende</b> Kind (dijete koje spava).<br><b>Partizip II</b> (završeno / pasivno): das <b>reparierte</b> Auto (auto koje je popravljeno).<br>Proširen atribut (tipično B2 čitanje): die <b>seit Jahren steigenden</b> Mieten = die Mieten, die seit Jahren steigen.',

{id:'nominal',lv:'B2',ic:'📄',t:'Nominalizacija (formalni stil)',x:'U formalnim tekstovima glagoli postaju imenice:<br>abfahren → die Abfahrt · entscheiden → die Entscheidung · ankommen → die Ankunft · sich bewerben → die Bewerbung.<br>Rečenica → izraz: <b>Weil</b> es regnete, … → <b>Wegen des Regens</b> … · <b>Nachdem</b> er angekommen war → <b>Nach seiner Ankunft</b> · <b>Während</b> wir arbeiten → <b>Während der Arbeit</b> · <b>Wenn</b> man Fragen hat → <b>Bei Fragen</b>.',
 ex:[['Wenn Sie Fragen haben = ___ Fragen','Bei',['Bei','Mit','Von'],'Ako imate pitanja = Kod pitanja'],['Nachdem er angekommen war = Nach seiner ___','Ankunft',['Ankunft','Ankommung','Ankommen'],'Nakon njegovog dolaska'],['Weil es stark regnete = Wegen ___ starken Regens','des',['des','dem','der'],'Zbog jake kiše'],['Die Firma hat entschieden → die ___ der Firma','Entscheidung',['Entscheidung','Entscheid','Entschiedung'],'odluka firme']]},
{id:'konnekt',lv:'B2',ic:'🪢',t:'Dvodijelni veznici',x:'<b>sowohl … als auch</b> = i … i · <b>weder … noch</b> = ni … ni · <b>entweder … oder</b> = ili … ili · <b>nicht nur … sondern auch</b> = ne samo … nego i · <b>zwar … aber</b> = doduše … ali · <b>je … desto</b> = što … to: <b>Je</b> mehr ich lerne, <b>desto</b> besser spreche ich.',

{id:'modsubj',lv:'B2',ic:'🤔',t:'Modalni glagoli za pretpostavku',x:'Koliko si siguran?<br><b>muss</b> = sigurno (95 %): Er <b>muss</b> krank sein.<br><b>dürfte</b> = vjerovatno (75 %): Das <b>dürfte</b> stimmen.<br><b>kann/könnte</b> = moguće (50 %): Sie <b>könnte</b> im Stau stehen.<br><b>soll</b> = navodno (kažu drugi): Er <b>soll</b> sehr reich sein.<br><b>will</b> = tvrdi sam za sebe: Er <b>will</b> nichts gesehen haben.',

{id:'nvv',lv:'B2',ic:'🏛️',t:'Imenica + glagol (Funktionsverbgefüge)',x:'Formalni izrazi gdje imenica nosi značenje:<br>eine Entscheidung <b>treffen</b> (= entscheiden) · eine Frage <b>stellen</b> · Kritik <b>üben</b> · in Frage <b>kommen</b> · zur Verfügung <b>stehen/stellen</b> · in Kraft <b>treten</b> · Rücksicht <b>nehmen</b> auf · einen Antrag <b>stellen</b> · Bescheid <b>geben/sagen</b> · zum Ausdruck <b>bringen</b>.',

{id:'es',lv:'B2',ic:'🌀',t:'Upotreba „es"',x:'<b>es</b> kao formalni subjekt: <b>Es</b> regnet. <b>Es</b> gibt… <b>Es</b> geht mir gut.<br>Kao najava zavisne rečenice: Ich finde <b>es</b> wichtig, dass… · <b>Es</b> ist schade, dass…<br>U pasivu bez subjekta: <b>Es</b> wird viel gearbeitet. → Heute wird viel gearbeitet (es nestaje kad nije na 1. mjestu).',
 ex:[['___ ist wichtig, regelmäßig zu üben.','Es',['Es','Das','Man'],'Važno je redovno vježbati.'],['Hier wird ___ nicht geraucht.','–',['–','es','man'],'Ovdje se ne puši.'],['Ich finde ___ toll, dass du hilfst.','es',['es','das ist','–'],'Super mi je što pomažeš.']]},
];
function gramSheet(id){const g=GRAM.find(x=>x.id===id);if(!g)return;const sc=(S.gram||{})[id];
  sheet(`<div class="sh-h" style="color:var(--blue)">📐 Gramatika · ${g.lv}</div><h3>${g.ic} ${esc(g.t)}</h3><div class="gx">${g.x}</div><div class="small" style="font-weight:900;margin:10px 0 4px">Primjeri</div>${g.ex.slice(0,3).map(e=>{const f=fillBl(e[0],e[1]).replace(/\s–\s/,' ');return `<div class="wrow">${spkBtn(f)}<div class="tx"><div class="d">${esc(f)}</div><div class="b">${esc(e[3])}</div></div></div>`;}).join('')}${sc!=null?`<p class="small muted">Najbolji rezultat: <b>${sc} %</b></p>`:''}<button class="btn" id="gdr">✏️ Vježbaj (${g.ex.length} zadataka)</button><button class="btn ghost" id="gcl">Zatvori</button>`);
  $('#gdr').onclick=()=>drillRun(shuf(g.ex.map(e=>({t:'📐 '+g.t,e}))),pct=>{S.gram=S.gram||{};S.gram[id]=Math.max(pct,S.gram[id]||0);});$('#gcl').onclick=closeSheet;}
function vGram(m){const lv=S.gramLv||'A1',G=S.gram||{},list=GRAM.filter(g=>g.lv===lv),done=list.filter(g=>(G[g.id]||0)>=70).length;
  m.innerHTML=`<h2 class="t">📐 Gramatika</h2><p class="muted" style="font-weight:600;margin-top:-6px">Kratka pravila na bosanskom, tabele i vježbe. Tema je savladana (✓) kad imaš 70 % ili više.</p>
  <div class="seg" style="margin-bottom:10px">${['A1','A2','B1','B2'].map(l=>`<button class="${l===lv?'on':''}" data-glv="${l}">${l}</button>`).join('')}</div>
  <div class="gbar" style="margin:4px 0 10px"><i style="width:${Math.round(done/list.length*100)}%"></i></div><div class="small muted" style="font-weight:700;margin-bottom:8px">${done} / ${list.length} tema savladano</div>
  ${list.map(g=>`<button class="xmod" data-gr="${g.id}"><span class="xi">${g.ic}</span><span class="xt"><b>${esc(g.t)}</b><br><span class="small muted">${g.ex.length} zadataka</span></span><span class="xs ${G[g.id]==null?'':G[g.id]>=70?'ok':'bad'}">${G[g.id]==null?'›':G[g.id]>=70?'✓':G[g.id]+' %'}</span></button>`).join('')}`;
  m.querySelectorAll('[data-glv]').forEach(b=>b.onclick=()=>{S.gramLv=b.dataset.glv;save();render();});
  m.querySelectorAll('[data-gr]').forEach(b=>b.onclick=()=>gramSheet(b.dataset.gr));}

function redeHtml(R,ins){const sp=x=>x.split('|');return `<div class="sh-h" style="color:#58cc02">💬 Fraze · ${R.lv}</div><h3>${R.ic} ${esc(R.t)}</h3>${ins?'<p class="small muted" style="font-weight:600">Tapni frazu da je ubaciš u tekst.</p>':''}${R.tpl&&ins?`<button class="btn blue sm" data-rtpl="1">📋 Ubaci cijeli šablon</button>`:R.tpl?`<details class="xtrans"><summary>📋 Šablon</summary><div>${fmtT(R.tpl)}</div></details>`:''}
  ${R.g.map(([h,ps])=>`<div class="small" style="font-weight:900;margin:12px 0 4px">${esc(h)}</div>${ps.map(p=>{const [de,bs]=sp(p);return `<div class="wrow rph" ${ins?`data-rins="${esc(de)}"`:''}>${spkBtn(de)}<div class="tx"><div class="d">${esc(de)}</div><div class="b">${esc(bs)}</div></div>${ins?'<span class="small" style="color:#58cc02;font-weight:900">＋</span>':''}</div>`;}).join('')}`).join('')}`;}
function redeSheet(id,ti){const R=REDE.find(r=>r.id===id);if(!R)return;const ins=ti!=null&&!!document.querySelector(`[data-wc="${ti}"]`);
  sheet(redeHtml(R,ins)+`<button class="btn ghost" id="rcl">Zatvori</button>`);$('#rcl').onclick=closeSheet;
  if(ins){const ta=document.querySelector(`[data-wc="${ti}"]`);const put=t=>{if(ta.readOnly)return;const p=ta.selectionStart??ta.value.length;const pre=ta.value.slice(0,p),sep=pre&&!/[\s\n]$/.test(pre)?' ':'';ta.value=pre+sep+t+ta.value.slice(ta.selectionEnd??p);const np=(pre+sep+t).length;ta.setSelectionRange(np,np);examInput({target:ta});};
    document.querySelectorAll('[data-rins]').forEach(el=>el.onclick=e=>{if(e.target.closest('.spk'))return;put(el.dataset.rins.replace(/ …$/,' '));el.classList.add('flashok');setTimeout(()=>el.classList.remove('flashok'),500);});
    const tb=document.querySelector('[data-rtpl]');if(tb)tb.onclick=()=>{put(R.tpl);closeSheet();};}}
function vPhrases(m){m.innerHTML=`<h2 class="t">💬 Fraze</h2><p class="muted" style="font-weight:600;margin-top:-6px">Gotove fraze (Redemittel) za pisanje i usmeni dio ispita. Tapni 🔊 da čuješ izgovor.</p>${REDE.map(R=>`<button class="xmod" data-rd="${R.id}"><span class="xi">${R.ic}</span><span class="xt"><b>${esc(R.t)}</b><br><span class="small muted">${R.lv} · ${R.g.reduce((a,g)=>a+g[1].length,0)} fraza</span></span><span class="xs">›</span></button>`).join('')}`;
  m.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>redeSheet(b.dataset.rd));}

  phrases:['Mein Name ist …','Ich bin … Jahre alt.','Ich komme aus …','Ich wohne in …','Ich spreche …','Ich bin … von Beruf.','Mein Hobby ist …']},
 {t:'Teil 2 · Fragen stellen und antworten',i:'Tema „Essen und Trinken". Za svaku karticu postavi pitanje i odgovori na njega.',cards:['Frühstück','Lieblingsessen','Restaurant','Obst'],
  model:'Was isst du zum Frühstück? – Ich esse Brot mit Käse und trinke Kaffee.\nWas ist dein Lieblingsessen? – Mein Lieblingsessen ist Pita.\nGehst du oft ins Restaurant? – Nein, nur am Wochenende.\nWelches Obst magst du? – Ich mag Äpfel und Bananen.',
  phrases:['Was isst du …?','Was trinkst du …?','Magst du …?','Ja, gern. / Nein, nicht so gern.']},
 {t:'Teil 3 · Bitten formulieren',i:'Za svaku sliku zamoli nekoga za nešto i odgovori na molbu.',cards:['🪟 Fenster','🖊️ Kugelschreiber','💧 Wasser','📱 Handy'],
  model:'Können Sie bitte das Fenster aufmachen? – Ja, gern.\nGibst du mir bitte deinen Kugelschreiber? – Hier, bitte.\nIch hätte gern ein Glas Wasser, bitte. – Natürlich.\nKann ich bitte kurz dein Handy benutzen? – Ja, kein Problem.',
  phrases:['Können Sie bitte …?','Gibst du mir bitte …?','Ich hätte gern …','Ja, gern. / Hier, bitte. / Tut mir leid, …']}]}},

A2:{name:'Probni ispit A2',info:'Lesen 30 · Hören 30 · Schreiben 30 · Sprechen 15 min',
lesen:{min:30,desc:'4 dijela · 20 zadataka',intro:'Čitaš novinski članak, informativnu tablu, e-mail i oglase.',parts:[
 {t:'Teil 1',i:'Pročitaj članak i izaberi a, b ili c.',d:'Lesen Sie den Text und die Aufgaben. Wählen Sie die richtige Lösung.',
  text:'Ein Café für Jung und Alt\nIn Leipzig gibt es seit März ein besonderes Café. Hier arbeiten Studentinnen und Studenten zusammen mit Rentnern. Die Idee hatte Petra Lindner, 64 Jahre alt. „Viele ältere Menschen sind allein. Und viele Studenten haben wenig Geld", sagt sie. Im Café „Zusammen" backen die Senioren Kuchen nach alten Rezepten, und die Studenten machen den Service. Das Café ist von Mittwoch bis Sonntag geöffnet. Am Montag und Dienstag gibt es dort Computerkurse: Die Studenten zeigen den Senioren, wie man ein Smartphone benutzt. Die Kurse sind kostenlos. Für den Kaffee bezahlt jeder so viel, wie er möchte.',
  items:[{q:'Das Café gibt es …',o:['seit März.','seit 64 Jahren.','seit einem Jahr.'],a:0},
   {q:'Petra Lindner …',o:['ist Studentin.','hatte die Idee für das Café.','arbeitet im Service.'],a:1},
   {q:'Die Senioren im Café …',o:['machen den Service.','backen Kuchen.','lernen kochen.'],a:1},
   {q:'Am Montag …',o:['gibt es Computerkurse.','gibt es Kuchen gratis.','arbeiten nur Studenten im Café.'],a:0},
   {q:'Den Kaffee …',o:['bezahlt man nicht.','bezahlt man nur mit Karte.','bezahlt jeder so viel, wie er möchte.'],a:2}]},
 {t:'Teil 2',i:'Pročitaj informativnu tablu robne kuće. Na koji sprat ideš? Izaberi a, b ili c.',d:'Lesen Sie die Informationstafel. In welches Stockwerk gehen Sie?',keep:true,
  text:'Kaufhaus Merkur – Informationen\nEG: Kosmetik · Schmuck · Taschen · Information\n1. Stock: Damenmode · Schuhe\n2. Stock: Herrenmode · Sportmode · Kinderkleidung\n3. Stock: Haushaltswaren · Elektrogeräte · Handys\n4. Stock: Restaurant · Spielwaren · Bücher',
  items:[{q:'Sie möchten eine Jacke für Ihren Mann kaufen.',o:['1. Stock','2. Stock','anderes Stockwerk'],a:1},
   {q:'Sie brauchen ein Ladekabel für Ihr Handy.',o:['Erdgeschoss','3. Stock','anderes Stockwerk'],a:1},
   {q:'Sie möchten zu Mittag essen.',o:['Erdgeschoss','2. Stock','anderes Stockwerk'],a:2},
   {q:'Sie suchen ein Spiel als Geschenk für Ihren Sohn.',o:['2. Stock','4. Stock','anderes Stockwerk'],a:1},
   {q:'Sie möchten ein Parfüm kaufen.',o:['Erdgeschoss','1. Stock','anderes Stockwerk'],a:0}]},
 {t:'Teil 3',i:'Pročitaj e-mail i izaberi a, b ili c.',d:'Lesen Sie die E-Mail und die Aufgaben.',
  text:'Hallo Jonas,\nvielen Dank für deine Einladung zum Grillen am Samstag! Leider kann ich nicht kommen, denn meine Schwester heiratet an dem Tag in Graz. Ich fahre schon am Freitag mit dem Zug hin und komme erst am Montag zurück.\nAber ich habe eine Idee: Am nächsten Wochenende ist das Stadtfest. Wollen wir zusammen hingehen? Am Samstag habe ich frei, am Sonntag muss ich arbeiten. Schreib mir, ob du Zeit hast!\nLiebe Grüße\nMira',
  items:[{q:'Mira kann nicht zum Grillen kommen, weil …',o:['sie arbeiten muss.','ihre Schwester heiratet.','sie krank ist.'],a:1},
   {q:'Mira fährt nach Graz …',o:['am Freitag.','am Samstag.','am Montag.'],a:0},
   {q:'Mira fährt …',o:['mit dem Auto.','mit dem Zug.','mit dem Bus.'],a:1},
   {q:'Mira möchte mit Jonas …',o:['grillen.','zum Stadtfest gehen.','nach Graz fahren.'],a:1},
   {q:'Am nächsten Wochenende hat Mira Zeit …',o:['am Samstag.','am Sonntag.','am Montag.'],a:0}]},
 {t:'Teil 4',i:'Pet osoba traži nešto. Koji oglas (a–f) odgovara kojoj osobi? Za jednu osobu nema oglasa → izaberi x.',d:'Welche Anzeige passt? Für eine Person gibt es keine passende Anzeige: Wählen Sie x.',keep:true,
  list:[['a','Gitarrenunterricht für Anfänger – auch am Wochenende. 15 € pro Stunde.'],['b','Nachhilfe in Mathe für Schüler der Klassen 5–10. Abends und online.'],['c','Gebrauchtes Fahrrad, 3 Jahre alt, sehr guter Zustand, 150 €.'],['d','Wir suchen Babysitter für zwei Kinder (3 und 6 Jahre), Mo–Fr nachmittags.'],['e','Kochkurs: Italienisch kochen, Samstag 10–14 Uhr, 45 €.'],['f','Zimmer in WG frei, 350 € warm, nahe Uni, ab 1. Mai.']],
  opts:['a','b','c','d','e','f','x'],
  items:[{q:'Sara (19) beginnt im Mai ihr Studium und sucht eine günstige Unterkunft.',a:5},{q:'Herr Kovač möchte am Wochenende ein Instrument lernen.',a:0},{q:'Lea (17) hat nachmittags Zeit und möchte mit Kindern Geld verdienen.',a:3},{q:'Familie Braun sucht ein neues Auto.',a:6},{q:'Tim hat Probleme in Mathematik und braucht abends Hilfe.',a:1}]}]},
hoeren:{min:30,desc:'4 dijela · 20 zadataka',intro:'Slušaš radio, telefonske poruke, razgovore i intervju.',parts:[
 {t:'Teil 1',i:'Slušaš pet kratkih tekstova. Svaki čuješ dva puta. Izaberi a, b ili c.',d:'Sie hören fünf kurze Texte. Sie hören jeden Text zweimal.',plays:2,
  items:[{au:'Das Wetter für morgen: Am Vormittag regnet es noch, am Nachmittag scheint dann überall die Sonne. Die Temperaturen liegen bei achtzehn Grad.',q:'Wie ist das Wetter morgen Nachmittag?',o:['Es regnet.','Es ist sonnig.','Es schneit.'],a:1},
   {au:'Hallo Frau Ivić, hier ist das Reisebüro Sonnenschein. Ihre Tickets für die Reise nach Rom sind da. Sie können sie ab morgen bei uns abholen. Wir haben bis neunzehn Uhr geöffnet.',q:'Was soll Frau Ivić tun?',o:['Die Tickets abholen.','Das Reisebüro anrufen.','Die Reise bezahlen.'],a:0},
   {au:'Achtung, liebe Fahrgäste: Wegen Bauarbeiten fährt die U-Bahn-Linie drei heute nur bis zum Hauptbahnhof. Bitte nehmen Sie ab dort den Bus achtundfünfzig.',q:'Was müssen die Fahrgäste ab dem Hauptbahnhof machen?',o:['Zu Fuß gehen.','Den Bus nehmen.','Ein Taxi nehmen.'],a:1},
   {au:'Und jetzt ein Tipp für das Wochenende: Im Stadtpark gibt es am Samstag ein Konzert für die ganze Familie. Der Eintritt ist frei. Los geht es um sechzehn Uhr.',q:'Was kostet das Konzert?',o:['Nichts.','16 Euro.','6 Euro.'],a:0},
   {au:'Hallo Daniel, hier ist Ivana. Ich stehe vor dem Kino, aber du bist nicht da. Der Film beginnt in zehn Minuten. Ich kaufe schon mal die Karten. Bis gleich!',q:'Was macht Ivana?',o:['Sie geht nach Hause.','Sie kauft die Karten.','Sie wartet im Café.'],a:1}]},
 {t:'Teil 2',i:'Slušaš razgovor jednom. Šta Karim radi koji dan? Izaberi aktivnost za svaki dan.',d:'Sie hören ein Gespräch. Sie hören den Text einmal. Was macht Karim wann?',plays:1,keep:true,
  au:[['Frau','Du, Karim, was machst du eigentlich nächste Woche?'],['Karim','Puh, viel! Am Montag habe ich einen Arzttermin. Am Dienstag gehe ich nach der Arbeit ins Fitnessstudio.'],['Frau','Und am Mittwoch?'],['Karim','Am Mittwoch kommt meine Mutter zu Besuch, da koche ich. Am Donnerstag habe ich frei, da gehe ich schwimmen. Und am Freitag fahre ich zu meinem Freund nach Köln.']],
  opts:['Arzt','Fitnessstudio','kochen','schwimmen','nach Köln fahren','Kino'],
  items:[{q:'Montag',a:0},{q:'Dienstag',a:1},{q:'Mittwoch',a:2},{q:'Donnerstag',a:3},{q:'Freitag',a:4}]},
 {t:'Teil 3',i:'Slušaš pet kratkih razgovora. Svaki čuješ dva puta. Izaberi a, b ili c.',d:'Sie hören fünf kurze Gespräche. Sie hören jeden Text zweimal.',plays:2,
  items:[{au:[['Mann','Guten Tag, ich möchte ein Paket nach Bosnien schicken. Was kostet das?'],['Frau','Wie schwer ist es?'],['Mann','Ungefähr fünf Kilo.'],['Frau','Dann kostet es zweiunddreißig Euro.']],q:'Wie viel kostet das Paket?',o:['5 Euro','23 Euro','32 Euro'],a:2},
   {au:[['Frau','Entschuldigung, ich suche die Toiletten.'],['Mann','Die sind im ersten Stock, neben dem Aufzug.'],['Frau','Und wo ist der Aufzug?'],['Mann','Gleich da hinten links.']],q:'Wo sind die Toiletten?',o:['Im Erdgeschoss.','Im ersten Stock.','Im Keller.'],a:1},
   {au:[['Mann','Was ist los? Du siehst müde aus.'],['Frau','Ich habe schlecht geschlafen. Mein Nachbar hat bis drei Uhr laut Musik gehört.'],['Mann','Oh nein! Sprich doch mal mit ihm.']],q:'Warum ist die Frau müde?',o:['Sie hat lange gearbeitet.','Der Nachbar war laut.','Sie war auf einer Party.'],a:1},
   {au:[['Mann','Möchtest du am Wochenende mit uns wandern?'],['Frau','Gern, aber am Samstag muss ich arbeiten.'],['Mann','Wir gehen am Sonntag.'],['Frau','Super, dann komme ich mit!']],q:'Wann geht die Frau wandern?',o:['Am Samstag.','Am Sonntag.','Gar nicht.'],a:1},
   {au:[['Mann','Ich hätte gern ein Kilo Äpfel und zwei Zitronen.'],['Verkäuferin','Gern. Noch etwas?'],['Mann','Ja, ein Brot, bitte. Ach nein, Brot habe ich noch zu Hause.']],q:'Was kauft der Mann?',o:['Äpfel und Zitronen.','Äpfel, Zitronen und Brot.','Nur Brot.'],a:0}]},
 {t:'Teil 4',i:'Slušaš intervju na radiju dva puta. Da li je rečenica tačna: Ja ili Nein?',d:'Sie hören ein Interview. Sie hören den Text zweimal. Wählen Sie Ja oder Nein.',plays:2,rf:YN,
  au:[['Moderatorin','Herzlich willkommen, Herr Hadžić. Sie haben vor zwei Jahren ein Restaurant in Stuttgart eröffnet. Wie war der Anfang?'],['Herr Hadžić','Ehrlich gesagt, schwer. Ich habe vorher zehn Jahre als Koch in einem Hotel gearbeitet, aber ein eigenes Restaurant ist etwas ganz anderes.'],['Moderatorin','Was kochen Sie denn?'],['Herr Hadžić','Bosnische Spezialitäten, zum Beispiel Ćevapi und Burek. Aber wir haben auch vegetarische Gerichte, die sind bei jungen Gästen sehr beliebt.'],['Moderatorin','Wer arbeitet bei Ihnen?'],['Herr Hadžić','Meine Frau macht die Buchhaltung, und wir haben vier Mitarbeiter.'],['Moderatorin','Und Ihre Pläne?'],['Herr Hadžić','Nächstes Jahr möchten wir ein zweites Restaurant in Ulm eröffnen.']],
  items:[{q:'Herr Hadžić hat das Restaurant vor zwei Jahren eröffnet.',a:true},{q:'Vorher hat er in einem Hotel gearbeitet.',a:true},{q:'Im Restaurant gibt es kein vegetarisches Essen.',a:false},{q:'Seine Frau kocht im Restaurant.',a:false},{q:'Er möchte ein zweites Restaurant in Stuttgart eröffnen.',a:false}]}]},
schreiben:{min:30,desc:'2 dijela · SMS + e-mail',intro:'Pišeš dvije kratke poruke. Obradi sve tačke iz zadatka.',tasks:[
 {type:'text',t:'Teil 1 · SMS',i:'Napiši SMS (20–30 riječi). Obradi sve tri tačke.',words:20,
  d:'Sie sind mit Ihrer Freundin Jana zum Essen verabredet, aber Sie kommen zu spät. Schreiben Sie Jana eine SMS.',
  pts:['Entschuldigen Sie sich.','Schreiben Sie, warum Sie später kommen.','Schreiben Sie, wann Sie da sind.'],
  model:'Hallo Jana,\nes tut mir leid, ich komme etwas später. Mein Bus hat Verspätung. Ich bin um halb acht da. Bestell doch schon etwas zu trinken!\nBis gleich\nAmir'},
 {type:'text',t:'Teil 2 · E-Mail',i:'Napiši e-mail (30–40 riječi). Obradi sve tri tačke. Ne zaboravi pozdrav i potpis.',words:30,
  d:'Sie können am Montag nicht zum Deutschkurs kommen. Schreiben Sie Ihrer Kursleiterin, Frau Schulz, eine E-Mail.',
  pts:['Entschuldigen Sie sich und nennen Sie den Grund.','Fragen Sie nach den Hausaufgaben.','Fragen Sie, wann der nächste Test ist.'],
  model:'Liebe Frau Schulz,\nleider kann ich am Montag nicht zum Kurs kommen, weil ich einen Termin beim Arzt habe. Können Sie mir bitte sagen, welche Hausaufgaben wir machen sollen? Und wann ist der nächste Test?\nVielen Dank und viele Grüße\nAmir Hodžić'}]},
sprechen:{min:15,desc:'3 dijela · u paru',intro:'Na ispitu govoriš s partnerom. Ovdje vježbaš sam: snimi se i uporedi s primjerom.',tasks:[
 {t:'Teil 1 · Fragen zur Person',i:'Postavi partneru pitanja uz ove riječi i odgovori na njegova pitanja.',cards:['Geburtstag?','Wohnort?','Beruf?','Familie?','Hobby?'],
  model:'Wann hast du Geburtstag? – Am 14. Mai.\nWo wohnst du? – In Stuttgart, in einer kleinen Wohnung.\nWas bist du von Beruf? – Ich bin Elektriker.\nHast du Familie? – Ja, meine Eltern und mein Bruder leben in Bosnien.\nWas ist dein Hobby? – Ich spiele gern Fußball.',
  phrases:['Wann …?','Wo …?','Was …?','Hast du …?']},
 {t:'Teil 2 · Über sich sprechen',i:'Pričaj o temi „Šta radiš za vikend?". Spomeni sve četiri tačke.',cards:['Familie','Freunde','Sport','Essen'],
  model:'Am Wochenende schlafe ich zuerst lange. Am Samstag telefoniere ich mit meiner Familie in Bosnien. Am Nachmittag treffe ich oft Freunde, wir gehen zusammen in ein Café. Am Sonntag spiele ich Fußball im Verein. Abends koche ich gern, zum Beispiel Suppe oder Fleisch mit Gemüse.',
  phrases:['Am Wochenende …','Zuerst … dann … danach …','Ich … gern.','Meistens / oft / manchmal …']},
 {t:'Teil 3 · Gemeinsam etwas planen',i:'Želite zajedno posjetiti prijatelja u bolnici u subotu. Pronađite zajednički termin. Tvoj kalendar:',cards:['8–12: Arbeit','13:00: Mittagessen mit Mutter','15–16: Friseur','18:00: Kino'],
  model:'Wann hast du am Samstag Zeit? Ich arbeite bis zwölf Uhr. – Um eins esse ich mit meiner Mutter. Geht es um zwei? – Ja, das passt. Aber um drei muss ich zum Friseur. – Dann gehen wir von zwei bis drei ins Krankenhaus. Bringen wir Blumen mit? – Gute Idee!',
  phrases:['Hast du um … Zeit?','Da kann ich leider nicht, ich …','Geht es um …?','Das passt gut.','Wollen wir … mitbringen?']}]}},
