<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bash Deutsch – njemački A1–B2</title>
<meta name="description" content="Uči njemački od A1 do B2: lekcije, slušanje, slaganje rečenica, der/die/das, video izvori. Besplatno.">
<link rel="icon" href="../assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;--red:#ff4b4b;--red-d:#ea2b2b;--yellow:#ffc800;--orange:#ff9600;
--bg:#fff;--text:#3c3c3c;--muted:#8a8a8a;--line:#e5e5e5;--line-d:#cfcfcf;--card:#fff;--soft:#f7f7f7;--okbg:#d7ffb8;--okfg:#58a700;--badbg:#ffdfe0;--badfg:#ea2b2b}
@media (prefers-color-scheme: dark){:root{--bg:#131f24;--text:#f1f7fb;--muted:#8fa6b2;--line:#37464f;--line-d:#2a383f;--card:#131f24;--soft:#202f36;--okbg:#1e3a14;--okfg:#79d634;--badbg:#3d1a1d;--badfg:#ff7878}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-weight:700}
button{font-family:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.stat.fire{color:var(--orange)}.stat.xp{color:#e5a800}.stat.heart{color:var(--red)}
.flag{font-size:24px}
main{padding:16px 16px 110px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--line);z-index:5}
nav.bottom .in{display:flex;max-width:560px;margin:0 auto}
nav.bottom button{flex:1;min-width:0;background:none;border:0;padding:9px 0 12px;font-size:10px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button .ic{font-size:23px;filter:grayscale(1);opacity:.6}
nav.bottom button.on{color:var(--blue)}
nav.bottom button.on .ic{filter:none;opacity:1}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-d);cursor:default;transform:none}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.card{border:2px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)}.small{font-size:13px}
.goal{display:flex;align-items:center;gap:12px}
.gtxt{flex:1}
.gbar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0;position:relative}
.vt summary{cursor:pointer;font-weight:900;color:var(--blue);margin-top:12px}
.gbar i{display:block;height:100%;background:var(--yellow);border-radius:8px}
.lvl{display:flex;align-items:center;gap:10px;margin:34px 0 -6px;font-weight:900;font-size:18px}
.lvl span{background:var(--text);color:var(--bg);border-radius:10px;padding:3px 10px;font-size:15px}
.unit{border-radius:16px;padding:14px 16px;color:#fff;margin:26px 0 22px;display:flex;justify-content:space-between;align-items:center}
.ulbl{font-size:12px;opacity:.9;font-weight:800;letter-spacing:.4px}
.utit{font-size:20px;font-weight:900}
.tipbtn{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);border-radius:12px;font-size:20px;padding:6px 10px;cursor:pointer}
.path{display:flex;flex-direction:column;align-items:center;gap:22px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:72px;height:66px;border-radius:50%;border:0;font-size:28px;font-weight:900;cursor:pointer;background:var(--c);box-shadow:0 7px 0 var(--cd);color:#fff}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.locked{background:var(--line);box-shadow:0 7px 0 var(--line-d);color:var(--muted);font-size:24px}
.node.done{background:var(--yellow);box-shadow:0 7px 0 #e0a800}
.node.cur{outline:5px solid var(--line);outline-offset:6px}
.startb{position:absolute;top:-40px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-weight:900;color:var(--green);font-size:14px;animation:bob 1.2s ease-in-out infinite;white-space:nowrap}
@keyframes bob{50%{transform:translateY(-5px)}}
h2.t{font-size:24px;font-weight:900;margin:6px 0 14px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 30px;max-height:86vh;overflow:auto;animation:up .22s ease-out}
.sheet h3{font-size:22px;margin:4px 0 6px;font-weight:900}
.sh-h{font-weight:900;font-size:14px;letter-spacing:.4px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.tip p{line-height:1.5}
.tip table{border-collapse:collapse;width:100%;margin:8px 0}
.tip td{border:2px solid var(--line);padding:7px 10px}
.tip b{color:var(--blue)}
/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:14px;padding:16px 16px 8px;max-width:600px;margin:0 auto;width:100%}
.xbtn{background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1}
.prog{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.lbody{flex:1;overflow:auto;padding:10px 18px 20px;max-width:600px;margin:0 auto;width:100%}
.lbody.lock .opt,.lbody.lock .tile,.lbody.lock input,.lbody.lock .chars button{pointer-events:none}
.lfoot{border-top:2px solid var(--line);padding:14px 18px 22px}
.lfoot .fin{max-width:600px;margin:0 auto}
.lfoot.ok{background:var(--okbg);border-color:transparent}
.lfoot.bad{background:var(--badbg);border-color:transparent}
.fbt{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.lfoot.ok .fbt,.lfoot.ok .fbd{color:var(--okfg)}.lfoot.bad .fbt,.lfoot.bad .fbd{color:var(--badfg)}
.fbd{margin-top:4px;font-size:16px}
.combo{display:inline-block;margin-top:6px;background:var(--orange);color:#fff;border-radius:10px;padding:2px 10px;font-size:13px}
.q h2{font-size:22px;font-weight:900;margin:6px 0 18px}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.bubble{border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:19px;flex:1}
.bubble .sub{font-size:14px;color:var(--muted);margin-top:3px}
.spk{width:50px;height:50px;border-radius:14px;border:0;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#fff;font-size:22px;cursor:pointer;flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.spk.big{width:96px;height:96px;border-radius:24px;font-size:42px}
.spk.slow{width:60px;height:60px;font-size:26px;border-radius:18px}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:10px 0 26px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;background:var(--card);font-size:17px;font-weight:700;color:var(--text);text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .k{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:rgba(88,204,2,.15);color:var(--okfg)}
.opt.wrong{border-color:var(--red);background:rgba(255,75,75,.12);color:var(--badfg)}
.opt.gone{opacity:.3;pointer-events:none}
.art{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.art .opt{justify-content:center;font-size:22px;font-weight:900;padding:22px 8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{justify-content:center;text-align:center;min-height:58px}
.answer-line{min-height:120px;background:repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:26px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 14px;background:var(--card);font-size:17px;font-weight:700;color:var(--text);cursor:pointer;height:48px}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
input.typ{width:100%;font:inherit;font-size:19px;padding:15px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);outline:none}
input.typ:focus{border-color:var(--blue)}
.chars{display:flex;gap:8px;margin-top:10px}
.chars button{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--card);color:var(--text);font-size:18px;font-weight:800;padding:8px 0;cursor:pointer}
.badge{display:inline-block;background:var(--purple,#ce82ff);color:#fff;font-size:12px;font-weight:900;border-radius:8px;padding:3px 10px;letter-spacing:.5px;margin-bottom:12px}
.intro{text-align:center;padding-top:10px}
.intro .de{font-size:34px;font-weight:900;margin:18px 0 6px}
.intro .bs{font-size:20px;color:var(--muted)}
.result{text-align:center;padding-top:30px}
.result h1{font-size:30px;font-weight:900;color:var(--yellow);margin:12px 0 6px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.rs{border:2px solid var(--c);border-radius:14px;overflow:hidden}
.rs .h{background:var(--c);color:#fff;font-size:11px;font-weight:900;padding:5px;letter-spacing:.4px}
.rs .v{font-size:20px;font-weight:900;padding:12px 4px;color:var(--c)}
/* words */
.search{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);outline:none;margin-bottom:6px}
.wgrp{margin-top:20px;font-weight:900;font-size:14px;color:var(--muted);letter-spacing:.4px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}
.wrow .spk{width:40px;height:40px;font-size:17px;border-radius:12px}
.wrow .tx{flex:1}
.wrow .d{font-size:17px;font-weight:800}
.wrow .b{font-size:14px;color:var(--muted)}
.str{letter-spacing:2px;color:var(--yellow);font-size:12px}
/* resources */
.res{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;margin-bottom:12px}
.res .e{font-size:32px;flex:none}
.res .tt{font-weight:900;font-size:17px}
.res .ds{font-size:14px;color:var(--muted);margin-top:2px;font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:900;border-radius:6px;padding:1px 7px;margin-left:6px;background:var(--blue);color:#fff;vertical-align:middle}
/* profile */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.sbox .n{font-size:20px;font-weight:900}
.sbox .l{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px}
.chart .bar.g{background:var(--yellow)}
.chart .lb{font-size:11px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);color:var(--text);padding:10px 6px;font-weight:800;cursor:pointer;font-size:14px}
.seg button.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.1)}
select{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text)}
.sec{margin-top:26px}
.sec h3{font-size:18px;font-weight:900;margin:0 0 10px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;font-weight:600}
/* exam */
.xlv{margin-top:14px;padding:12px}
.xlh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lvb{background:var(--blue);color:#fff;border-radius:12px;padding:8px 10px;font-weight:900;font-size:18px}
.pass{background:var(--green);color:#fff;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:900;white-space:nowrap}
.xmod{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:2px solid var(--line);padding:12px 2px;color:var(--text);text-align:left;cursor:pointer;font-size:15px}
.xmod .xi{font-size:24px}.xmod .xt{flex:1;line-height:1.35}
.xs{font-weight:900;color:var(--muted);font-size:16px}.xs.ok{color:var(--green)}.xs.bad{color:var(--red)}
.timer{font-weight:900;font-variant-numeric:tabular-nums;background:var(--soft);border-radius:10px;padding:4px 10px}
.timer.low{color:#fff;background:var(--red)}
.xm-part{border-top:2px solid var(--line);padding-top:16px;margin-top:18px}
.xm-pt{font-weight:900;font-size:20px}
.xm-ins{font-weight:700;margin:4px 0 2px;line-height:1.4}
.xm-de{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:10px;font-weight:600}
.xm-text{background:var(--soft);border-radius:14px;padding:14px;margin:10px 0;line-height:1.55;font-weight:600;font-size:15px}
.xm-text.sm{font-size:14px;padding:11px;margin:6px 0}
.xm-ads{display:grid;gap:8px;margin:10px 0}
.xm-ads div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;font-weight:600}
.xm-ads b{color:var(--blue);margin-right:4px}
.xm-sign{border:3px solid var(--text);border-radius:8px;padding:10px;text-align:center;font-weight:900;margin:6px 0;font-size:15px;line-height:1.35}
.xm-item{margin:16px 0}
.xm-q{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.xn{background:var(--text);color:var(--bg);border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;font-weight:900;margin-top:1px}
.xm-qt{font-weight:800;line-height:1.4}
.xm-opts{display:grid;gap:8px}
.xm-opts.two{grid-template-columns:1fr 1fr}
.xm-opts.chips{display:flex;flex-wrap:wrap;gap:6px}
.xo{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:11px 12px;background:var(--card);color:var(--text);font-size:15px;font-weight:700;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}
.xm-opts.two .xo,.xm-opts.chips .xo{justify-content:center;text-align:center}
.xm-opts.chips .xo{min-width:46px;padding:9px 12px}
.xo .xl{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.xo.sel{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
.xo.right{border-color:var(--green);background:rgba(88,204,2,.15);color:var(--okfg)}
.xo.wrong{border-color:var(--red);background:rgba(255,75,75,.12);color:var(--badfg)}
.xm-fb{font-size:13px;margin-top:6px}
.okc{color:var(--okfg);font-weight:900}.badc{color:var(--badfg);font-weight:900}
.xplay{border:0;background:var(--blue);box-shadow:0 3px 0 var(--blue-d);color:#fff;border-radius:12px;padding:9px 14px;font-weight:900;font-size:14px;cursor:pointer;margin:4px 8px 6px 0}
.xplay:disabled{background:var(--line);box-shadow:none;color:var(--muted)}
.xplay .pl{background:rgba(255,255,255,.25);border-radius:6px;padding:1px 6px;margin-left:4px}
.xtr{border:2px solid var(--line);background:none;color:var(--text);border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer}
.xtrans{margin:6px 0;font-size:14px}.xtrans summary{cursor:pointer;font-weight:800;color:var(--blue)}.xtrans div{background:var(--soft);border-radius:12px;padding:12px;margin-top:6px;line-height:1.55;font-weight:600}
.xres{display:flex;gap:14px;align-items:center;border-radius:18px;padding:14px 16px;margin-bottom:8px}
.xres.ok{background:var(--okbg)}.xres.bad{background:var(--badbg)}
.xr-p{font-size:34px;font-weight:900}.xres.ok .xr-p,.xres.ok .xr-s{color:var(--okfg)}.xres.bad .xr-p,.xres.bad .xr-s{color:var(--badfg)}
.xr-s{font-weight:900}
.xpts{margin:6px 0 10px;padding-left:20px;line-height:1.5;font-weight:700}
.xta{width:100%;font:inherit;font-size:16px;font-weight:600;line-height:1.5;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);outline:none;resize:vertical}
.xta:focus{border-color:var(--blue)}
.xta-bar{display:flex;align-items:center;gap:10px;margin-top:6px}.xta-bar .chars{flex:1;margin:0}.xta-bar .chars button{padding:5px 0;font-size:15px}
.wcount{font-size:13px;font-weight:900;color:var(--muted);white-space:nowrap}.wcount.ok{color:var(--okfg)}
.xform{border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.xf-h{font-weight:900;color:var(--blue)}
.xform label{display:grid;gap:4px;font-size:13px;font-weight:800;color:var(--muted)}
.xform input{font:inherit;font-size:16px;font-weight:700;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);outline:none}
.xform input.okb{border-color:var(--green)}.xform input.badb{border-color:var(--red)}
.xrv{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:12px}
.xck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-weight:700;font-size:15px}.xck input{width:20px;height:20px;margin-top:1px;flex:none}
.xcards{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.xcards span{border:2px solid var(--text);border-radius:10px;padding:8px 12px;font-weight:900;background:var(--soft)}
.xph{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.xph span{background:rgba(28,176,246,.12);color:var(--blue);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:800}
.xrec{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}.xrec audio{width:100%}
.btn.sm{padding:10px;font-size:14px;margin-top:6px}
.pulse{animation:pls 1s infinite}@keyframes pls{50%{opacity:.6}}
.xsr{display:flex;align-items:center;gap:8px;margin:6px 0}.xsr>span{flex:1;font-size:14px;font-weight:800}.xsr .seg{flex:1.6}.xsr .seg button{padding:7px 2px;font-size:12px}
.lbme{background:rgba(28,176,246,.12);color:var(--blue);border-radius:12px;padding:10px 12px;font-weight:800;margin-bottom:10px}
.lbr{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px solid var(--line)}
.lbr.me{background:rgba(88,204,2,.12);border-radius:12px;border-bottom-color:transparent}

const BOX=[0,1,3,7,16,35].map(d=>d*864e5);

function srs(w,ok){if(!w||!w.id)return;S.vocab=S.vocab||{};const r=S.vocab[w.id]||{b:0,d:0};if(ok){r.b=Math.min(5,r.b+1);r.d=Date.now()+BOX[r.b];}else{r.b=1;r.d=Date.now()+10*60000;}S.vocab[w.id]=r;}
function vocStats(lv,cat){const ws=VOCW.filter(w=>w.lv===lv&&(cat==null||w.cat===cat)),now=Date.now();let learned=0,due=0,seen=0;ws.forEach(w=>{const r=(S.vocab||{})[w.id];if(!r)return;seen++;if(r.b>=3)learned++;if(r.d<=now)due++;});return {total:ws.length,learned,due,seen};}
function buildVocab(lv,cat){
  const now=Date.now(),V=S.vocab||{},ws=VOCW.filter(w=>w.lv===lv&&(cat==null||w.cat===cat));
  const due=shuf(ws.filter(w=>V[w.id]&&V[w.id].d<=now)).slice(0,8);
  const fresh=ws.filter(w=>!V[w.id]).slice(0,Math.max(3,6-Math.floor(due.length/2)));
  const q=[],T=['mc_de_bs','mc_bs_de','listen_mc','type','mc_de_bs'];
  const fix=t=>(!TTS&&t==='listen_mc')?'mc_bs_de':t;
  fresh.forEach(w=>{q.push({type:'intro',w,voc:1});q.push({type:'mc_de_bs',w,voc:1});});
  due.forEach(w=>q.push({type:fix(ART.test(w.de)&&Math.random()<.3?'article':pick(T)),w,voc:1}));
  const pool=due.concat(fresh);
  if(pool.length>=5)q.push({type:'match',ws:shuf(pool).slice(0,5)});
  shuf(fresh).forEach(w=>q.push({type:fix(pick(['mc_bs_de','type','listen_mc'])),w,voc:1}));
  return q;
}

/* ============ EXERCISE BUILDING ============ */
const PLANS={
0:['intro','intro','intro','mc_de_bs','listen_mc','mc_bs_de','match','article','type','mc_de_bs','build_de','build_bs'],
1:['intro','intro','intro','mc_bs_de','listen_mc','article','match','type','build_de','listen_build','build_bs','mc_de_bs'],
2:['mc_de_bs','type','build_de','listen_build','article','match','build_bs','type','listen_mc','build_de','listen_build','mc_bs_de'],
3:['type','build_de','listen_build','article','type','listen_mc','build_de','match','listen_build','type','build_bs','article','build_de','listen_mc'],
P:['mc_de_bs','type','listen_mc','match','build_de','article','mc_bs_de','listen_build','type','build_bs']
};
function buildQueue(words,sents,plan,skipIntro){
  const wq=shuf(words),sq=shuf(sents);let wi=0,si=0,ii=0;const out=[];
  for(let t of plan){
    if(!TTS){if(t==='listen_mc')t='mc_bs_de';if(t==='listen_build')t='build_de';}
    if(t==='intro'){if(!skipIntro)out.push({type:'intro',w:wq[ii++%wq.length]});continue;}
    if(t==='article'){const c=shuf(words).find(w=>ART.test(w.de));if(c){out.push({type:'article',w:c});continue;}t='mc_de_bs';}
    if(t==='match'){const seen=new Set(),ws=[];for(const w of shuf(words.length>=5?words:words.concat(words[0].u>=0?UNITS[words[0].u].words:VOCW.filter(x=>x.lv===words[0].lv&&x.cat===words[0].cat)))){const k=norm(w.de)+'|'+norm(w.bs);if(!seen.has(k)&&!ws.some(x=>norm(x.bs)===norm(w.bs)||norm(x.de)===norm(w.de))){seen.add(k);ws.push(w);}if(ws.length>=5)break;}out.push({type:'match',ws});continue;}
    if(t==='build_de'||t==='build_bs'||t==='listen_build'){if(sq.length){out.push({type:t,s:sq[si++%sq.length]});continue;}t='type';}
    out.push({type:t,w:wq[wi++%wq.length]});
  }
  return out;
}
function distract(w,field,n){const pool=w.u>=0?UNITS[w.u].words:VOCW.filter(x=>x.lv===w.lv&&x.cat===w.cat);const sd=new Set([norm(w.de)]),sb=new Set([norm(w.bs)]),out=[];for(const x of shuf(pool).concat(shuf(ALLW.concat(VOCW)))){const kd=norm(x.de),kb=norm(x.bs);if(sd.has(kd)||sb.has(kb))continue;sd.add(kd);sb.add(kb);out.push(x);if(out.length>=n)break;}return out;}
function extraToks(answer,lang,n){const own=new Set(tok(answer).map(t=>t.toLowerCase()));const c=[];for(const s of shuf(ALLS)){for(const t of tok(s[lang])){const k=t.toLowerCase();if(!own.has(k)&&!c.some(x=>x.toLowerCase()===k))c.push(t);}if(c.length>30)break;}return shuf(c).slice(0,n);}

function mc(body,head,opts,label,correct,correctText,sayOnTap){

}
function tiles(body,head,answer,lang){
  const all=shuf(tok(answer).concat(extraToks(answer,lang,Math.min(4,Math.max(2,tok(answer).length-1)))));
  body.innerHTML=head+`<div class="answer-line" id="al"></div><div class="tiles" id="bank">${all.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;

function rec(w,ok){if(!w)return;const r=S.words[w.de]||(S.words[w.de]={ok:0,bad:0});ok?r.ok++:r.bad++;}

/* ============ LESSON FLOW ============ */
let L=null;
function startLesson(u,l,mode){
  closeSheet();regen();
  if(!freeM(mode)&&S.hearts<=0)return noHearts();
  let q;const U=UNITS[u];
  if(mode==='practice')q=buildPractice();
  else if(mode==='vocab'){q=buildVocab(VSEL.lv,VSEL.cat);if(!q.length){sheet(`<div style="text-align:center">${mascot(80)}<h3>Sve je ponovljeno! 🎉</h3><p class="muted">Nema riječi za ponavljanje ni novih riječi u ovoj temi. Dođi sutra ili izaberi drugu temu.</p><button class="btn" onclick="closeSheet()">U redu</button></div>`);return;}}
  else if(mode==='jump'||l===3)q=buildQueue(U.words,U.sents,PLANS[3],true);
  else{const W=U.words,h=Math.ceil(W.length/2);
    if(l===0)q=buildQueue(W.slice(0,h),U.sents.slice(0,3),PLANS[0],!!S.done[u*4]);
    else if(l===1)q=buildQueue(W.slice(h),U.sents.slice(2,5),PLANS[1],!!S.done[u*4+1]);
    else q=buildQueue(W,U.sents,PLANS[2],true);}
  L={q,base:q.length,solved:0,okc:0,att:0,mist:0,combo:0,t0:Date.now(),mode,u,l,state:'ask'};
  const d=document.createElement('div');d.className='lesson';d.id='lesson';
  d.innerHTML=`<div class="lhead"><button class="xbtn" id="lx">✕</button><div class="prog"><i id="pg" style="width:0"></i></div><div class="stat heart" id="lh">${freeM(mode)?'❤️ ∞':'❤️ '+S.hearts}</div></div><div class="lbody" id="lb"></div><div class="lfoot" id="lf"><div class="fin"><div id="fbx"></div><button class="btn" id="cb" disabled>Provjeri</button></div></div>`;
  document.body.appendChild(d);
  $('#lx').onclick=quitAsk;$('#cb').onclick=onCheck;
  next();
}
function buildPractice(){
  const us=UNITS.filter((U,u)=>isOpen(u*4)||S.done[u*4]);
  const words=us.flatMap(U=>U.words),sents=us.flatMap(U=>U.sents);
  const sc=w=>{const r=S.words[w.de]||{ok:0,bad:0};return r.ok-r.bad*2+Math.random()*1.5;};
  const weak=words.slice().sort((a,b)=>sc(a)-sc(b)).slice(0,8);
  return buildQueue(weak,shuf(sents).slice(0,6),PLANS.P,true);
}
function updProg(){const p=$('#pg');if(p)p.style.width=Math.min(100,L.solved/L.base*100)+'%';}
function next(){
  if(!L.q.length)return finish();
  const ex=L.q.shift();L.cur=ex;L.state='ask';
  const lb=$('#lb');lb.className='lbody';lb.scrollTop=0;
  $('#lf').className='lfoot';$('#fbx').innerHTML='';
  const cb=$('#cb');cb.className='btn';cb.textContent=ex.type==='intro'?'Nastavi':'Provjeri';
  renderEx(ex,lb);cb.disabled=!X.ready;updProg();
}
function onCheck(){
  if(L.state==='ask'){
    if(!X.ready)return;const r=X.check();const ex=L.cur;
    if(ex.type==='intro'){L.solved++;return next();}
    L.state='fb';$('#lb').classList.add('lock');
    if(!X.match){L.att++;rec(ex.w,r.ok);if(ex.voc)srs(ex.w,r.ok);}
    if(r.ok){L.solved++;L.okc++;L.combo++;beep('ok');
      if(ex.type==='build_de'||ex.type==='type'||ex.type==='mc_bs_de')speak(ex.s?ex.s.de:ex.w.de);}
    else{L.mist++;L.combo=0;beep('bad');L.q.push({...ex});
      if(!freeM(L.mode)){regen();S.hearts=Math.max(0,S.hearts-1);save();$('#lh').textContent='❤️ '+S.hearts;$('#lh').classList.add('shake');}}
    const lf=$('#lf');lf.className='lfoot '+(r.ok?'ok':'bad');
    let h=`<div class="fbt">${r.ok?'✅ '+pick(PRAISE):'❌ Netačno'}</div>`;
    if(!r.ok)h+=`<div class="fbd">Tačan odgovor:<br><b>${esc(r.correct)}</b></div>`;
    else if(r.note)h+=`<div class="fbd">${esc(r.note)}</div>`;
    else if(ex.s&&ex.type!=='build_bs')h+=`<div class="fbd">${esc(ex.s.de)} = ${esc(ex.s.bs)}</div>`;
    if(r.ok&&L.combo>=3&&L.combo%3===0)h+=`<span class="combo">🔥 ${L.combo} zaredom!</span>`;
    $('#fbx').innerHTML=h;
    const cb=$('#cb');cb.textContent='Nastavi';cb.className='btn'+(r.ok?'':' red');cb.disabled=false;updProg();save();
  }else{
    if(!freeM(L.mode)&&S.hearts<=0)return failScreen();
    next();
  }
}

function finish(){
  const secs=Math.round((Date.now()-L.t0)/1000),acc=L.att?Math.round(100*L.okc/L.att):100,perfect=L.mist===0;
  let xp=L.mode==='vocab'?10:L.mode==='practice'?5:(L.mode==='jump'||L.l===3)?20:10;if(perfect&&!freeM(L.mode))xp+=5;
  const today=dk(),before=S.daily[today]||0;
  S.xp+=xp;S.daily[today]=before+xp;S.lessons++;if(perfect)S.perfect++;
  let streakUp=false;if(S.last!==today){S.streak=(S.last===dk(dayOff(-1)))?S.streak+1:1;S.last=today;streakUp=true;}
  if(L.mode==='practice'){regen();S.hearts=Math.min(5,S.hearts+1);}
  else if(L.mode==='vocab'){}
  else if(L.mode==='jump'){for(let i=0;i<=L.u*4+3;i++)S.done[i]=true;}
  else S.done[L.u*4+L.l]=true;
  save();lbPublish();beep('win');confetti();
  const goalHit=before<S.goal&&S.daily[today]>=S.goal;
  const title=L.mode==='jump'?'Jedinica preskočena!':L.mode==='practice'?'Vježba završena!':L.mode==='vocab'?'Riječi naučene!':perfect?'Savršena lekcija!':'Lekcija završena!';
  $('#lb').innerHTML=`<div class="result">${mascot(130)}<h1>${title}</h1>
  ${streakUp?`<div style="color:var(--orange);font-weight:900;font-size:18px">🔥 Niz: ${S.streak} ${S.streak===1?'dan':'dana'}!</div>`:''}
  ${goalHit?`<div style="color:#e5a800;font-weight:900;margin-top:6px">🎯 Dnevni cilj ispunjen!</div>`:''}
  ${L.mode==='practice'?`<div class="muted" style="margin-top:6px">+1 ❤️ srce</div>`:''}
  <div class="rstats"><div class="rs" style="--c:#ffc800"><div class="h">UKUPNO XP</div><div class="v">⚡ ${xp}</div></div><div class="rs" style="--c:#58cc02"><div class="h">TAČNOST</div><div class="v">🎯 ${acc}%</div></div><div class="rs" style="--c:#1cb0f6"><div class="h">VRIJEME</div><div class="v">⏱ ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div></div></div></div>`;
  $('#pg').style.width='100%';$('#lf').className='lfoot';$('#fbx').innerHTML='';

}

function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheet-bg';d.id='sheet';d.innerHTML=`<div class="sheet">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet();};document.body.appendChild(d);return d;}

function confetti(){const c=document.createElement('canvas');c.id='cf';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');
const cols=['#58cc02','#1cb0f6','#ff4b4b','#ffc800','#ce82ff','#ff9600'];const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,s:4+Math.random()*6,c:pick(cols),w:Math.random()*.2-.1}));
let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.w;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++t<170)requestAnimationFrame(f);else c.remove();})();}

lesen:{min:25,desc:'3 dijela · 15 zadataka',intro:'Čitaš kratke poruke, oglase i natpise. Za svaki zadatak izaberi tačan odgovor.',parts:[
 {t:'Teil 1',i:'Pročitaj dva teksta. Da li je rečenica tačna (Richtig) ili netačna (Falsch)?',d:'Lesen Sie die zwei Texte. Sind die Aussagen richtig oder falsch?',rf:RF,
  text:'Liebe Sabine,\nich bin jetzt in Hamburg. Die Stadt ist sehr schön, aber das Wetter ist nicht so gut: Es regnet jeden Tag. Mein Hotel ist direkt am Hafen. Morgen besuche ich meinen Bruder Thomas. Er wohnt seit zwei Jahren hier. Am Sonntag fahre ich mit dem Zug zurück.\nViele Grüße\nKarin',
  items:[{q:'Karin ist in Hamburg.',a:true},{q:'Das Wetter in Hamburg ist schön.',a:false},{q:'Karins Bruder wohnt in Hamburg.',a:true},
   {text:'Hallo Herr Petrović,\ndie Besprechung am Montag ist nicht um 9 Uhr, sondern um 11 Uhr. Bitte bringen Sie die Pläne für das Projekt mit.\nVielen Dank!\nMonika Lang',q:'Die Besprechung ist am Montag um 9 Uhr.',a:false},
   {q:'Herr Petrović soll Pläne mitbringen.',a:true}]},
 {t:'Teil 2',i:'Pročitaj situaciju i dva oglasa. Gdje ćeš naći informaciju: a ili b?',d:'Lesen Sie die Situationen. Wo finden Sie Informationen? Wählen Sie a oder b.',keep:true,
  items:[{q:'Sie möchten am Sonntag schwimmen gehen.',o:['Hallenbad Mitte – Mo–Fr 7–21 Uhr, Sa 8–18 Uhr','Freizeitbad Sonnenland – täglich 9–22 Uhr, auch sonntags'],a:1},
   {q:'Sie suchen eine Wohnung mit zwei Zimmern.',o:['3-Zimmer-Wohnung, 85 m², Balkon, 950 € warm','2-Zimmer-Wohnung, 55 m², Einbauküche, 620 € warm'],a:1},
   {q:'Sie möchten einen Deutschkurs am Abend machen.',o:['Volkshochschule: Deutsch A1, Mo + Mi 18:30–20:00 Uhr','Sprachschule Lingua: Deutsch A1, Di + Do 9:00–12:00 Uhr'],a:0},
   {q:'Ihr Fahrrad ist kaputt.',o:['Radhaus Müller – Verkauf und Reparatur von Fahrrädern','Autowerkstatt Kraus – Reparatur aller Automarken'],a:0},
   {q:'Sie möchten billig nach Berlin fahren.',o:['Flug nach Berlin ab 89 €','Fernbus nach Berlin ab 19,99 €'],a:1}]},
 {t:'Teil 3',i:'Pročitaj natpise. Da li je rečenica tačna ili netačna?',d:'Lesen Sie die Schilder. Sind die Aussagen richtig oder falsch?',rf:RF,
  items:[{sign:'Praxis Dr. Klein\nHeute geschlossen!\nVertretung: Dr. Haas, Bahnhofstraße 5',q:'Sie können heute zu Dr. Klein gehen.',a:false},
   {sign:'Bäckerei Brot & mehr\nSonntag 7–11 Uhr geöffnet',q:'Sie können am Sonntagmorgen Brot kaufen.',a:true},
   {sign:'Aufzug defekt – bitte die Treppe benutzen',q:'Sie müssen zu Fuß nach oben gehen.',a:true},
   {sign:'Rauchen verboten',q:'Hier dürfen Sie rauchen.',a:false},
   {sign:'Bürgeramt\nTermine nur online: www.stadt.de',q:'Sie können ohne Termin ins Bürgeramt gehen.',a:false}]}]},
hoeren:{min:20,desc:'3 dijela · 15 zadataka',intro:'Slušaš kratke razgovore, obavještenja i telefonske poruke. Pazi koliko puta smiješ preslušati tekst.',parts:[
 {t:'Teil 1',i:'Slušaš kratke razgovore. Svaki tekst čuješ dva puta. Izaberi a, b ili c.',d:'Sie hören sechs kurze Texte. Sie hören jeden Text zweimal.',plays:2,
  items:[{au:[['Kundin','Entschuldigung, was kostet der Pullover hier?'],['Verkäufer','Der blaue? Der kostet 25 Euro. Aber heute ist alles 5 Euro billiger.'],['Kundin','Also 20 Euro?'],['Verkäufer','Genau.']],q:'Wie viel kostet der Pullover heute?',o:['25 Euro','20 Euro','30 Euro'],a:1},
   {au:[['Mann','Hallo Maria, wann beginnt unser Kurs morgen?'],['Maria','Normalerweise um neun, aber morgen beginnt er erst um halb elf.'],['Mann','Um halb elf? Super, dann kann ich länger schlafen.']],q:'Wann beginnt der Kurs morgen?',o:['Um 9:00 Uhr','Um 10:30 Uhr','Um 11:30 Uhr'],a:1},
   {au:[['Mann','Entschuldigung, wo ist hier die Post?'],['Frau','Die Post? Gehen Sie geradeaus und dann links. Sie ist neben dem Supermarkt.'],['Mann','Vielen Dank!']],q:'Was sucht der Mann?',o:['Die Post','Den Supermarkt','Den Bahnhof'],a:0},
   {au:[['Kellner','Was möchten Sie trinken? Einen Kaffee?'],['Frau','Nein danke, keinen Kaffee. Ich nehme einen Tee mit Milch.']],q:'Was möchte die Frau trinken?',o:['Kaffee','Tee','Wasser'],a:1},
   {au:[['Gast','Guten Abend, mein Name ist Weber. Ich habe ein Zimmer reserviert.'],['Rezeption','Ja, Herr Weber. Sie haben Zimmer zweihundertvierzehn, im zweiten Stock.']],q:'Welche Zimmernummer hat Herr Weber?',o:['204','214','240'],a:1},
   {au:[['Frau','Paul, fährst du mit dem Auto zur Arbeit?'],['Paul','Nein, das Auto ist kaputt. Diese Woche fahre ich mit dem Fahrrad.'],['Frau','Und wenn es regnet?'],['Paul','Dann nehme ich den Bus. Aber heute scheint die Sonne.']],q:'Wie fährt Paul heute zur Arbeit?',o:['Mit dem Auto','Mit dem Fahrrad','Mit dem Bus'],a:1}]},
 {t:'Teil 2',i:'Slušaš obavještenja. Svaki tekst čuješ samo jednom. Tačno ili netačno?',d:'Sie hören vier Ansagen. Sie hören jeden Text einmal.',plays:1,rf:RF,
  items:[{au:'Achtung am Gleis drei: Der Zug nach München hat heute zwanzig Minuten Verspätung.',q:'Der Zug nach München kommt pünktlich.',a:false},
   {au:'Liebe Kunden, unser Supermarkt schließt in zehn Minuten. Bitte kommen Sie zur Kasse.',q:'Der Supermarkt ist bald geschlossen.',a:true},
   {au:'Der Flug LH 345 nach Wien ist jetzt bereit zum Einsteigen. Bitte gehen Sie zum Ausgang B 12.',q:'Die Passagiere nach Wien sollen zum Ausgang B 12 gehen.',a:true},
   {au:'Heute im Angebot: Ein Kilo Tomaten nur ein Euro neunzig. Das Angebot gilt nur heute.',q:'Die Tomaten sind die ganze Woche billig.',a:false}]},
 {t:'Teil 3',i:'Slušaš poruke na telefonskoj sekretarici. Svaki tekst čuješ dva puta. Izaberi a, b ili c.',d:'Sie hören fünf Ansagen am Telefon. Sie hören jeden Text zweimal.',plays:2,
  items:[{au:'Hallo Jan, hier ist Lisa. Ich kann heute leider nicht ins Kino kommen. Ich bin krank. Können wir am Samstag gehen? Ruf mich bitte an.',q:'Wann möchte Lisa ins Kino gehen?',o:['Heute','Am Samstag','Am Sonntag'],a:1},
   {au:'Guten Tag, Frau Novak. Hier ist die Praxis Doktor Berger. Ihr Termin am Dienstag geht leider nicht. Können Sie am Donnerstag um fünfzehn Uhr kommen?',q:'Wann ist der neue Termin?',o:['Dienstag, 15 Uhr','Donnerstag, 15 Uhr','Donnerstag, 5 Uhr'],a:1},
   {au:'Hallo Mama, ich bin es, Tim. Ich komme heute später nach Hause, so um acht. Ich muss noch mit Max für die Prüfung lernen.',q:'Warum kommt Tim später?',o:['Er arbeitet.','Er lernt mit Max.','Er geht einkaufen.'],a:1},
   {au:'Hallo, hier ist das Autohaus Schmidt. Ihr Auto ist fertig. Sie können es heute bis achtzehn Uhr abholen. Die Reparatur kostet hundertzwanzig Euro.',q:'Bis wann kann man das Auto abholen?',o:['Bis 16 Uhr','Bis 18 Uhr','Bis 20 Uhr'],a:1},
   {au:'Hallo Sara, hier ist Ana. Wir machen am Freitag eine Party. Kannst du einen Salat mitbringen? Getränke haben wir genug.',q:'Was soll Sara mitbringen?',o:['Getränke','Einen Salat','Einen Kuchen'],a:1}]}]},
schreiben:{min:20,desc:'2 dijela · formular + poruka',intro:'Dio 1: popuni formular. Dio 2: napiši kratku poruku (oko 30 riječi).',tasks:[
 {type:'form',t:'Teil 1 · Formular',i:'Tvoj prijatelj se upisuje u sportski klub. Pročitaj tekst i popuni 5 polja u formularu.',
  text:'Ihr Freund Marko Jurić möchte im Sportverein Fit+ Mitglied werden. Er ist 28 Jahre alt und wohnt in der Gartenstraße 12 in 80331 München. Er möchte am Wochenende trainieren und mit Karte bezahlen. Seine Telefonnummer ist 0176 445566.',
  fields:[['Familienname','Jurić'],['Vorname',['marko']],['Alter',['28','28 jahre']],['PLZ, Wohnort',['80331 münchen','münchen','80331']],['Training (wochentags / am Wochenende)',['am wochenende','wochenende']],['Zahlung (bar / mit Karte)',['mit karte','karte']]]},
 {type:'text',t:'Teil 2 · Poruka',i:'Napiši e-mail prijateljici Leni. Napiši 1–2 rečenice za svaku tačku. Ne zaboravi pozdrav na početku i na kraju.',words:30,
  d:'Sie haben am Samstag Geburtstag und machen eine Party. Schreiben Sie Ihrer Freundin Lena eine E-Mail.',
  pts:['Warum schreiben Sie?','Wann und wo ist die Party?','Was soll Lena mitbringen?'],
  model:'Liebe Lena,\nam Samstag habe ich Geburtstag und ich mache eine Party. Sie beginnt um 19 Uhr bei mir zu Hause in der Gartenstraße 12. Kannst du bitte einen Kuchen mitbringen? Ich freue mich auf dich!\nViele Grüße\nAmir'}]},
sprechen:{min:15,desc:'3 dijela · u grupi',intro:'Na ispitu govoriš u grupi s drugim kandidatima. Ovdje vježbaš sam: pročitaj zadatak, snimi se i uporedi s primjerom.',tasks:[
 {t:'Teil 1 · Sich vorstellen',i:'Predstavi se pomoću ovih riječi. Zatim sriči svoje ime (buchstabieren) i reci broj telefona.',cards:['Name?','Alter?','Land?','Wohnort?','Sprachen?','Beruf?','Hobby?'],
  model:'Mein Name ist Amir Hodžić. Ich bin 32 Jahre alt. Ich komme aus Bosnien und wohne jetzt in Stuttgart. Ich spreche Bosnisch, ein bisschen Englisch und ein bisschen Deutsch. Ich bin Elektriker von Beruf. Mein Hobby ist Fußball.\nMein Name: H – O – D – Ž – I – Ć.\nMeine Telefonnummer ist 0176 12 34 56.',
  phrases:['Mein Name ist …','Ich bin … Jahre alt.','Ich komme aus …','Ich wohne in …','Ich spreche …','Ich bin … von Beruf.','Mein Hobby ist …']},
 {t:'Teil 2 · Fragen stellen und antworten',i:'Tema „Essen und Trinken". Za svaku karticu postavi pitanje i odgovori na njega.',cards:['Frühstück','Lieblingsessen','Restaurant','Obst'],
  model:'Was isst du zum Frühstück? – Ich esse Brot mit Käse und trinke Kaffee.\nWas ist dein Lieblingsessen? – Mein Lieblingsessen ist Pita.\nGehst du oft ins Restaurant? – Nein, nur am Wochenende.\nWelches Obst magst du? – Ich mag Äpfel und Bananen.',
  phrases:['Was isst du …?','Was trinkst du …?','Magst du …?','Ja, gern. / Nein, nicht so gern.']},
 {t:'Teil 3 · Bitten formulieren',i:'Za svaku sliku zamoli nekoga za nešto i odgovori na molbu.',cards:['🪟 Fenster','🖊️ Kugelschreiber','💧 Wasser','📱 Handy'],
  model:'Können Sie bitte das Fenster aufmachen? – Ja, gern.\nGibst du mir bitte deinen Kugelschreiber? – Hier, bitte.\nIch hätte gern ein Glas Wasser, bitte. – Natürlich.\nKann ich bitte kurz dein Handy benutzen? – Ja, kein Problem.',
  phrases:['Können Sie bitte …?','Gibst du mir bitte …?','Ich hätte gern …','Ja, gern. / Hier, bitte. / Tut mir leid, …']}]}},

A2:{name:'Goethe-Zertifikat A2',info:'Lesen 30 · Hören 30 · Schreiben 30 · Sprechen 15 min',
lesen:{min:30,desc:'4 dijela · 20 zadataka',intro:'Čitaš novinski članak, informativnu tablu, e-mail i oglase.',parts:[
 {t:'Teil 1',i:'Pročitaj članak i izaberi a, b ili c.',d:'Lesen Sie den Text und die Aufgaben. Wählen Sie die richtige Lösung.',
  text:'Ein Café für Jung und Alt\nIn Leipzig gibt es seit März ein besonderes Café. Hier arbeiten Studentinnen und Studenten zusammen mit Rentnern. Die Idee hatte Petra Lindner, 64 Jahre alt. „Viele ältere Menschen sind allein. Und viele Studenten haben wenig Geld", sagt sie. Im Café „Zusammen" backen die Senioren Kuchen nach alten Rezepten, und die Studenten machen den Service. Das Café ist von Mittwoch bis Sonntag geöffnet. Am Montag und Dienstag gibt es dort Computerkurse: Die Studenten zeigen den Senioren, wie man ein Smartphone benutzt. Die Kurse sind kostenlos. Für den Kaffee bezahlt jeder so viel, wie er möchte.',
  items:[{q:'Das Café gibt es …',o:['seit März.','seit 64 Jahren.','seit einem Jahr.'],a:0},
   {q:'Petra Lindner …',o:['ist Studentin.','hatte die Idee für das Café.','arbeitet im Service.'],a:1},
   {q:'Die Senioren im Café …',o:['machen den Service.','backen Kuchen.','lernen kochen.'],a:1},
   {q:'Am Montag …',o:['gibt es Computerkurse.','gibt es Kuchen gratis.','arbeiten nur Studenten im Café.'],a:0},
   {q:'Den Kaffee …',o:['bezahlt man nicht.','bezahlt man nur mit Karte.','bezahlt jeder so viel, wie er möchte.'],a:2}]},
 {t:'Teil 2',i:'Pročitaj informativnu tablu robne kuće. Na koji sprat ideš? Izaberi a, b ili c.',d:'Lesen Sie die Informationstafel. In welches Stockwerk gehen Sie?',keep:true,
  text:'Kaufhaus Merkur – Informationen\nEG: Kosmetik · Schmuck · Taschen · Information\n1. Stock: Damenmode · Schuhe\n2. Stock: Herrenmode · Sportmode · Kinderkleidung\n3. Stock: Haushaltswaren · Elektrogeräte · Handys\n4. Stock: Restaurant · Spielwaren · Bücher',
  items:[{q:'Sie möchten eine Jacke für Ihren Mann kaufen.',o:['1. Stock','2. Stock','anderes Stockwerk'],a:1},
   {q:'Sie brauchen ein Ladekabel für Ihr Handy.',o:['Erdgeschoss','3. Stock','anderes Stockwerk'],a:1},
   {q:'Sie möchten zu Mittag essen.',o:['Erdgeschoss','2. Stock','anderes Stockwerk'],a:2},
   {q:'Sie suchen ein Spiel als Geschenk für Ihren Sohn.',o:['2. Stock','4. Stock','anderes Stockwerk'],a:1},
   {q:'Sie möchten ein Parfüm kaufen.',o:['Erdgeschoss','1. Stock','anderes Stockwerk'],a:0}]},
 {t:'Teil 3',i:'Pročitaj e-mail i izaberi a, b ili c.',d:'Lesen Sie die E-Mail und die Aufgaben.',
  text:'Hallo Jonas,\nvielen Dank für deine Einladung zum Grillen am Samstag! Leider kann ich nicht kommen, denn meine Schwester heiratet an dem Tag in Graz. Ich fahre schon am Freitag mit dem Zug hin und komme erst am Montag zurück.\nAber ich habe eine Idee: Am nächsten Wochenende ist das Stadtfest. Wollen wir zusammen hingehen? Am Samstag habe ich frei, am Sonntag muss ich arbeiten. Schreib mir, ob du Zeit hast!\nLiebe Grüße\nMira',
  items:[{q:'Mira kann nicht zum Grillen kommen, weil …',o:['sie arbeiten muss.','ihre Schwester heiratet.','sie krank ist.'],a:1},
   {q:'Mira fährt nach Graz …',o:['am Freitag.','am Samstag.','am Montag.'],a:0},
   {q:'Mira fährt …',o:['mit dem Auto.','mit dem Zug.','mit dem Bus.'],a:1},
   {q:'Mira möchte mit Jonas …',o:['grillen.','zum Stadtfest gehen.','nach Graz fahren.'],a:1},
   {q:'Am nächsten Wochenende hat Mira Zeit …',o:['am Samstag.','am Sonntag.','am Montag.'],a:0}]},
 {t:'Teil 4',i:'Pet osoba traži nešto. Koji oglas (a–f) odgovara kojoj osobi? Za jednu osobu nema oglasa → izaberi x.',d:'Welche Anzeige passt? Für eine Person gibt es keine passende Anzeige: Wählen Sie x.',keep:true,
  list:[['a','Gitarrenunterricht für Anfänger – auch am Wochenende. 15 € pro Stunde.'],['b','Nachhilfe in Mathe für Schüler der Klassen 5–10. Abends und online.'],['c','Gebrauchtes Fahrrad, 3 Jahre alt, sehr guter Zustand, 150 €.'],['d','Wir suchen Babysitter für zwei Kinder (3 und 6 Jahre), Mo–Fr nachmittags.'],['e','Kochkurs: Italienisch kochen, Samstag 10–14 Uhr, 45 €.'],['f','Zimmer in WG frei, 350 € warm, nahe Uni, ab 1. Mai.']],
  opts:['a','b','c','d','e','f','x'],
  items:[{q:'Sara (19) beginnt im Mai ihr Studium und sucht eine günstige Unterkunft.',a:5},{q:'Herr Kovač möchte am Wochenende ein Instrument lernen.',a:0},{q:'Lea (17) hat nachmittags Zeit und möchte mit Kindern Geld verdienen.',a:3},{q:'Familie Braun sucht ein neues Auto.',a:6},{q:'Tim hat Probleme in Mathematik und braucht abends Hilfe.',a:1}]}]},
hoeren:{min:30,desc:'4 dijela · 20 zadataka',intro:'Slušaš radio, telefonske poruke, razgovore i intervju.',parts:[
 {t:'Teil 1',i:'Slušaš pet kratkih tekstova. Svaki čuješ dva puta. Izaberi a, b ili c.',d:'Sie hören fünf kurze Texte. Sie hören jeden Text zweimal.',plays:2,
  items:[{au:'Das Wetter für morgen: Am Vormittag regnet es noch, am Nachmittag scheint dann überall die Sonne. Die Temperaturen liegen bei achtzehn Grad.',q:'Wie ist das Wetter morgen Nachmittag?',o:['Es regnet.','Es ist sonnig.','Es schneit.'],a:1},
   {au:'Hallo Frau Ivić, hier ist das Reisebüro Sonnenschein. Ihre Tickets für die Reise nach Rom sind da. Sie können sie ab morgen bei uns abholen. Wir haben bis neunzehn Uhr geöffnet.',q:'Was soll Frau Ivić tun?',o:['Die Tickets abholen.','Das Reisebüro anrufen.','Die Reise bezahlen.'],a:0},
   {au:'Achtung, liebe Fahrgäste: Wegen Bauarbeiten fährt die U-Bahn-Linie drei heute nur bis zum Hauptbahnhof. Bitte nehmen Sie ab dort den Bus achtundfünfzig.',q:'Was müssen die Fahrgäste ab dem Hauptbahnhof machen?',o:['Zu Fuß gehen.','Den Bus nehmen.','Ein Taxi nehmen.'],a:1},
   {au:'Und jetzt ein Tipp für das Wochenende: Im Stadtpark gibt es am Samstag ein Konzert für die ganze Familie. Der Eintritt ist frei. Los geht es um sechzehn Uhr.',q:'Was kostet das Konzert?',o:['Nichts.','16 Euro.','6 Euro.'],a:0},
   {au:'Hallo Daniel, hier ist Ivana. Ich stehe vor dem Kino, aber du bist nicht da. Der Film beginnt in zehn Minuten. Ich kaufe schon mal die Karten. Bis gleich!',q:'Was macht Ivana?',o:['Sie geht nach Hause.','Sie kauft die Karten.','Sie wartet im Café.'],a:1}]},
 {t:'Teil 2',i:'Slušaš razgovor jednom. Šta Karim radi koji dan? Izaberi aktivnost za svaki dan.',d:'Sie hören ein Gespräch. Sie hören den Text einmal. Was macht Karim wann?',plays:1,keep:true,
  au:[['Frau','Du, Karim, was machst du eigentlich nächste Woche?'],['Karim','Puh, viel! Am Montag habe ich einen Arzttermin. Am Dienstag gehe ich nach der Arbeit ins Fitnessstudio.'],['Frau','Und am Mittwoch?'],['Karim','Am Mittwoch kommt meine Mutter zu Besuch, da koche ich. Am Donnerstag habe ich frei, da gehe ich schwimmen. Und am Freitag fahre ich zu meinem Freund nach Köln.']],
  opts:['Arzt','Fitnessstudio','kochen','schwimmen','nach Köln fahren','Kino'],
  items:[{q:'Montag',a:0},{q:'Dienstag',a:1},{q:'Mittwoch',a:2},{q:'Donnerstag',a:3},{q:'Freitag',a:4}]},
 {t:'Teil 3',i:'Slušaš pet kratkih razgovora. Svaki čuješ dva puta. Izaberi a, b ili c.',d:'Sie hören fünf kurze Gespräche. Sie hören jeden Text zweimal.',plays:2,
  items:[{au:[['Mann','Guten Tag, ich möchte ein Paket nach Bosnien schicken. Was kostet das?'],['Frau','Wie schwer ist es?'],['Mann','Ungefähr fünf Kilo.'],['Frau','Dann kostet es zweiunddreißig Euro.']],q:'Wie viel kostet das Paket?',o:['5 Euro','23 Euro','32 Euro'],a:2},
   {au:[['Frau','Entschuldigung, ich suche die Toiletten.'],['Mann','Die sind im ersten Stock, neben dem Aufzug.'],['Frau','Und wo ist der Aufzug?'],['Mann','Gleich da hinten links.']],q:'Wo sind die Toiletten?',o:['Im Erdgeschoss.','Im ersten Stock.','Im Keller.'],a:1},
   {au:[['Mann','Was ist los? Du siehst müde aus.'],['Frau','Ich habe schlecht geschlafen. Mein Nachbar hat bis drei Uhr laut Musik gehört.'],['Mann','Oh nein! Sprich doch mal mit ihm.']],q:'Warum ist die Frau müde?',o:['Sie hat lange gearbeitet.','Der Nachbar war laut.','Sie war auf einer Party.'],a:1},
   {au:[['Mann','Möchtest du am Wochenende mit uns wandern?'],['Frau','Gern, aber am Samstag muss ich arbeiten.'],['Mann','Wir gehen am Sonntag.'],['Frau','Super, dann komme ich mit!']],q:'Wann geht die Frau wandern?',o:['Am Samstag.','Am Sonntag.','Gar nicht.'],a:1},
   {au:[['Mann','Ich hätte gern ein Kilo Äpfel und zwei Zitronen.'],['Verkäuferin','Gern. Noch etwas?'],['Mann','Ja, ein Brot, bitte. Ach nein, Brot habe ich noch zu Hause.']],q:'Was kauft der Mann?',o:['Äpfel und Zitronen.','Äpfel, Zitronen und Brot.','Nur Brot.'],a:0}]},
 {t:'Teil 4',i:'Slušaš intervju na radiju dva puta. Da li je rečenica tačna: Ja ili Nein?',d:'Sie hören ein Interview. Sie hören den Text zweimal. Wählen Sie Ja oder Nein.',plays:2,rf:YN,
  au:[['Moderatorin','Herzlich willkommen, Herr Hadžić. Sie haben vor zwei Jahren ein Restaurant in Stuttgart eröffnet. Wie war der Anfang?'],['Herr Hadžić','Ehrlich gesagt, schwer. Ich habe vorher zehn Jahre als Koch in einem Hotel gearbeitet, aber ein eigenes Restaurant ist etwas ganz anderes.'],['Moderatorin','Was kochen Sie denn?'],['Herr Hadžić','Bosnische Spezialitäten, zum Beispiel Ćevapi und Burek. Aber wir haben auch vegetarische Gerichte, die sind bei jungen Gästen sehr beliebt.'],['Moderatorin','Wer arbeitet bei Ihnen?'],['Herr Hadžić','Meine Frau macht die Buchhaltung, und wir haben vier Mitarbeiter.'],['Moderatorin','Und Ihre Pläne?'],['Herr Hadžić','Nächstes Jahr möchten wir ein zweites Restaurant in Ulm eröffnen.']],
  items:[{q:'Herr Hadžić hat das Restaurant vor zwei Jahren eröffnet.',a:true},{q:'Vorher hat er in einem Hotel gearbeitet.',a:true},{q:'Im Restaurant gibt es kein vegetarisches Essen.',a:false},{q:'Seine Frau kocht im Restaurant.',a:false},{q:'Er möchte ein zweites Restaurant in Stuttgart eröffnen.',a:false}]}]},
schreiben:{min:30,desc:'2 dijela · SMS + e-mail',intro:'Pišeš dvije kratke poruke. Obradi sve tačke iz zadatka.',tasks:[
 {type:'text',t:'Teil 1 · SMS',i:'Napiši SMS (20–30 riječi). Obradi sve tri tačke.',words:20,
  d:'Sie sind mit Ihrer Freundin Jana zum Essen verabredet, aber Sie kommen zu spät. Schreiben Sie Jana eine SMS.',
  pts:['Entschuldigen Sie sich.','Schreiben Sie, warum Sie später kommen.','Schreiben Sie, wann Sie da sind.'],
  model:'Hallo Jana,\nes tut mir leid, ich komme etwas später. Mein Bus hat Verspätung. Ich bin um halb acht da. Bestell doch schon etwas zu trinken!\nBis gleich\nAmir'},
 {type:'text',t:'Teil 2 · E-Mail',i:'Napiši e-mail (30–40 riječi). Obradi sve tri tačke. Ne zaboravi pozdrav i potpis.',words:30,
  d:'Sie können am Montag nicht zum Deutschkurs kommen. Schreiben Sie Ihrer Kursleiterin, Frau Schulz, eine E-Mail.',
  pts:['Entschuldigen Sie sich und nennen Sie den Grund.','Fragen Sie nach den Hausaufgaben.','Fragen Sie, wann der nächste Test ist.'],
  model:'Liebe Frau Schulz,\nleider kann ich am Montag nicht zum Kurs kommen, weil ich einen Termin beim Arzt habe. Können Sie mir bitte sagen, welche Hausaufgaben wir machen sollen? Und wann ist der nächste Test?\nVielen Dank und viele Grüße\nAmir Hodžić'}]},
sprechen:{min:15,desc:'3 dijela · u paru',intro:'Na ispitu govoriš s partnerom. Ovdje vježbaš sam: snimi se i uporedi s primjerom.',tasks:[
 {t:'Teil 1 · Fragen zur Person',i:'Postavi partneru pitanja uz ove riječi i odgovori na njegova pitanja.',cards:['Geburtstag?','Wohnort?','Beruf?','Familie?','Hobby?'],
  model:'Wann hast du Geburtstag? – Am 14. Mai.\nWo wohnst du? – In Stuttgart, in einer kleinen Wohnung.\nWas bist du von Beruf? – Ich bin Elektriker.\nHast du Familie? – Ja, meine Eltern und mein Bruder leben in Bosnien.\nWas ist dein Hobby? – Ich spiele gern Fußball.',
  phrases:['Wann …?','Wo …?','Was …?','Hast du …?']},
 {t:'Teil 2 · Über sich sprechen',i:'Pričaj o temi „Šta radiš za vikend?". Spomeni sve četiri tačke.',cards:['Familie','Freunde','Sport','Essen'],
  model:'Am Wochenende schlafe ich zuerst lange. Am Samstag telefoniere ich mit meiner Familie in Bosnien. Am Nachmittag treffe ich oft Freunde, wir gehen zusammen in ein Café. Am Sonntag spiele ich Fußball im Verein. Abends koche ich gern, zum Beispiel Suppe oder Fleisch mit Gemüse.',
  phrases:['Am Wochenende …','Zuerst … dann … danach …','Ich … gern.','Meistens / oft / manchmal …']},
 {t:'Teil 3 · Gemeinsam etwas planen',i:'Želite zajedno posjetiti prijatelja u bolnici u subotu. Pronađite zajednički termin. Tvoj kalendar:',cards:['8–12: Arbeit','13:00: Mittagessen mit Mutter','15–16: Friseur','18:00: Kino'],
  model:'Wann hast du am Samstag Zeit? Ich arbeite bis zwölf Uhr. – Um eins esse ich mit meiner Mutter. Geht es um zwei? – Ja, das passt. Aber um drei muss ich zum Friseur. – Dann gehen wir von zwei bis drei ins Krankenhaus. Bringen wir Blumen mit? – Gute Idee!',
  phrases:['Hast du um … Zeit?','Da kann ich leider nicht, ich …','Geht es um …?','Das passt gut.','Wollen wir … mitbringen?']}]}},

B1:{name:'Goethe-Zertifikat B1',info:'Lesen 65 · Hören 40 · Schreiben 60 · Sprechen 15 min',
lesen:{min:65,desc:'5 dijelova · 30 zadataka',intro:'Čitaš blog, novinske članke, oglase, mišljenja čitalaca i pravila.',parts:[
 {t:'Teil 1',i:'Pročitaj blog. Da li je rečenica tačna (Richtig) ili netačna (Falsch)?',d:'Lesen Sie den Text. Sind die Aussagen richtig oder falsch?',rf:RF,
  text:'Mein erstes Jahr in Deutschland\nVor genau einem Jahr bin ich von Mostar nach Nürnberg gezogen. Ich hatte einen Arbeitsvertrag als Kfz-Mechaniker, aber ich konnte kaum Deutsch. Die ersten Wochen waren hart: In der Werkstatt haben alle sehr schnell gesprochen, und oft habe ich nur genickt, obwohl ich nichts verstanden habe. Ein Kollege, Stefan, hat mir dann geholfen. Er hat mir jeden Tag fünf neue Wörter auf einen Zettel geschrieben – meistens Werkzeuge und Autoteile. Abends habe ich zusätzlich zweimal pro Woche einen Deutschkurs an der Volkshochschule besucht. Am schwierigsten fand ich übrigens nicht die Grammatik, sondern die Briefe von Ämtern. Inzwischen verstehe ich fast alles, und letzten Monat habe ich die B1-Prüfung bestanden. Mein nächstes Ziel: der Lkw-Führerschein.',
  items:[{q:'Der Autor lebt seit einem Jahr in Nürnberg.',a:true},{q:'Als er ankam, sprach er schon gut Deutsch.',a:false},{q:'Am Anfang hat er bei der Arbeit nicht immer alles verstanden.',a:true},{q:'Stefan hat ihm Wörter aus dem Arbeitsalltag beigebracht.',a:true},{q:'Für ihn war die Grammatik das größte Problem.',a:false},{q:'Er hat die B1-Prüfung noch nicht gemacht.',a:false}]},
 {t:'Teil 2',i:'Pročitaj dva članka i izaberi a, b ili c.',d:'Lesen Sie die Texte und die Aufgaben. Wählen Sie die richtige Lösung.',
  text:'Immer mehr Firmen testen die Vier-Tage-Woche\nEine Softwarefirma aus Hannover hat es vor einem Jahr ausprobiert: Die Mitarbeiter arbeiten nur noch von Montag bis Donnerstag, bekommen aber das gleiche Gehalt. Das Ergebnis überrascht viele: Die Zahl der Krankheitstage ist um ein Drittel gesunken, und die Firma findet leichter neue Mitarbeiter. Allerdings müssen die Teams ihre Arbeit besser planen. Besprechungen dürfen zum Beispiel höchstens 30 Minuten dauern. Nicht alle Branchen können das Modell übernehmen: In Krankenhäusern oder im Handwerk ist es schwieriger, weil Kunden und Patienten jeden Tag versorgt werden müssen.',
  items:[{q:'In der Firma aus Hannover …',o:['arbeiten die Mitarbeiter vier Tage und verdienen weniger.','arbeiten die Mitarbeiter vier Tage für das gleiche Geld.','arbeiten alle nur noch von zu Hause.'],a:1},
   {q:'Seit der Vier-Tage-Woche …',o:['sind die Mitarbeiter seltener krank.','gibt es mehr Besprechungen.','sucht die Firma keine Mitarbeiter mehr.'],a:0},
   {q:'Im Text steht, dass die Vier-Tage-Woche …',o:['für alle Branchen geeignet ist.','im Handwerk besonders einfach ist.','nicht in jedem Beruf leicht möglich ist.'],a:2},
   {text:'Repair-Café: Reparieren statt wegwerfen\nJeden ersten Samstag im Monat treffen sich im Gemeindehaus in Bochum Menschen mit kaputten Toastern, Lampen oder Hosen. Ehrenamtliche Helfer – darunter Elektriker, Schneiderinnen und Fahrradmechaniker – reparieren die Sachen gemeinsam mit den Besitzern. Bezahlen muss niemand, aber viele Besucher geben eine kleine Spende für Kaffee und Ersatzteile. „Es geht nicht nur ums Geld", sagt Organisatorin Ute Brand. „Die Leute lernen, wie ihre Geräte funktionieren, und produzieren weniger Müll." Etwa 70 Prozent der Gegenstände können repariert werden.',
    q:'Das Repair-Café findet … statt.',o:['jeden Samstag','einmal im Monat','jeden ersten Montag'],a:1},
   {q:'Die Reparatur …',o:['kostet eine feste Gebühr.','ist kostenlos.','bezahlt die Stadt.'],a:1},
   {q:'Laut Ute Brand ist ein Ziel auch, …',o:['neue Geräte zu verkaufen.','dass die Leute etwas lernen.','Geld für den Verein zu sammeln.'],a:1}]},
 {t:'Teil 3',i:'Sedam osoba traži kurs ili aktivnost. Koji oglas (a–j) odgovara kome? Ako nijedan ne odgovara, izaberi x.',d:'Lesen Sie die Situationen und die Anzeigen. Welche Anzeige passt? Für eine Situation gibt es keine Anzeige: x.',keep:true,
  list:[['a','Abendschule: Realschulabschluss in zwei Jahren nachholen. Unterricht Mo–Do 18–21 Uhr.'],['b','Erste-Hilfe-Kurs für den Führerschein, Samstag 9–17 Uhr, 45 €.'],['c','Online-Kurs Excel für Einsteiger – flexible Zeiten, mit Zertifikat.'],['d','Laufgruppe für Anfänger, jeden Sonntag 9 Uhr im Stadtpark, kostenlos.'],['e','Elterncafé: Austausch für Mütter und Väter, Kinderbetreuung vor Ort, mittwochs 10 Uhr.'],['f','Bewerbungstraining: Lebenslauf, Anschreiben, Vorstellungsgespräch – gratis.'],['g','Tanzkurs für Paare: Salsa für Anfänger, freitags 20 Uhr.'],['h','Gitarre für Erwachsene – Einzelunterricht bei Ihnen zu Hause.'],['i','Deutschkurs B2 für Pflegekräfte mit Fachwortschatz, vormittags.'],['j','Fotokurs: Mit dem Smartphone schöne Bilder machen, zwei Abende.']],
  opts:['a','b','c','d','e','f','g','h','i','j','x'],
  items:[{q:'Nermin macht den Führerschein und braucht noch einen Nachweis über Erste Hilfe.',a:1},{q:'Jelena ist Krankenschwester und möchte ihr Deutsch für den Beruf verbessern.',a:8},{q:'Thomas will nach Feierabend einen Schulabschluss machen.',a:0},{q:'Amra hat ein Baby und sucht Kontakt zu anderen Eltern.',a:4},{q:'Herr Lang muss für die Arbeit lernen, mit Tabellen am Computer zu arbeiten, hat aber keine festen Zeiten.',a:2},{q:'Mia möchte mit dem Joggen anfangen, hat aber wenig Geld.',a:3},{q:'Dragan sucht einen Kurs, in dem er lernt, alte Möbel zu reparieren.',a:10}]},
 {t:'Teil 4',i:'Tema: „Treba li zabraniti mobitele u školama?" Da li je osoba ZA zabranu (Ja) ili PROTIV (Nein)?',d:'Ist die Person für ein Handyverbot an Schulen? Wählen Sie Ja oder Nein.',rf:YN,
  items:[{q:'Laura: Meine Tochter schaut in jeder Pause aufs Handy und redet kaum noch mit Freunden. In der Schule sollten Handys in der Tasche bleiben.',a:true},
   {q:'Kemal: Ein Verbot bringt nichts. Die Schüler müssen lernen, vernünftig mit dem Handy umzugehen – und das geht nur, wenn sie es benutzen dürfen.',a:false},
   {q:'Birgit (Lehrerin): Seit unsere Schule Handys verboten hat, sind die Schüler im Unterricht viel konzentrierter.',a:true},
   {q:'Jonas (16): Ich nutze das Handy im Unterricht als Wörterbuch und für Recherchen. Ohne wäre das viel schwieriger.',a:false},
   {q:'Petra: Für Notfälle müssen Kinder erreichbar sein. Ein komplettes Verbot finde ich falsch.',a:false},
   {q:'Ahmed: Cybermobbing passiert oft während der Schulzeit. Ohne Handys gäbe es weniger Probleme.',a:true},
   {q:'Sanja: Schulen sollten digitale Medien sinnvoll einsetzen, statt sie zu verbieten. Wir leben nun mal im 21. Jahrhundert.',a:false}]},
 {t:'Teil 5',i:'Pročitaj kućni red fitness centra i izaberi a, b ili c.',d:'Lesen Sie die Hausordnung und die Aufgaben.',
  text:'Hausordnung Fitnessstudio FitLine\n1. Das Training ist nur mit gültiger Mitgliedskarte erlaubt. Bitte zeigen Sie die Karte am Eingang.\n2. Aus hygienischen Gründen muss auf allen Geräten ein Handtuch benutzt werden.\n3. Getränke sind nur in verschlossenen Plastikflaschen erlaubt, Glasflaschen sind verboten.\n4. Die Spinde müssen nach dem Training geleert werden. Spinde, die nach 23 Uhr noch verschlossen sind, werden geöffnet.\n5. Jugendliche unter 16 Jahren dürfen nur in Begleitung eines Erwachsenen trainieren.',
  items:[{q:'Am Eingang muss man …',o:['bezahlen.','die Mitgliedskarte zeigen.','ein Handtuch kaufen.'],a:1},{q:'Auf den Geräten …',o:['muss man ein Handtuch benutzen.','darf man nichts trinken.','darf man nur 30 Minuten trainieren.'],a:0},{q:'Glasflaschen …',o:['sind erlaubt.','muss man am Eingang abgeben.','darf man nicht mitbringen.'],a:2},{q:'Ein 15-Jähriger darf …',o:['allein trainieren.','mit einem Erwachsenen trainieren.','gar nicht trainieren.'],a:1}]}]},
hoeren:{min:40,desc:'4 dijela · 30 zadataka',intro:'Slušaš obavještenja, poruke, vođenje kroz muzej, razgovor i radio diskusiju.',parts:[
 {t:'Teil 1',i:'Slušaš pet kratkih tekstova, svaki dva puta. Za svaki tekst riješi dva zadatka.',d:'Sie hören fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben.',plays:2,
  items:[{au:'Und hier noch eine Meldung aus der Region: Wegen eines Unfalls ist die Autobahn A neun zwischen Ingolstadt und Nürnberg in Richtung Norden gesperrt. Es gibt bereits zehn Kilometer Stau. Die Polizei empfiehlt, über die Bundesstraße dreizehn zu fahren. Die Sperrung dauert voraussichtlich bis zum Nachmittag.',q:'Die Autobahn ist in beide Richtungen gesperrt.',o:RF,a:1},
   {q:'Was empfiehlt die Polizei?',o:['Zu Hause bleiben.','Eine andere Straße nehmen.','Mit dem Zug fahren.'],a:1},
   {au:'Hallo Herr Marić, hier ist Sandra Kühn von der Firma Elektro-Bauer. Wir haben Ihre Bewerbung bekommen und möchten Sie gern zu einem Gespräch einladen. Hätten Sie am Mittwoch, den zwölften, um zehn Uhr Zeit? Bitte bringen Sie Ihre Zeugnisse mit. Rufen Sie mich doch kurz zurück, damit ich den Termin eintragen kann.',q:'Herr Marić soll zu einem Vorstellungsgespräch kommen.',o:RF,a:0},
   {q:'Was soll Herr Marić mitbringen?',o:['Seinen Ausweis.','Seine Zeugnisse.','Einen Lebenslauf.'],a:1},
   {au:'Liebe Kundinnen und Kunden, nur heute: Alle Wintermäntel und Winterschuhe sind um vierzig Prozent reduziert. Außerdem erhalten Sie in unserer Kinderabteilung im zweiten Stock beim Kauf von zwei Artikeln den dritten gratis. Wir wünschen Ihnen einen schönen Einkauf.',q:'Heute sind Wintersachen billiger.',o:RF,a:0},
   {q:'Was bekommt man in der Kinderabteilung?',o:['Vierzig Prozent Rabatt.','Beim Kauf von zwei Artikeln den dritten gratis.','Ein kleines Geschenk.'],a:1},
   {au:'Sie wollen Geld sparen und gleichzeitig etwas für die Umwelt tun? Dann schalten Sie Ihre Geräte ganz aus, statt sie im Stand-by-Modus zu lassen. Ein durchschnittlicher Haushalt kann so bis zu hundert Euro im Jahr sparen. Am einfachsten geht das mit einer Steckerleiste mit Schalter.',q:'Geräte im Stand-by-Modus verbrauchen keinen Strom.',o:RF,a:1},
   {q:'Wie viel kann ein Haushalt sparen?',o:['Bis zu 10 Euro im Monat.','Bis zu 100 Euro im Jahr.','Bis zu 100 Euro im Monat.'],a:1},
   {au:'Hi Lejla, hier ist Mario. Wegen Samstag: Das Fußballspiel fällt aus, der Platz ist zu nass. Wir wollen stattdessen bowlen gehen, um sieben im Bowlingcenter am Bahnhof. Kommst du mit? Jens bringt seine neue Freundin mit. Sag mir bis Freitag Bescheid, dann reserviere ich eine Bahn.',q:'Das Fußballspiel findet am Samstag statt.',o:RF,a:1},
   {q:'Was soll Lejla tun?',o:['Eine Bahn reservieren.','Bis Freitag Bescheid sagen.','Jens anrufen.'],a:1}]},
 {t:'Teil 2',i:'Slušaš vodiča u muzeju. Tekst čuješ jednom. Izaberi a, b ili c.',d:'Sie hören einen Text. Sie hören den Text einmal.',plays:1,
  au:'Guten Tag und herzlich willkommen im Museum für Technik! Ich bin Frau Weiß und begleite Sie heute durch die Ausstellung. Die Führung dauert etwa neunzig Minuten. Wir beginnen im Erdgeschoss mit der Geschichte des Autos. Danach fahren wir mit dem Aufzug in den zweiten Stock, wo Sie die Ausstellung über Elektrizität sehen. Dort dürfen Sie viele Experimente selbst ausprobieren. Bitte fotografieren Sie dort aber ohne Blitz. Im ersten Stock befinden sich das Café und der Museumsshop. Ihre Jacken und Taschen können Sie kostenlos in den Schließfächern neben der Kasse lassen. Sie brauchen nur eine Ein-Euro-Münze, die Sie später zurückbekommen. Die Führung endet um zwölf Uhr im Café, wo jeder Teilnehmer ein Getränk gratis bekommt.',
  items:[{q:'Die Führung dauert …',o:['eine Stunde.','anderthalb Stunden.','zwei Stunden.'],a:1},{q:'Was gibt es im zweiten Stock?',o:['Die Geschichte des Autos.','Experimente zur Elektrizität.','Das Café.'],a:1},{q:'Beim Fotografieren …',o:['ist der Blitz verboten.','muss man bezahlen.','gibt es keine Regeln.'],a:0},{q:'Die Schließfächer …',o:['kosten einen Euro.','sind kostenlos.','sind im ersten Stock.'],a:1},{q:'Am Ende der Führung …',o:['bekommt man ein Getränk gratis.','muss man in den Shop gehen.','gibt es ein Mittagessen.'],a:0}]},
 {t:'Teil 3',i:'Slušaš razgovor dvoje prijatelja jednom. Tačno ili netačno?',d:'Sie hören ein Gespräch. Sie hören das Gespräch einmal.',plays:1,rf:RF,
  au:[['Anna','Hey Emir! Lange nicht gesehen. Wie geht es dir?'],['Emir','Gut, danke! Ich bin gerade umgezogen, deshalb hatte ich so wenig Zeit.'],['Anna','Ach, wohin denn?'],['Emir','In eine Wohnung in der Südstadt. Sie ist größer als meine alte und hat sogar einen Balkon. Nur die Miete ist ein bisschen höher.'],['Anna','Und wie bist du umgezogen? Mit einer Firma?'],['Emir','Nein, das war mir zu teuer. Meine Brüder haben mir geholfen, und wir haben einen Transporter gemietet.'],['Anna','Und die Nachbarn?'],['Emir','Bis jetzt sehr nett. Die Frau unter mir hat mir sogar einen Kuchen gebracht.'],['Anna','Wie schön! Machst du eine Einweihungsparty?'],['Emir','Ja, aber erst nächsten Monat. Ich muss noch die Küche einrichten.'],['Anna','Sag Bescheid, ich helfe gern!']],
  items:[{q:'Emir hatte wenig Zeit, weil er umgezogen ist.',a:true},{q:'Die neue Wohnung ist kleiner als die alte.',a:false},{q:'Die neue Wohnung ist teurer.',a:true},{q:'Eine Umzugsfirma hat Emir geholfen.',a:false},{q:'Emirs Brüder haben beim Umzug geholfen.',a:true},{q:'Eine Nachbarin hat Emir einen Kuchen gebracht.',a:true},{q:'Die Party ist nächste Woche.',a:false}]},
 {t:'Teil 4',i:'Slušaš radio diskusiju dva puta. Ko šta kaže? Izaberi osobu.',d:'Sie hören eine Diskussion. Sie hören die Diskussion zweimal. Wer sagt was?',plays:2,keep:true,
  au:[['Moderator','Willkommen zu unserer Sendung „Thema am Abend". Heute geht es um das Homeoffice. Bei mir sind Frau Lehmann, Personalchefin einer Versicherung, und Herr Šabić, Programmierer. Frau Lehmann, viele Firmen holen ihre Leute wieder ins Büro zurück. Warum?'],['Frau Lehmann','Ich verstehe die Firmen. Wenn alle zu Hause arbeiten, fehlt der spontane Austausch in der Kaffeeküche. Gerade neue Kollegen lernen im Büro viel schneller.'],['Herr Šabić','Das sehe ich anders. Ich arbeite seit drei Jahren zu Hause und bin viel produktiver. Im Büro werde ich ständig unterbrochen.'],['Moderator','Aber fühlen Sie sich nicht manchmal allein, Herr Šabić?'],['Herr Šabić','Manchmal schon. Deshalb gehe ich einmal pro Woche ins Büro. Das finde ich ideal.'],['Frau Lehmann','Genau so ein Modell bieten wir inzwischen an: zwei Tage zu Hause, drei Tage im Büro. Das ist ein guter Kompromiss.'],['Moderator','Und was ist mit den Kosten? Die Mitarbeiter bezahlen zu Hause ja Strom und Heizung selbst.'],['Herr Šabić','Richtig, und das wird oft vergessen. Dafür spare ich aber jeden Tag eine Stunde Fahrzeit.'],['Frau Lehmann','Wir zahlen unseren Mitarbeitern deshalb einen Zuschuss für das Homeoffice.'],['Moderator','Zum Schluss: Wie sieht die Arbeit in zehn Jahren aus?'],['Frau Lehmann','Das Büro wird nicht verschwinden, aber es wird mehr ein Ort für Teamarbeit sein.'],['Herr Šabić','Ich glaube, dass man in Zukunft selbst entscheiden kann, wo man arbeitet.']],
  opts:['Moderator','Frau Lehmann','Herr Šabić'],
  items:[{q:'Neue Mitarbeiter lernen im Büro schneller.',a:1},{q:'Im Büro kann man sich schlechter konzentrieren.',a:2},{q:'Zu Hause zahlen die Mitarbeiter die Energiekosten selbst.',a:0},{q:'Einmal pro Woche ins Büro zu gehen, ist ideal.',a:2},{q:'Eine Mischung aus Büro und Homeoffice ist ein guter Kompromiss.',a:1},{q:'Durch das Homeoffice spart man Zeit.',a:2},{q:'Die Firma gibt Geld für die Arbeit zu Hause.',a:1},{q:'In Zukunft wählen die Menschen ihren Arbeitsort selbst.',a:2}]}]},
schreiben:{min:60,desc:'3 zadatka · 80 + 80 + 40 riječi',intro:'Pišeš neformalni e-mail, mišljenje za forum i kratku formalnu poruku. Za svaki zadatak je preporučeno vrijeme: 20 / 25 / 15 minuta.',tasks:[
 {type:'text',t:'Aufgabe 1 · E-Mail an einen Freund (ca. 80 Wörter)',i:'Napiši e-mail prijatelju. Obradi sve tri tačke, s uvodom i završetkom.',words:80,
  d:'Sie waren letztes Wochenende auf der Hochzeit eines Freundes. Ihr Freund Daniel konnte nicht kommen. Schreiben Sie Daniel eine E-Mail.',
  pts:['Beschreiben Sie: Wie war die Feier?','Begründen Sie: Was hat Ihnen besonders gut gefallen?','Machen Sie einen Vorschlag für ein Treffen.'],
  model:'Lieber Daniel,\nschade, dass du am Samstag nicht bei Marcos Hochzeit warst! Die Feier war wirklich toll. Zuerst waren wir in der Kirche, danach haben wir in einem Restaurant am See gefeiert. Es gab über hundert Gäste und eine Live-Band. Besonders gut hat mir das Essen gefallen, weil es Spezialitäten aus Marcos Heimat gab. Außerdem haben wir bis drei Uhr nachts getanzt. Ich habe viele Fotos gemacht. Hast du nächsten Freitag Zeit? Dann können wir zusammen essen gehen und ich zeige dir die Bilder.\nViele Grüße\nAmir'},
 {type:'text',noLetter:true,t:'Aufgabe 2 · Meinung im Forum (ca. 80 Wörter)',i:'Napiši svoje mišljenje u gostinjsku knjigu emisije. Osvrni se i na Katjino mišljenje.',words:80,
  d:'Sie haben im Fernsehen eine Diskussion zum Thema „Sollen Kinder schon im Kindergarten eine Fremdsprache lernen?" gesehen. Im Online-Gästebuch der Sendung schreibt Katja: „Kinder sollen spielen. Fremdsprachen lernen sie früh genug in der Schule." Schreiben Sie nun Ihre Meinung.',
  pts:['Eigene Meinung klar nennen','Meinung begründen','Beispiel oder eigene Erfahrung','Auf Katjas Meinung reagieren'],
  model:'Ich bin anderer Meinung als Katja. Meiner Meinung nach ist der Kindergarten der beste Ort, um eine Fremdsprache zu lernen. Kleine Kinder lernen Sprachen spielerisch und ohne Angst vor Fehlern. Ich sehe das bei meinem Neffen: Er ist fünf Jahre alt und singt schon englische Lieder. Natürlich hat Katja recht, dass Kinder viel spielen sollen. Aber das ist kein Widerspruch, denn man kann eine Sprache auch beim Spielen lernen. Deshalb finde ich Fremdsprachen im Kindergarten sinnvoll.'},
 {type:'text',formal:true,t:'Aufgabe 3 · Formelle Nachricht (ca. 40 Wörter)',i:'Napiši kratku formalnu poruku šefici. Izvini se ljubazno i objasni zašto ne možeš doći.',words:40,
  d:'Sie haben morgen einen Termin bei Ihrer Chefin, Frau Bergmann, können aber nicht kommen. Schreiben Sie Frau Bergmann eine E-Mail.',
  pts:['Höflich entschuldigen','Grund nennen','Neuen Termin vorschlagen oder um Rückmeldung bitten'],
  model:'Sehr geehrte Frau Bergmann,\nleider kann ich morgen nicht zu unserem Termin um 10 Uhr kommen, weil mein Sohn krank ist und ich bei ihm bleiben muss. Es tut mir sehr leid. Wäre es möglich, den Termin auf Donnerstag zu verschieben?\nMit freundlichen Grüßen\nAmir Hodžić'}]},
sprechen:{min:15,desc:'3 dijela · u paru',intro:'Na ispitu govoriš s partnerom: zajedno nešto planirate, držiš prezentaciju i reaguješ na prezentaciju partnera.',tasks:[
 {t:'Teil 1 · Gemeinsam etwas planen (ca. 3 Min.)',i:'Kolega ima rođendan i želite mu zajedno organizovati iznenađenje. Pričajte o ovim tačkama, dajte prijedloge i reagujte na prijedloge partnera.',cards:['Wann feiern?','Wo feiern?','Welches Geschenk?','Wer wird eingeladen?','Essen und Getränke?'],
  model:'Was hältst du davon, wenn wir am Freitag nach der Arbeit feiern? – Gute Idee, da haben alle Zeit.\nWo sollen wir feiern? Ich schlage vor, wir machen es im Pausenraum. – Ja, das ist praktisch.\nWas könnten wir ihm schenken? Er fährt gern Fahrrad. – Wie wäre es mit einem Gutschein für ein Fahrradgeschäft?\nWen laden wir ein? – Ich denke, das ganze Team.\nUnd was ist mit Essen? – Ich kann einen Kuchen backen, und du kümmerst dich um die Getränke, okay?',
  phrases:['Wie wäre es, wenn …?','Ich schlage vor, dass …','Was hältst du davon?','Das ist eine gute Idee, aber …','Einverstanden! / Dann machen wir es so.']},
 {t:'Teil 2 · Ein Thema präsentieren (ca. 3 Min.)',i:'Održi kratku prezentaciju na temu „Arbeiten im Homeoffice". Prati ovih pet folija.',cards:['1. Thema vorstellen','2. Persönliche Erfahrung','3. Situation im Heimatland','4. Vor- und Nachteile + Meinung','5. Abschluss und Dank'],
  model:'Ich möchte heute über das Thema „Arbeiten im Homeoffice" sprechen. Zuerst erzähle ich von meiner Erfahrung, dann von der Situation in meinem Heimatland, und am Ende nenne ich Vor- und Nachteile.\nIch arbeite als Elektriker, deshalb kann ich nicht von zu Hause arbeiten. Meine Schwester arbeitet aber zwei Tage pro Woche im Homeoffice.\nIn Bosnien ist Homeoffice noch nicht so verbreitet wie in Deutschland, vor allem in kleinen Firmen.\nEin Vorteil ist, dass man keine Fahrzeit hat. Ein Nachteil ist, dass man weniger Kontakt zu Kollegen hat. Ich finde eine Mischung aus Büro und Homeoffice am besten.\nDamit bin ich am Ende. Vielen Dank für Ihre Aufmerksamkeit! Haben Sie Fragen?',
  phrases:['Ich möchte über … sprechen.','Zuerst … dann … zum Schluss …','In meinem Heimatland …','Ein Vorteil / Nachteil ist, dass …','Vielen Dank fürs Zuhören.']},
 {t:'Teil 3 · Über ein Thema sprechen (ca. 2 Min.)',i:'Partner je održao prezentaciju „Sport im Alltag". Daj povratnu informaciju (šta ti se svidjelo) i postavi jedno pitanje. Zatim odgovori na pitanje o svojoj prezentaciji.',cards:['Rückmeldung geben','Eine Frage stellen','Auf eine Frage antworten'],
  model:'Vielen Dank für deine Präsentation. Besonders interessant fand ich, dass du jeden Tag mit dem Fahrrad zur Arbeit fährst. Ich habe eine Frage: Was machst du, wenn es im Winter regnet oder schneit?\n– Frage an mich: „Würdest du gern im Homeoffice arbeiten?" – Antwort: Ehrlich gesagt nicht jeden Tag. Ich brauche den Kontakt zu Kollegen, aber ein oder zwei Tage pro Woche fände ich gut.',
  phrases:['Vielen Dank für die Präsentation.','Besonders interessant fand ich …','Ich habe eine Frage zu …','Das ist eine gute Frage.']}]}},
