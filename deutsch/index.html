B1:{name:'Probni ispit B1',info:'Lesen 65 · Hören 40 · Schreiben 60 · Sprechen 15 min',
lesen:{min:65,desc:'5 dijelova · 30 zadataka',intro:'Čitaš blog, novinske članke, oglase, mišljenja čitalaca i pravila.',parts:[
 {t:'Teil 1',i:'Pročitaj blog. Da li je rečenica tačna (Richtig) ili netačna (Falsch)?',d:'Lesen Sie den Text. Sind die Aussagen richtig oder falsch?',rf:RF,
  text:'Mein erstes Jahr in Deutschland\nVor genau einem Jahr bin ich von Mostar nach Nürnberg gezogen. Ich hatte einen Arbeitsvertrag als Kfz-Mechaniker, aber ich konnte kaum Deutsch. Die ersten Wochen waren hart: In der Werkstatt haben alle sehr schnell gesprochen, und oft habe ich nur genickt, obwohl ich nichts verstanden habe. Ein Kollege, Stefan, hat mir dann geholfen. Er hat mir jeden Tag fünf neue Wörter auf einen Zettel geschrieben – meistens Werkzeuge und Autoteile. Abends habe ich zusätzlich zweimal pro Woche einen Deutschkurs an der Volkshochschule besucht. Am schwierigsten fand ich übrigens nicht die Grammatik, sondern die Briefe von Ämtern. Inzwischen verstehe ich fast alles, und letzten Monat habe ich die B1-Prüfung bestanden. Mein nächstes Ziel: der Lkw-Führerschein.',
  items:[{q:'Der Autor lebt seit einem Jahr in Nürnberg.',a:true},{q:'Als er ankam, sprach er schon gut Deutsch.',a:false},{q:'Am Anfang hat er bei der Arbeit nicht immer alles verstanden.',a:true},{q:'Stefan hat ihm Wörter aus dem Arbeitsalltag beigebracht.',a:true},{q:'Für ihn war die Grammatik das größte Problem.',a:false},{q:'Er hat die B1-Prüfung noch nicht gemacht.',a:false}]},
 {t:'Teil 2',i:'Pročitaj dva članka i izaberi a, b ili c.',d:'Lesen Sie die Texte und die Aufgaben. Wählen Sie die richtige Lösung.',
  text:'Immer mehr Firmen testen die Vier-Tage-Woche\nEine Softwarefirma aus Hannover hat es vor einem Jahr ausprobiert: Die Mitarbeiter arbeiten nur noch von Montag bis Donnerstag, bekommen aber das gleiche Gehalt. Das Ergebnis überrascht viele: Die Zahl der Krankheitstage ist um ein Drittel gesunken, und die Firma findet leichter neue Mitarbeiter. Allerdings müssen die Teams ihre Arbeit besser planen. Besprechungen dürfen zum Beispiel höchstens 30 Minuten dauern. Nicht alle Branchen können das Modell übernehmen: In Krankenhäusern oder im Handwerk ist es schwieriger, weil Kunden und Patienten jeden Tag versorgt werden müssen.',
  items:[{q:'In der Firma aus Hannover …',o:['arbeiten die Mitarbeiter vier Tage und verdienen weniger.','arbeiten die Mitarbeiter vier Tage für das gleiche Geld.','arbeiten alle nur noch von zu Hause.'],a:1},
   {q:'Seit der Vier-Tage-Woche …',o:['sind die Mitarbeiter seltener krank.','gibt es mehr Besprechungen.','sucht die Firma keine Mitarbeiter mehr.'],a:0},
   {q:'Im Text steht, dass die Vier-Tage-Woche …',o:['für alle Branchen geeignet ist.','im Handwerk besonders einfach ist.','nicht in jedem Beruf leicht möglich ist.'],a:2},
   {text:'Repair-Café: Reparieren statt wegwerfen\nJeden ersten Samstag im Monat treffen sich im Gemeindehaus in Bochum Menschen mit kaputten Toastern, Lampen oder Hosen. Ehrenamtliche Helfer – darunter Elektriker, Schneiderinnen und Fahrradmechaniker – reparieren die Sachen gemeinsam mit den Besitzern. Bezahlen muss niemand, aber viele Besucher geben eine kleine Spende für Kaffee und Ersatzteile. „Es geht nicht nur ums Geld", sagt Organisatorin Ute Brand. „Die Leute lernen, wie ihre Geräte funktionieren, und produzieren weniger Müll." Etwa 70 Prozent der Gegenstände können repariert werden.',
    q:'Das Repair-Café findet … statt.',o:['jeden Samstag','einmal im Monat','jeden ersten Montag'],a:1},
   {q:'Die Reparatur …',o:['kostet eine feste Gebühr.','ist kostenlos.','bezahlt die Stadt.'],a:1},
   {q:'Laut Ute Brand ist ein Ziel auch, …',o:['neue Geräte zu verkaufen.','dass die Leute etwas lernen.','Geld für den Verein zu sammeln.'],a:1}]},
 {t:'Teil 3',i:'Sedam osoba traži kurs ili aktivnost. Koji oglas (a–j) odgovara kome? Ako nijedan ne odgovara, izaberi x.',d:'Lesen Sie die Situationen und die Anzeigen. Welche Anzeige passt? Für eine Situation gibt es keine Anzeige: x.',keep:true,
  list:[['a','Abendschule: Realschulabschluss in zwei Jahren nachholen. Unterricht Mo–Do 18–21 Uhr.'],['b','Erste-Hilfe-Kurs für den Führerschein, Samstag 9–17 Uhr, 45 €.'],['c','Online-Kurs Excel für Einsteiger – flexible Zeiten, mit Zertifikat.'],['d','Laufgruppe für Anfänger, jeden Sonntag 9 Uhr im Stadtpark, kostenlos.'],['e','Elterncafé: Austausch für Mütter und Väter, Kinderbetreuung vor Ort, mittwochs 10 Uhr.'],['f','Bewerbungstraining: Lebenslauf, Anschreiben, Vorstellungsgespräch – gratis.'],['g','Tanzkurs für Paare: Salsa für Anfänger, freitags 20 Uhr.'],['h','Gitarre für Erwachsene – Einzelunterricht bei Ihnen zu Hause.'],['i','Deutschkurs B2 für Pflegekräfte mit Fachwortschatz, vormittags.'],['j','Fotokurs: Mit dem Smartphone schöne Bilder machen, zwei Abende.']],
  opts:['a','b','c','d','e','f','g','h','i','j','x'],
  items:[{q:'Nermin macht den Führerschein und braucht noch einen Nachweis über Erste Hilfe.',a:1},{q:'Jelena ist Krankenschwester und möchte ihr Deutsch für den Beruf verbessern.',a:8},{q:'Thomas will nach Feierabend einen Schulabschluss machen.',a:0},{q:'Amra hat ein Baby und sucht Kontakt zu anderen Eltern.',a:4},{q:'Herr Lang muss für die Arbeit lernen, mit Tabellen am Computer zu arbeiten, hat aber keine festen Zeiten.',a:2},{q:'Mia möchte mit dem Joggen anfangen, hat aber wenig Geld.',a:3},{q:'Dragan sucht einen Kurs, in dem er lernt, alte Möbel zu reparieren.',a:10}]},
 {t:'Teil 4',i:'Tema: „Treba li zabraniti mobitele u školama?" Da li je osoba ZA zabranu (Ja) ili PROTIV (Nein)?',d:'Ist die Person für ein Handyverbot an Schulen? Wählen Sie Ja oder Nein.',rf:YN,
  items:[{q:'Laura: Meine Tochter schaut in jeder Pause aufs Handy und redet kaum noch mit Freunden. In der Schule sollten Handys in der Tasche bleiben.',a:true},
   {q:'Kemal: Ein Verbot bringt nichts. Die Schüler müssen lernen, vernünftig mit dem Handy umzugehen – und das geht nur, wenn sie es benutzen dürfen.',a:false},
   {q:'Birgit (Lehrerin): Seit unsere Schule Handys verboten hat, sind die Schüler im Unterricht viel konzentrierter.',a:true},
   {q:'Jonas (16): Ich nutze das Handy im Unterricht als Wörterbuch und für Recherchen. Ohne wäre das viel schwieriger.',a:false},
   {q:'Petra: Für Notfälle müssen Kinder erreichbar sein. Ein komplettes Verbot finde ich falsch.',a:false},
   {q:'Ahmed: Cybermobbing passiert oft während der Schulzeit. Ohne Handys gäbe es weniger Probleme.',a:true},
   {q:'Sanja: Schulen sollten digitale Medien sinnvoll einsetzen, statt sie zu verbieten. Wir leben nun mal im 21. Jahrhundert.',a:false}]},
 {t:'Teil 5',i:'Pročitaj kućni red fitness centra i izaberi a, b ili c.',d:'Lesen Sie die Hausordnung und die Aufgaben.',
  text:'Hausordnung Fitnessstudio FitLine\n1. Das Training ist nur mit gültiger Mitgliedskarte erlaubt. Bitte zeigen Sie die Karte am Eingang.\n2. Aus hygienischen Gründen muss auf allen Geräten ein Handtuch benutzt werden.\n3. Getränke sind nur in verschlossenen Plastikflaschen erlaubt, Glasflaschen sind verboten.\n4. Die Spinde müssen nach dem Training geleert werden. Spinde, die nach 23 Uhr noch verschlossen sind, werden geöffnet.\n5. Jugendliche unter 16 Jahren dürfen nur in Begleitung eines Erwachsenen trainieren.',
  items:[{q:'Am Eingang muss man …',o:['bezahlen.','die Mitgliedskarte zeigen.','ein Handtuch kaufen.'],a:1},{q:'Auf den Geräten …',o:['muss man ein Handtuch benutzen.','darf man nichts trinken.','darf man nur 30 Minuten trainieren.'],a:0},{q:'Glasflaschen …',o:['sind erlaubt.','muss man am Eingang abgeben.','darf man nicht mitbringen.'],a:2},{q:'Ein 15-Jähriger darf …',o:['allein trainieren.','mit einem Erwachsenen trainieren.','gar nicht trainieren.'],a:1}]}]},
hoeren:{min:40,desc:'4 dijela · 30 zadataka',intro:'Slušaš obavještenja, poruke, vođenje kroz muzej, razgovor i radio diskusiju.',parts:[
 {t:'Teil 1',i:'Slušaš pet kratkih tekstova, svaki dva puta. Za svaki tekst riješi dva zadatka.',d:'Sie hören fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben.',plays:2,
  items:[{au:'Und hier noch eine Meldung aus der Region: Wegen eines Unfalls ist die Autobahn A neun zwischen Ingolstadt und Nürnberg in Richtung Norden gesperrt. Es gibt bereits zehn Kilometer Stau. Die Polizei empfiehlt, über die Bundesstraße dreizehn zu fahren. Die Sperrung dauert voraussichtlich bis zum Nachmittag.',q:'Die Autobahn ist in beide Richtungen gesperrt.',o:RF,a:1},
   {q:'Was empfiehlt die Polizei?',o:['Zu Hause bleiben.','Eine andere Straße nehmen.','Mit dem Zug fahren.'],a:1},
   {au:'Hallo Herr Marić, hier ist Sandra Kühn von der Firma Elektro-Bauer. Wir haben Ihre Bewerbung bekommen und möchten Sie gern zu einem Gespräch einladen. Hätten Sie am Mittwoch, den zwölften, um zehn Uhr Zeit? Bitte bringen Sie Ihre Zeugnisse mit. Rufen Sie mich doch kurz zurück, damit ich den Termin eintragen kann.',q:'Herr Marić soll zu einem Vorstellungsgespräch kommen.',o:RF,a:0},
   {q:'Was soll Herr Marić mitbringen?',o:['Seinen Ausweis.','Seine Zeugnisse.','Einen Lebenslauf.'],a:1},
   {au:'Liebe Kundinnen und Kunden, nur heute: Alle Wintermäntel und Winterschuhe sind um vierzig Prozent reduziert. Außerdem erhalten Sie in unserer Kinderabteilung im zweiten Stock beim Kauf von zwei Artikeln den dritten gratis. Wir wünschen Ihnen einen schönen Einkauf.',q:'Heute sind Wintersachen billiger.',o:RF,a:0},
   {q:'Was bekommt man in der Kinderabteilung?',o:['Vierzig Prozent Rabatt.','Beim Kauf von zwei Artikeln den dritten gratis.','Ein kleines Geschenk.'],a:1},
   {au:'Sie wollen Geld sparen und gleichzeitig etwas für die Umwelt tun? Dann schalten Sie Ihre Geräte ganz aus, statt sie im Stand-by-Modus zu lassen. Ein durchschnittlicher Haushalt kann so bis zu hundert Euro im Jahr sparen. Am einfachsten geht das mit einer Steckerleiste mit Schalter.',q:'Geräte im Stand-by-Modus verbrauchen keinen Strom.',o:RF,a:1},
   {q:'Wie viel kann ein Haushalt sparen?',o:['Bis zu 10 Euro im Monat.','Bis zu 100 Euro im Jahr.','Bis zu 100 Euro im Monat.'],a:1},
   {au:'Hi Lejla, hier ist Mario. Wegen Samstag: Das Fußballspiel fällt aus, der Platz ist zu nass. Wir wollen stattdessen bowlen gehen, um sieben im Bowlingcenter am Bahnhof. Kommst du mit? Jens bringt seine neue Freundin mit. Sag mir bis Freitag Bescheid, dann reserviere ich eine Bahn.',q:'Das Fußballspiel findet am Samstag statt.',o:RF,a:1},
   {q:'Was soll Lejla tun?',o:['Eine Bahn reservieren.','Bis Freitag Bescheid sagen.','Jens anrufen.'],a:1}]},
 {t:'Teil 2',i:'Slušaš vodiča u muzeju. Tekst čuješ jednom. Izaberi a, b ili c.',d:'Sie hören einen Text. Sie hören den Text einmal.',plays:1,
  au:'Guten Tag und herzlich willkommen im Museum für Technik! Ich bin Frau Weiß und begleite Sie heute durch die Ausstellung. Die Führung dauert etwa neunzig Minuten. Wir beginnen im Erdgeschoss mit der Geschichte des Autos. Danach fahren wir mit dem Aufzug in den zweiten Stock, wo Sie die Ausstellung über Elektrizität sehen. Dort dürfen Sie viele Experimente selbst ausprobieren. Bitte fotografieren Sie dort aber ohne Blitz. Im ersten Stock befinden sich das Café und der Museumsshop. Ihre Jacken und Taschen können Sie kostenlos in den Schließfächern neben der Kasse lassen. Sie brauchen nur eine Ein-Euro-Münze, die Sie später zurückbekommen. Die Führung endet um zwölf Uhr im Café, wo jeder Teilnehmer ein Getränk gratis bekommt.',
  items:[{q:'Die Führung dauert …',o:['eine Stunde.','anderthalb Stunden.','zwei Stunden.'],a:1},{q:'Was gibt es im zweiten Stock?',o:['Die Geschichte des Autos.','Experimente zur Elektrizität.','Das Café.'],a:1},{q:'Beim Fotografieren …',o:['ist der Blitz verboten.','muss man bezahlen.','gibt es keine Regeln.'],a:0},{q:'Die Schließfächer …',o:['kosten einen Euro.','sind kostenlos.','sind im ersten Stock.'],a:1},{q:'Am Ende der Führung …',o:['bekommt man ein Getränk gratis.','muss man in den Shop gehen.','gibt es ein Mittagessen.'],a:0}]},
 {t:'Teil 3',i:'Slušaš razgovor dvoje prijatelja jednom. Tačno ili netačno?',d:'Sie hören ein Gespräch. Sie hören das Gespräch einmal.',plays:1,rf:RF,
  au:[['Anna','Hey Emir! Lange nicht gesehen. Wie geht es dir?'],['Emir','Gut, danke! Ich bin gerade umgezogen, deshalb hatte ich so wenig Zeit.'],['Anna','Ach, wohin denn?'],['Emir','In eine Wohnung in der Südstadt. Sie ist größer als meine alte und hat sogar einen Balkon. Nur die Miete ist ein bisschen höher.'],['Anna','Und wie bist du umgezogen? Mit einer Firma?'],['Emir','Nein, das war mir zu teuer. Meine Brüder haben mir geholfen, und wir haben einen Transporter gemietet.'],['Anna','Und die Nachbarn?'],['Emir','Bis jetzt sehr nett. Die Frau unter mir hat mir sogar einen Kuchen gebracht.'],['Anna','Wie schön! Machst du eine Einweihungsparty?'],['Emir','Ja, aber erst nächsten Monat. Ich muss noch die Küche einrichten.'],['Anna','Sag Bescheid, ich helfe gern!']],
  items:[{q:'Emir hatte wenig Zeit, weil er umgezogen ist.',a:true},{q:'Die neue Wohnung ist kleiner als die alte.',a:false},{q:'Die neue Wohnung ist teurer.',a:true},{q:'Eine Umzugsfirma hat Emir geholfen.',a:false},{q:'Emirs Brüder haben beim Umzug geholfen.',a:true},{q:'Eine Nachbarin hat Emir einen Kuchen gebracht.',a:true},{q:'Die Party ist nächste Woche.',a:false}]},
 {t:'Teil 4',i:'Slušaš radio diskusiju dva puta. Ko šta kaže? Izaberi osobu.',d:'Sie hören eine Diskussion. Sie hören die Diskussion zweimal. Wer sagt was?',plays:2,keep:true,
  au:[['Moderator','Willkommen zu unserer Sendung „Thema am Abend". Heute geht es um das Homeoffice. Bei mir sind Frau Lehmann, Personalchefin einer Versicherung, und Herr Šabić, Programmierer. Frau Lehmann, viele Firmen holen ihre Leute wieder ins Büro zurück. Warum?'],['Frau Lehmann','Ich verstehe die Firmen. Wenn alle zu Hause arbeiten, fehlt der spontane Austausch in der Kaffeeküche. Gerade neue Kollegen lernen im Büro viel schneller.'],['Herr Šabić','Das sehe ich anders. Ich arbeite seit drei Jahren zu Hause und bin viel produktiver. Im Büro werde ich ständig unterbrochen.'],['Moderator','Aber fühlen Sie sich nicht manchmal allein, Herr Šabić?'],['Herr Šabić','Manchmal schon. Deshalb gehe ich einmal pro Woche ins Büro. Das finde ich ideal.'],['Frau Lehmann','Genau so ein Modell bieten wir inzwischen an: zwei Tage zu Hause, drei Tage im Büro. Das ist ein guter Kompromiss.'],['Moderator','Und was ist mit den Kosten? Die Mitarbeiter bezahlen zu Hause ja Strom und Heizung selbst.'],['Herr Šabić','Richtig, und das wird oft vergessen. Dafür spare ich aber jeden Tag eine Stunde Fahrzeit.'],['Frau Lehmann','Wir zahlen unseren Mitarbeitern deshalb einen Zuschuss für das Homeoffice.'],['Moderator','Zum Schluss: Wie sieht die Arbeit in zehn Jahren aus?'],['Frau Lehmann','Das Büro wird nicht verschwinden, aber es wird mehr ein Ort für Teamarbeit sein.'],['Herr Šabić','Ich glaube, dass man in Zukunft selbst entscheiden kann, wo man arbeitet.']],
  opts:['Moderator','Frau Lehmann','Herr Šabić'],
  items:[{q:'Neue Mitarbeiter lernen im Büro schneller.',a:1},{q:'Im Büro kann man sich schlechter konzentrieren.',a:2},{q:'Zu Hause zahlen die Mitarbeiter die Energiekosten selbst.',a:0},{q:'Einmal pro Woche ins Büro zu gehen, ist ideal.',a:2},{q:'Eine Mischung aus Büro und Homeoffice ist ein guter Kompromiss.',a:1},{q:'Durch das Homeoffice spart man Zeit.',a:2},{q:'Die Firma gibt Geld für die Arbeit zu Hause.',a:1},{q:'In Zukunft wählen die Menschen ihren Arbeitsort selbst.',a:2}]}]},
schreiben:{min:60,desc:'3 zadatka · 80 + 80 + 40 riječi',intro:'Pišeš neformalni e-mail, mišljenje za forum i kratku formalnu poruku. Za svaki zadatak je preporučeno vrijeme: 20 / 25 / 15 minuta.',tasks:[
 {type:'text',t:'Aufgabe 1 · E-Mail an einen Freund (ca. 80 Wörter)',i:'Napiši e-mail prijatelju. Obradi sve tri tačke, s uvodom i završetkom.',words:80,
  d:'Sie waren letztes Wochenende auf der Hochzeit eines Freundes. Ihr Freund Daniel konnte nicht kommen. Schreiben Sie Daniel eine E-Mail.',
  pts:['Beschreiben Sie: Wie war die Feier?','Begründen Sie: Was hat Ihnen besonders gut gefallen?','Machen Sie einen Vorschlag für ein Treffen.'],
  model:'Lieber Daniel,\nschade, dass du am Samstag nicht bei Marcos Hochzeit warst! Die Feier war wirklich toll. Zuerst waren wir in der Kirche, danach haben wir in einem Restaurant am See gefeiert. Es gab über hundert Gäste und eine Live-Band. Besonders gut hat mir das Essen gefallen, weil es Spezialitäten aus Marcos Heimat gab. Außerdem haben wir bis drei Uhr nachts getanzt. Ich habe viele Fotos gemacht. Hast du nächsten Freitag Zeit? Dann können wir zusammen essen gehen und ich zeige dir die Bilder.\nViele Grüße\nAmir'},
 {type:'text',noLetter:true,t:'Aufgabe 2 · Meinung im Forum (ca. 80 Wörter)',i:'Napiši svoje mišljenje u gostinjsku knjigu emisije. Osvrni se i na Katjino mišljenje.',words:80,
  d:'Sie haben im Fernsehen eine Diskussion zum Thema „Sollen Kinder schon im Kindergarten eine Fremdsprache lernen?" gesehen. Im Online-Gästebuch der Sendung schreibt Katja: „Kinder sollen spielen. Fremdsprachen lernen sie früh genug in der Schule." Schreiben Sie nun Ihre Meinung.',
  pts:['Eigene Meinung klar nennen','Meinung begründen','Beispiel oder eigene Erfahrung','Auf Katjas Meinung reagieren'],
  model:'Ich bin anderer Meinung als Katja. Meiner Meinung nach ist der Kindergarten der beste Ort, um eine Fremdsprache zu lernen. Kleine Kinder lernen Sprachen spielerisch und ohne Angst vor Fehlern. Ich sehe das bei meinem Neffen: Er ist fünf Jahre alt und singt schon englische Lieder. Natürlich hat Katja recht, dass Kinder viel spielen sollen. Aber das ist kein Widerspruch, denn man kann eine Sprache auch beim Spielen lernen. Deshalb finde ich Fremdsprachen im Kindergarten sinnvoll.'},
 {type:'text',formal:true,t:'Aufgabe 3 · Formelle Nachricht (ca. 40 Wörter)',i:'Napiši kratku formalnu poruku šefici. Izvini se ljubazno i objasni zašto ne možeš doći.',words:40,
  d:'Sie haben morgen einen Termin bei Ihrer Chefin, Frau Bergmann, können aber nicht kommen. Schreiben Sie Frau Bergmann eine E-Mail.',
  pts:['Höflich entschuldigen','Grund nennen','Neuen Termin vorschlagen oder um Rückmeldung bitten'],
  model:'Sehr geehrte Frau Bergmann,\nleider kann ich morgen nicht zu unserem Termin um 10 Uhr kommen, weil mein Sohn krank ist und ich bei ihm bleiben muss. Es tut mir sehr leid. Wäre es möglich, den Termin auf Donnerstag zu verschieben?\nMit freundlichen Grüßen\nAmir Hodžić'}]},
sprechen:{min:15,desc:'3 dijela · u paru',intro:'Na ispitu govoriš s partnerom: zajedno nešto planirate, držiš prezentaciju i reaguješ na prezentaciju partnera.',tasks:[
 {t:'Teil 1 · Gemeinsam etwas planen (ca. 3 Min.)',i:'Kolega ima rođendan i želite mu zajedno organizovati iznenađenje. Pričajte o ovim tačkama, dajte prijedloge i reagujte na prijedloge partnera.',cards:['Wann feiern?','Wo feiern?','Welches Geschenk?','Wer wird eingeladen?','Essen und Getränke?'],
  model:'Was hältst du davon, wenn wir am Freitag nach der Arbeit feiern? – Gute Idee, da haben alle Zeit.\nWo sollen wir feiern? Ich schlage vor, wir machen es im Pausenraum. – Ja, das ist praktisch.\nWas könnten wir ihm schenken? Er fährt gern Fahrrad. – Wie wäre es mit einem Gutschein für ein Fahrradgeschäft?\nWen laden wir ein? – Ich denke, das ganze Team.\nUnd was ist mit Essen? – Ich kann einen Kuchen backen, und du kümmerst dich um die Getränke, okay?',
  phrases:['Wie wäre es, wenn …?','Ich schlage vor, dass …','Was hältst du davon?','Das ist eine gute Idee, aber …','Einverstanden! / Dann machen wir es so.']},
 {t:'Teil 2 · Ein Thema präsentieren (ca. 3 Min.)',i:'Održi kratku prezentaciju na temu „Arbeiten im Homeoffice". Prati ovih pet folija.',cards:['1. Thema vorstellen','2. Persönliche Erfahrung','3. Situation im Heimatland','4. Vor- und Nachteile + Meinung','5. Abschluss und Dank'],
  model:'Ich möchte heute über das Thema „Arbeiten im Homeoffice" sprechen. Zuerst erzähle ich von meiner Erfahrung, dann von der Situation in meinem Heimatland, und am Ende nenne ich Vor- und Nachteile.\nIch arbeite als Elektriker, deshalb kann ich nicht von zu Hause arbeiten. Meine Schwester arbeitet aber zwei Tage pro Woche im Homeoffice.\nIn Bosnien ist Homeoffice noch nicht so verbreitet wie in Deutschland, vor allem in kleinen Firmen.\nEin Vorteil ist, dass man keine Fahrzeit hat. Ein Nachteil ist, dass man weniger Kontakt zu Kollegen hat. Ich finde eine Mischung aus Büro und Homeoffice am besten.\nDamit bin ich am Ende. Vielen Dank für Ihre Aufmerksamkeit! Haben Sie Fragen?',
  phrases:['Ich möchte über … sprechen.','Zuerst … dann … zum Schluss …','In meinem Heimatland …','Ein Vorteil / Nachteil ist, dass …','Vielen Dank fürs Zuhören.']},
 {t:'Teil 3 · Über ein Thema sprechen (ca. 2 Min.)',i:'Partner je održao prezentaciju „Sport im Alltag". Daj povratnu informaciju (šta ti se svidjelo) i postavi jedno pitanje. Zatim odgovori na pitanje o svojoj prezentaciji.',cards:['Rückmeldung geben','Eine Frage stellen','Auf eine Frage antworten'],
  model:'Vielen Dank für deine Präsentation. Besonders interessant fand ich, dass du jeden Tag mit dem Fahrrad zur Arbeit fährst. Ich habe eine Frage: Was machst du, wenn es im Winter regnet oder schneit?\n– Frage an mich: „Würdest du gern im Homeoffice arbeiten?" – Antwort: Ehrlich gesagt nicht jeden Tag. Ich brauche den Kontakt zu Kollegen, aber ein oder zwei Tage pro Woche fände ich gut.',
  phrases:['Vielen Dank für die Präsentation.','Besonders interessant fand ich …','Ich habe eine Frage zu …','Das ist eine gute Frage.']}]}},

B2:{name:'Probni ispit B2',info:'Lesen 65 · Hören 40 · Schreiben 75 · Sprechen 15 min',
lesen:{min:65,desc:'5 dijelova · 30 zadataka',intro:'Čitaš mišljenja, novinske članke, komentare i propise. Tekstovi su duži, a odgovori su često skriveni u drugačijim riječima.',parts:[
 {t:'Teil 1',i:'Četiri osobe pišu o volontiranju. Na koju osobu (A–D) se odnosi rečenica?',d:'Lesen Sie die Texte. Auf welche Person trifft die Aussage zu?',keep:true,
  list:[['A · Sabine','Seit ich in Rente bin, lese ich zweimal pro Woche Kindern in der Stadtbibliothek vor. Viele von ihnen haben zu Hause keine Bücher. Für mich ist das keine Pflicht, sondern ein Geschenk: Die Kinder halten mich jung. Allerdings ärgert es mich, dass die Stadt gleichzeitig Stellen in der Bibliothek streicht – Ehrenamt darf bezahlte Arbeit nicht ersetzen.'],['B · Mehmed','Ich arbeite Vollzeit und habe zwei Kinder. Für ein regelmäßiges Ehrenamt fehlt mir einfach die Zeit, auch wenn ich deshalb ein schlechtes Gewissen habe. Ab und zu helfe ich bei Aktionen meines Sportvereins, etwa beim Sommerfest. Ich finde, Arbeitgeber sollten ihren Mitarbeitern ein paar freie Tage für soziales Engagement geben.'],['C · Julia','Während meines Studiums habe ich ein Jahr lang Geflüchteten bei Behördengängen geholfen. Das hat mich mehr geprägt als jedes Seminar. Ich habe gelernt, geduldig zu sein und Probleme pragmatisch zu lösen. Heute leite ich ein Team und frage in Bewerbungsgesprächen gezielt nach solchen Erfahrungen.'],['D · Robert','Ehrlich gesagt sehe ich das Ganze kritisch. Viele Vereine verlassen sich auf Freiwillige, und wenn diese ausfallen, bricht alles zusammen. Ich spende lieber regelmäßig Geld an Organisationen, die professionell arbeiten. Das ist für mich die wirksamere Form der Hilfe.']],
  opts:['A','B','C','D'],
  items:[{q:'Freiwillige Arbeit darf kein Ersatz für reguläre Stellen sein.',a:0},{q:'Unternehmen sollten soziales Engagement unterstützen.',a:1},{q:'Die Erfahrung war lehrreicher als das Studium.',a:2},{q:'Geld zu geben, hilft mehr als eigene Mitarbeit.',a:3},{q:'Familie und Beruf lassen kaum Zeit für ein Ehrenamt.',a:1},{q:'Die Person profitiert persönlich vom Kontakt mit jungen Menschen.',a:0},{q:'Die Person achtet bei Bewerbern auf ehrenamtliche Erfahrung.',a:2},{q:'Organisationen, die nur mit Freiwilligen arbeiten, sind instabil.',a:3},{q:'Die Person engagiert sich nur gelegentlich.',a:1}]},
 {t:'Teil 2',i:'U tekstu nedostaje šest rečenica. Koja rečenica (a–h) ide na koje mjesto? Dvije rečenice su višak.',d:'Welcher Satz passt in die Lücke? Zwei Sätze passen nicht.',keep:true,
  text:'Schlafen wir zu wenig?\nViele Menschen klagen über Müdigkeit am Tag. (1) … Laut einer aktuellen Studie schläft jeder dritte Erwachsene in Deutschland weniger als sechs Stunden pro Nacht. (2) … Experten empfehlen sieben bis neun Stunden. Ein Grund für das Problem ist das Smartphone. (3) … Das blaue Licht der Bildschirme hemmt nämlich die Produktion des Schlafhormons Melatonin. Doch nicht nur die Technik ist schuld. (4) … Wer abends noch E-Mails vom Chef beantwortet, kann schlecht abschalten. Was hilft also? (5) … Außerdem sollte das Schlafzimmer kühl und dunkel sein. (6) … Und wer trotzdem nicht einschlafen kann, sollte lieber aufstehen und etwas lesen, statt sich stundenlang im Bett zu wälzen.',
  list:[['a','Das ist deutlich zu wenig.'],['b','Viele schauen noch im Bett auf ihr Handy.'],['c','Auch Stress im Beruf spielt eine große Rolle.'],['d','Schlafforscher raten zu festen Schlafenszeiten, auch am Wochenende.'],['e','Ideal sind etwa 18 Grad.'],['f','Doch woran liegt das eigentlich?'],['g','Kaffee am Abend ist dagegen kein Problem.'],['h','Die meisten Menschen schlafen am Wochenende länger.']],
  opts:['a','b','c','d','e','f','g','h'],
  items:[{q:'Lücke (1)',a:5},{q:'Lücke (2)',a:0},{q:'Lücke (3)',a:1},{q:'Lücke (4)',a:2},{q:'Lücke (5)',a:3},{q:'Lücke (6)',a:4}]},
 {t:'Teil 3',i:'Pročitaj članak i izaberi a, b ili c.',d:'Lesen Sie den Text und die Aufgaben.',
  text:'Lastenräder erobern die Städte\nSie sind breit, schwer und auf den ersten Blick wenig elegant – und trotzdem sieht man sie in deutschen Großstädten immer häufiger: Lastenräder. Eltern transportieren damit ihre Kinder in den Kindergarten, Handwerker ihr Werkzeug, Paketdienste ihre Sendungen. Im vergangenen Jahr wurden in Deutschland über 200.000 Lastenräder verkauft, die meisten davon mit Elektromotor.\nDer Grund liegt auf der Hand: In der Innenstadt ist man mit dem Rad oft schneller als mit dem Auto, und die Parkplatzsuche entfällt. Viele Städte fördern den Kauf mit Zuschüssen von bis zu 1.000 Euro, denn jedes Lastenrad kann im Idealfall ein Auto ersetzen.\nKritiker bemängeln allerdings, dass die Räder mit Preisen zwischen 3.000 und 8.000 Euro für viele Familien unbezahlbar seien. Zudem fehle es an geeigneten Abstellplätzen: In engen Treppenhäusern oder Hinterhöfen ist kaum Platz für die sperrigen Fahrzeuge. Einige Städte reagieren darauf mit öffentlichen Leihsystemen. In Berlin etwa können Bürger kostenlos Lastenräder für bis zu drei Tage ausleihen – ein Angebot, das vor allem am Wochenende stark genutzt wird.',
  items:[{q:'Lastenräder werden genutzt …',o:['nur von Familien.','von verschiedenen Gruppen.','vor allem von Touristen.'],a:1},{q:'Die meisten verkauften Lastenräder …',o:['haben einen Elektromotor.','kosten unter 3.000 Euro.','werden von Firmen gekauft.'],a:0},{q:'Ein Vorteil in der Innenstadt ist, dass …',o:['man keinen Parkplatz suchen muss.','Lastenräder steuerfrei sind.','man überall fahren darf.'],a:0},{q:'Städte fördern den Kauf, weil …',o:['sie daran verdienen.','Lastenräder Autos ersetzen können.','die Fahrradindustrie es verlangt.'],a:1},{q:'Kritiker sagen, dass …',o:['Lastenräder zu langsam sind.','sich viele kein Lastenrad leisten können.','Lastenräder gefährlich sind.'],a:1},{q:'In Berlin …',o:['kann man Lastenräder kostenlos leihen.','sind Lastenräder am Wochenende verboten.','bekommt man 1.000 Euro beim Leihen.'],a:0}]},
 {t:'Teil 4',i:'Šest komentara o kancelarijama otvorenog tipa (Großraumbüro). Koja rečenica (a–h) najbolje sažima komentar? Dvije su višak.',d:'Welche Aussage passt zu welchem Kommentar? Zwei Aussagen passen nicht.',keep:true,
  list:[['a','Die Lautstärke verhindert konzentriertes Arbeiten.'],['b','Kommunikation im Team wird einfacher.'],['c','Rückzugsräume sind die Lösung.'],['d','Der Firma geht es vor allem ums Sparen.'],['e','Krankheiten verbreiten sich schneller.'],['f','Es kommt auf die Art der Arbeit an.'],['g','Großraumbüros schonen die Umwelt.'],['h','Junge Leute wollen nur noch im Homeoffice arbeiten.']],
  opts:['a','b','c','d','e','f','g','h'],
  items:[{q:'Seit wir im Großraumbüro sitzen, telefonieren ständig fünf Leute gleichzeitig. Ich trage inzwischen den ganzen Tag Kopfhörer, sonst schaffe ich gar nichts.',a:0},{q:'Früher musste ich für jede Frage durch drei Flure laufen. Jetzt frage ich einfach den Kollegen nebenan, und das Problem ist in zwei Minuten gelöst.',a:1},{q:'Bei uns gibt es neben dem offenen Bereich kleine Räume, in die man sich für Telefonate oder konzentrierte Aufgaben zurückziehen kann. Seitdem sind alle zufrieden.',a:2},{q:'Machen wir uns nichts vor: Großraumbüros werden gebaut, weil man auf weniger Fläche mehr Mitarbeiter unterbringen kann. Mit Teamgeist hat das wenig zu tun.',a:3},{q:'Im letzten Winter hatte nach zwei Wochen die halbe Abteilung Grippe. In Einzelbüros wäre das kaum passiert.',a:4},{q:'Für Kreative und Projektteams ist der offene Raum ideal, für Buchhalter, die stundenlang Zahlen prüfen, eher nicht.',a:5}]},
 {t:'Teil 5',i:'Pročitaj pravilnik o radu od kuće i izaberi a, b ili c.',d:'Lesen Sie die Vereinbarung und die Aufgaben.',
  text:'Betriebsvereinbarung zur mobilen Arbeit\n§ 1 Beschäftigte können bis zu zwei Tage pro Woche mobil arbeiten, sofern ihre Tätigkeit dies zulässt. Der Antrag ist bei der direkten Vorgesetzten zu stellen.\n§ 2 Während der Kernarbeitszeit von 10 bis 15 Uhr müssen mobil Arbeitende telefonisch und per E-Mail erreichbar sein.\n§ 3 Für den Datenschutz ist der Beschäftigte selbst verantwortlich. Vertrauliche Unterlagen dürfen zu Hause nicht ausgedruckt werden.\n§ 4 Die Firma stellt einen Laptop zur Verfügung. Private Geräte dürfen für dienstliche Zwecke nicht genutzt werden.',

hoeren:{min:40,desc:'4 dijela · 30 zadataka',intro:'Slušaš obavještenja, intervju, diskusiju i predavanje. Na B2 nivou većinu tekstova čuješ samo jednom.',parts:[
 {t:'Teil 1',i:'Pet kratkih tekstova, svaki čuješ jednom. Za svaki tekst riješi dva zadatka.',d:'Sie hören fünf kurze Texte. Sie hören jeden Text einmal.',plays:1,
  items:[{au:'Achtung, eine Durchsage für alle Fahrgäste des ICE fünfhundertachtundsiebzig nach Hamburg: Aufgrund einer Signalstörung verzögert sich die Abfahrt um voraussichtlich fünfundzwanzig Minuten. Fahrgäste mit Anschluss in Hannover werden gebeten, sich an das Zugpersonal zu wenden. Wir bitten um Ihr Verständnis.',q:'Der Zug fällt aus.',o:RF,a:1},
   {q:'Was sollen Fahrgäste mit Anschluss tun?',o:['Einen anderen Zug nehmen.','Das Zugpersonal ansprechen.','In Hannover aussteigen.'],a:1},
   {au:'Sie planen eine Renovierung? Dann sollten Sie jetzt handeln: Ab Januar steigen die Preise für viele Baumaterialien um bis zu zwölf Prozent. Fachleute raten außerdem, Handwerker frühzeitig zu buchen, denn die Wartezeiten liegen derzeit bei mehreren Monaten.',q:'Baumaterialien werden ab Januar teurer.',o:RF,a:0},
   {q:'Was raten Fachleute?',o:['Mit der Renovierung zu warten.','Handwerker früh zu buchen.','Selbst zu renovieren.'],a:1},
   {au:'Guten Tag, Herr Begić, hier spricht Claudia Hoffmann von der Personalabteilung. Ihr Antrag auf Weiterbildung wurde genehmigt. Die Firma übernimmt achtzig Prozent der Kursgebühren, den Rest müssten Sie selbst tragen. Den Vertrag dazu schicke ich Ihnen per Post. Bitte senden Sie ihn unterschrieben bis Ende des Monats zurück.',q:'Die Firma bezahlt die Weiterbildung komplett.',o:RF,a:1},
   {q:'Was soll Herr Begić tun?',o:['Die Kursgebühr überweisen.','Den Vertrag unterschrieben zurückschicken.','Frau Hoffmann zurückrufen.'],a:1},
   {au:'Eine neue Studie der Universität Mannheim zeigt: Wer regelmäßig ehrenamtlich tätig ist, fühlt sich im Durchschnitt glücklicher und gesünder. Besonders stark ist der Effekt bei Menschen über sechzig. Die Forscher betonen jedoch, dass das Ehrenamt freiwillig sein muss. Wer sich verpflichtet fühlt, profitiert kaum.',q:'Laut der Studie profitieren ältere Menschen besonders.',o:RF,a:0},
   {q:'Die Forscher betonen, dass …',o:['jeder ein Ehrenamt haben sollte.','das Engagement freiwillig sein muss.','Ehrenamt bezahlt werden sollte.'],a:1},
   {au:'Und hier noch ein Hinweis für alle, die am Samstag zum Stadtmarathon wollen: Die Innenstadt ist von sieben bis fünfzehn Uhr für Autos gesperrt. Die Straßenbahnen fahren in dieser Zeit alle fünf Minuten. Wer mit dem Auto anreist, sollte die Park-and-Ride-Plätze am Stadtrand nutzen.',q:'Am Samstagvormittag kann man nicht mit dem Auto in die Innenstadt fahren.',o:RF,a:0},
   {q:'Was wird Autofahrern empfohlen?',o:['Früh zu kommen.','Am Stadtrand zu parken.','Ein Taxi zu nehmen.'],a:1}]},
 {t:'Teil 2',i:'Slušaš intervju jednom. Izaberi a, b ili c.',d:'Sie hören ein Interview. Sie hören den Text einmal.',plays:1,
  au:[['Moderatorin','Frau Doktor Arslan, Sie forschen zum Thema Mehrsprachigkeit. Schadet es Kindern, wenn sie mit zwei Sprachen aufwachsen?'],['Dr. Arslan','Nein, im Gegenteil. Früher glaubte man, Kinder würden durch zwei Sprachen verwirrt. Heute wissen wir: Mehrsprachige Kinder können sich oft besser konzentrieren und leichter zwischen Aufgaben wechseln.'],['Moderatorin','Aber lernen sie nicht langsamer sprechen?'],['Dr. Arslan','Am Anfang kann der Wortschatz in jeder einzelnen Sprache etwas kleiner sein. Zusammengenommen kennen die Kinder aber genauso viele Wörter wie einsprachige. Das gleicht sich meist bis zur Grundschule aus.'],['Moderatorin','Was raten Sie Eltern, die selbst nicht gut Deutsch sprechen?'],['Dr. Arslan','Sprechen Sie mit Ihrem Kind die Sprache, in der Sie sich am wohlsten fühlen, meistens die Muttersprache. Deutsch lernt das Kind dann im Kindergarten. Wichtig ist, dass es früh mit Gleichaltrigen spielt.'],['Moderatorin','Und wenn ein Kind die Sprachen mischt?'],['Dr. Arslan','Das ist völlig normal und kein Zeichen für ein Problem. Das Gehirn nutzt einfach alle Wörter, die es kennt.'],['Moderatorin','Gibt es auch Nachteile?'],['Dr. Arslan','Der größte Nachteil ist eigentlich gesellschaftlich: Manche Sprachen haben ein höheres Ansehen als andere. Wenn ein Kind merkt, dass seine Familiensprache weniger wert ist, will es sie oft nicht mehr sprechen.']],
  items:[{q:'Früher glaubte man, dass zwei Sprachen …',o:['Kinder verwirren.','Kinder intelligenter machen.','keinen Einfluss haben.'],a:0},{q:'Mehrsprachige Kinder …',o:['sprechen später.','können oft gut zwischen Aufgaben wechseln.','haben in jeder Sprache einen größeren Wortschatz.'],a:1},{q:'Der Wortschatz …',o:['bleibt immer kleiner.','ist insgesamt ähnlich groß.','ist nur in der Muttersprache groß.'],a:1},{q:'Eltern sollten mit ihrem Kind …',o:['nur Deutsch sprechen.','die Sprache sprechen, in der sie sich wohlfühlen.','beide Sprachen gleichzeitig sprechen.'],a:1},{q:'Wenn Kinder Sprachen mischen, …',o:['ist das normal.','sollte man einen Arzt fragen.','muss man sie sofort korrigieren.'],a:0},{q:'Den größten Nachteil sieht Frau Arslan …',o:['in der Schule.','im unterschiedlichen Ansehen von Sprachen.','beim Lernen der Grammatik.'],a:1}]},
 {t:'Teil 3',i:'Slušaš diskusiju jednom. Ko šta kaže?',d:'Sie hören eine Diskussion. Sie hören den Text einmal. Wer sagt was?',plays:1,keep:true,
  au:[['Moderatorin','Willkommen zu „Streitpunkt". Immer mehr Städte sperren ihre Zentren für Autos. Herr Fischer, Sie haben ein Schuhgeschäft in der Altstadt. Was halten Sie davon?'],['Herr Fischer','Ich mache mir Sorgen. Viele meiner Kunden kommen aus den Dörfern rundherum, und die kommen nun mal mit dem Auto. Wenn sie nicht mehr in die Stadt fahren können, kaufen sie online.'],['Frau Kim','Diese Angst höre ich oft. Aber Untersuchungen aus anderen Städten zeigen, dass Fußgänger und Radfahrer häufiger kommen und am Ende sogar mehr Geld ausgeben.'],['Moderatorin','Aber nicht jeder kann Rad fahren. Was ist mit älteren Menschen?'],['Frau Kim','Da haben Sie recht. Deshalb gehören zu einer autofreien Innenstadt auch gute Busverbindungen und Parkhäuser am Rand.'],['Herr Fischer','Das klingt schön in der Theorie. Aber bei uns fährt der Bus abends nur einmal pro Stunde.'],['Moderatorin','Herr Fischer, gibt es denn gar nichts Positives?'],['Herr Fischer','Doch, ehrlich gesagt: Seit die Straße vor meinem Laden verkehrsberuhigt ist, sitzen die Leute wieder draußen in den Cafés. Die Atmosphäre ist schöner geworden.'],['Frau Kim','Und genau das ist der Punkt: Eine Innenstadt muss ein Ort sein, an dem man sich gern aufhält.']],
  opts:['Moderatorin','Herr Fischer','Frau Kim'],
  items:[{q:'Kunden vom Land kommen meist mit dem Auto.',a:1},{q:'Fußgänger geben insgesamt mehr Geld aus.',a:2},{q:'Nicht alle Menschen können mit dem Fahrrad fahren.',a:0},{q:'Der öffentliche Nahverkehr ist noch nicht gut genug.',a:1},{q:'Busse und Parkhäuser am Stadtrand sind notwendig.',a:2},{q:'Die Atmosphäre in der Straße hat sich verbessert.',a:1}]},
 {t:'Teil 4',i:'Slušaš predavanje jednom. Izaberi a, b ili c.',d:'Sie hören einen Vortrag. Sie hören den Text einmal.',plays:1,
  au:'Guten Tag, meine Damen und Herren. In meinem Vortrag geht es um Gewohnheiten, also um Dinge, die wir tun, ohne darüber nachzudenken. Etwa vierzig Prozent unserer täglichen Handlungen sind Gewohnheiten. Das ist eigentlich praktisch, denn so spart unser Gehirn Energie. Jede Gewohnheit besteht aus drei Teilen: einem Auslöser, einer Handlung und einer Belohnung. Ein Beispiel: Sie kommen müde nach Hause, das ist der Auslöser. Sie setzen sich vor den Fernseher, das ist die Handlung. Und Sie entspannen sich, das ist die Belohnung. Wer eine schlechte Gewohnheit ändern möchte, sollte nicht versuchen, sie einfach zu unterdrücken. Das funktioniert selten. Besser ist es, die Handlung durch eine andere zu ersetzen, die eine ähnliche Belohnung bringt, zum Beispiel ein kurzer Spaziergang statt Fernsehen. Und wie lange dauert es, bis eine neue Gewohnheit entsteht? Oft liest man von einundzwanzig Tagen. Studien zeigen jedoch, dass es im Durchschnitt etwa zwei Monate dauert, je nach Person zwischen drei Wochen und acht Monaten. Wichtig ist: Wer einmal einen Tag auslässt, muss nicht von vorn beginnen. Entscheidend ist die Regelmäßigkeit über einen längeren Zeitraum. Zum Schluss noch ein Tipp: Verbinden Sie neue Gewohnheiten mit bestehenden. Wenn Sie zum Beispiel mehr Wasser trinken möchten, trinken Sie jedes Mal ein Glas, nachdem Sie Kaffee gekocht haben.',
  items:[{q:'Wie viele unserer Handlungen sind Gewohnheiten?',o:['etwa 14 Prozent','etwa 40 Prozent','etwa 60 Prozent'],a:1},{q:'Gewohnheiten sind praktisch, weil …',o:['das Gehirn Energie spart.','man mehr Freizeit hat.','sie immer gesund sind.'],a:0},{q:'Eine Gewohnheit besteht aus …',o:['zwei Teilen.','drei Teilen.','vier Teilen.'],a:1},{q:'Im Beispiel ist die Müdigkeit …',o:['die Belohnung.','der Auslöser.','die Handlung.'],a:1},{q:'Um eine schlechte Gewohnheit zu ändern, sollte man …',o:['sie unterdrücken.','sie durch eine andere Handlung ersetzen.','sich selbst bestrafen.'],a:1},{q:'Eine neue Gewohnheit entsteht im Durchschnitt in …',o:['21 Tagen.','etwa zwei Monaten.','acht Monaten.'],a:1},{q:'Wenn man einen Tag auslässt, …',o:['muss man neu anfangen.','ist das kein großes Problem.','dauert es doppelt so lange.'],a:1},{q:'Der letzte Tipp lautet:',o:['Neue Gewohnheiten mit bestehenden verbinden.','Mehr Kaffee trinken.','Jeden Tag etwas Neues ausprobieren.'],a:0}]}]},

 {type:'text',noLetter:true,t:'Aufgabe 1 · Forumsbeitrag (ca. 150 Wörter)',i:'Napiši prilog za online forum. Izaberi TRI od četiri tačke. Uvod i zaključak ne zaboravi.',words:150,
  d:'Thema: „Sollte die Arbeitswoche auf vier Tage verkürzt werden?" Schreiben Sie einen Forumsbeitrag. Wählen Sie dafür drei der folgenden Punkte aus.',
  pts:['Gründe, warum viele eine kürzere Arbeitswoche wünschen','Vor- und Nachteile für Arbeitgeber','Andere Möglichkeiten, Arbeit und Freizeit zu vereinbaren','Situation in Ihrem Heimatland','Einleitung und Schluss mit eigener Meinung'],
  model:'In letzter Zeit wird viel über die Vier-Tage-Woche diskutiert. Ich möchte dazu meine Meinung sagen.\nViele Menschen wünschen sich mehr Zeit für Familie, Hobbys und Erholung. Gerade Eltern fühlen sich oft gestresst, weil Arbeit und Kinderbetreuung kaum zu vereinbaren sind.\nFür Arbeitgeber hat das Modell Vor- und Nachteile. Einerseits sind ausgeruhte Mitarbeiter motivierter und seltener krank. Andererseits ist die Planung schwieriger, vor allem im Handwerk oder in der Pflege, wo jeden Tag jemand da sein muss.\nEs gibt aber auch andere Lösungen, zum Beispiel flexible Arbeitszeiten oder ein bis zwei Tage Homeoffice pro Woche. So kann jeder selbst entscheiden, was am besten zu seinem Leben passt.\nInsgesamt halte ich die Vier-Tage-Woche für eine gute Idee, aber sie sollte freiwillig sein. Nicht jede Branche kann sie einführen, und nicht jeder Mitarbeiter wünscht sie sich.'},
 {type:'text',formal:true,t:'Aufgabe 2 · Formelle Nachricht (ca. 100 Wörter)',i:'Napiši formalni e-mail šefici odjela. Obradi sve četiri tačke, poštuj formalni stil.',words:100,
  d:'Ihre Abteilungsleiterin, Frau Dr. Wagner, hat Sie gebeten, nächste Woche zwei neue Kollegen einzuarbeiten. Sie haben aber bereits einen wichtigen Kundentermin. Schreiben Sie Frau Dr. Wagner eine E-Mail.',
  pts:['Für das Vertrauen bedanken','Das Problem erklären','Einen Vorschlag machen','Um Rückmeldung bitten'],
  model:'Sehr geehrte Frau Dr. Wagner,\nvielen Dank für Ihr Vertrauen, dass ich die neuen Kollegen einarbeiten soll. Diese Aufgabe übernehme ich sehr gern.\nLeider habe ich am Dienstag und Mittwoch nächster Woche einen wichtigen Termin bei unserem Kunden in Augsburg, der schon seit Langem feststeht. An diesen Tagen bin ich nicht im Büro.\nIch schlage deshalb vor, dass Herr Krause die Einarbeitung am Montag und Dienstag übernimmt und ich ab Donnerstag weitermache. Alternativ könnte ich die neuen Kollegen bereits am Montag in die wichtigsten Abläufe einführen.\nIch wäre Ihnen dankbar, wenn Sie mir kurz mitteilen könnten, welche Lösung Ihnen lieber ist.\nMit freundlichen Grüßen\nAmir Hodžić'}]},

 {t:'Teil 1 · Vortrag halten (ca. 4 Min.)',i:'Održi kratak govor na temu „Online einkaufen oder im Geschäft?" Prati strukturu na karticama.',cards:['Einleitung: Thema nennen','Eigene Erfahrung','Situation im Heimatland','Vor- und Nachteile','Eigene Meinung & Schluss'],
  model:'Ich spreche heute über die Frage, ob man lieber online oder im Geschäft einkaufen sollte.\nIch selbst kaufe Elektronik meistens online, weil ich dort Preise leicht vergleichen kann. Kleidung kaufe ich dagegen lieber im Laden, weil ich sie anprobieren möchte.\nIn Bosnien wächst der Onlinehandel zwar, aber viele Menschen kaufen noch auf Märkten oder in kleinen Geschäften, vor allem Lebensmittel.\nFür den Onlinekauf spricht, dass er bequem ist und rund um die Uhr funktioniert. Dagegen spricht, dass viele Pakete zurückgeschickt werden, was schlecht für die Umwelt ist. Außerdem leiden die Innenstädte.\nMeiner Meinung nach brauchen wir beides. Ich würde mir wünschen, dass lokale Geschäfte auch online sichtbar sind. Vielen Dank fürs Zuhören.',

 {t:'Teil 2 · Diskussion (ca. 5 Min.)',i:'Diskutuj s partnerom: „Sollte Social Media erst ab 16 Jahren erlaubt sein?" Iznesi argumente, reaguj na partnera, na kraju pokušaj naći zajednički stav.',cards:['Schutz der Kinder','Rolle der Eltern','Kontrolle möglich?','Kontakt zu Freunden','Medienkompetenz in der Schule'],

const MODN={lesen:'Lesen',hoeren:'Hören',schreiben:'Schreiben',sprechen:'Sprechen'};
let EX=null;
const fmtT=t=>esc(t).replace(/\n/g,'<br>');
const scriptTxt=s=>typeof s==='string'?esc(s):s.map(([w,t])=>`<b>${esc(w)}:</b> ${esc(t)}`).join('<br>');
const LET='abcdefghijklmnop';

const EXTRA={};
const xsets=lv=>[EXAMS[lv]].concat(EXTRA[lv]||[]);
const xset=(lv,si)=>xsets(lv)[si]||EXAMS[lv];
const xsc=(lv,si)=>((S.exset||{})[lv+'#'+si])||(si===0?(S.exam||{})[lv]||{}:{});
const GPTS={A1:25,A2:25,B1:100,B2:100};
const praed=p=>p>=90?'sehr gut':p>=80?'gut':p>=70?'befriedigend':p>=60?'ausreichend':'nicht bestanden';
function vExam(m){
  const R=S.exam||{};S.xsel=S.xsel||{};
  let h=`<h2 class="t">Probni ispit</h2><p class="muted" style="margin-top:-6px;font-weight:600">Po formatu Goethe-Zertifikata: 4 modula, pravo vrijeme i bodovi. Za prolaz treba <b>60 %</b> u svakom modulu.</p>
  <button class="xmod" data-tab="mistakes"><span class="xi">🧩</span><span class="xt"><b>Moje greške</b><br><span class="small muted">${(S.xmiss||[]).length} zadataka s ispita za ponavljanje</span></span><span class="xs">›</span></button>`;
  for(const lv of ['A1','A2','B1','B2']){const sets=xsets(lv),si=Math.min(S.xsel[lv]||0,sets.length-1),E=sets[si],r=xsc(lv,si),rb=R[lv]||{};const passed=MODS.every(([k])=>(rb[k]??-1)>=60);
    h+=`<div class="card xlv"><div class="xlh"><span class="lvb">${lv}</span><div style="flex:1"><div style="font-weight:900">${esc(EXAMS[lv].name)}</div><div class="small muted">${esc(EXAMS[lv].info)}</div></div>${passed?'<span class="pass" data-cert="'+lv+'" style="cursor:pointer">🎓 Certifikat</span>':''}</div>
    ${sets.length>1?`<div class="seg" style="margin:4px 0 8px">${sets.map((_,i)=>`<button class="${i===si?'on':''}" data-xset="${lv}|${i}">Test ${i+1}</button>`).join('')}</div>`:''}`;
    for(const [k,ic,de,bs] of MODS){const M=E[k],sc=r[k];
      h+=`<button class="xmod" data-exam="${lv}|${k}|${si}"><span class="xi">${ic}</span><span class="xt"><b>${de}</b> · ${bs}<br><span class="small muted">${M.min} min · ${esc(M.desc)}</span></span><span class="xs ${sc==null?'':sc>=60?'ok':'bad'}">${sc==null?'›':sc+' %'}</span></button>`;}
    h+=`<button class="btn blue sm" data-sim="${lv}|${si}" style="margin-top:8px">🎯 Simulacija ispita (Test ${si+1}): sva 4 modula</button></div>`;}
  h+=`<div class="note" style="margin-top:16px">ℹ️ Ovo nije zvanični ispit i nije povezano s Goethe-Institutom. Zadaci su originalni i napravljeni po uzoru na format ispita: isti moduli, vrijeme, broj zadataka i vrste zadataka. „Goethe-Zertifikat" je zaštićeni naziv Goethe-Instituta e.V. Službeni probni testovi (Übungssätze) su besplatni na stranici <a href="https://www.goethe.de/de/spr/prf/ueb/pa1.html" target="_blank" rel="noopener">Goethe-Instituta</a>.</div>`;
  m.innerHTML=h;
}
function examSheet(lv,k,si){si=si||0;
  const E=xset(lv,si),M=E[k],sc=xsc(lv,si)[k];
  const how={lesen:'Odgovore biraš tapom. Možeš se vraćati i mijenjati odgovore dok ne predaš. Poslije predaje vidiš objašnjenje i mjesto u tekstu gdje je odgovor.',hoeren:'Svaki tekst smiješ pustiti onoliko puta koliko piše (1× ili 2×), kao na pravom ispitu. Poslije predaje dobiješ transkript i objašnjenja.',schreiben:'Pišeš na tastaturi. Dugme „📋 Šablon i fraze" ubacuje gotove fraze. Nakon predaje dobiješ primjer rješenja i provjeru tačaka.',sprechen:'Pročitaj zadatak, snimi se (🎙️) i preslušaj. Zatim uporedi s primjerom (🔊) i ocijeni se.'}[k];

/* bashlab mini MQTT 3.1.1 klijent preko WebSocketa – zamjena za mqtt.js (bez CDN-a).
   API: mqtt.connect(url,{clientId,keepalive,reconnectPeriod,connectTimeout,will}) →

/* --- kripto --- */
const b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
const EC={name:'ECDSA',namedCurve:'P-256'},SG={name:'ECDSA',hash:'SHA-256'},enc=s=>new TextEncoder().encode(s);
const ADM_LS='bashdeutsch-admin',MOD_LS='bashdeutsch-mod';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
const admHasKey=()=>!!lsGet(ADM_LS),modHasKey=()=>!!lsGet(MOD_LS);
let ADM={pub:null,priv:null,is:false,mine:null},MOD={priv:null,pub:null};
const KC={};async function pubKey(raw){if(!KC[raw])KC[raw]=await crypto.subtle.importKey('raw',b64d(raw),EC,false,['verify']);return KC[raw];}
function jwkPub(j){const x=b64d(j.x),y=b64d(j.y),r=new Uint8Array(65);r[0]=4;r.set(x,1);r.set(y,33);return b64e(r);}
async function admInit(){
  try{if(ADMIN_PUB&&ADMIN_PUB.length>40)ADM.pub=await pubKey(ADMIN_PUB);}catch(e){}
  try{const j=lsGet(ADM_LS);if(j){ADM.priv=await crypto.subtle.importKey('jwk',j,EC,true,['sign']);ADM.mine=jwkPub(j);ADM.is=!!ADM.pub&&ADM.mine===ADMIN_PUB;}}catch(e){}
  try{const j=lsGet(MOD_LS);if(j){MOD.priv=await crypto.subtle.importKey('jwk',j,EC,true,['sign']);MOD.pub=jwkPub(j);}}catch(e){}
  if(isStaff())LB.clients.forEach(c=>{if(c.connected)c.subscribe(PING+'+');});
  if(ADM.is)LB.clients.forEach(c=>{if(c.connected)c.subscribe(REG+'+');});
  if(['profile','admin','rank','mod'].includes(tab))render();
}
const MODIS=()=>!!MOD.pub&&!!LB.roles[MOD.pub];
const isStaff=()=>ADM.is||MODIS();
const can=p=>ADM.is||(MODIS()&&(LB.roles[MOD.pub].p||[]).includes(p));
async function admVerify(str,sig){try{if(!ADM.pub||!sig)return false;return await crypto.subtle.verify(SG,ADM.pub,b64d(sig),enc(str));}catch(e){return false;}}
async function ctlVerify(str,e,perm){
  if(await admVerify(str,e.sig))return 'Admin';
  const m=e.by&&LB.roles[e.by];if(m&&(!perm||(m.p||[]).includes(perm))){try{if(await crypto.subtle.verify(SG,await pubKey(e.by),b64d(e.sig),enc(str)))return m.n;}catch(x){}}
  return null;}
async function actSign(str){if(ADM.is)return {sig:b64e(await crypto.subtle.sign(SG,ADM.priv,enc(str)))};if(MODIS())return {sig:b64e(await crypto.subtle.sign(SG,MOD.priv,enc(str))),by:MOD.pub};throw new Error('no key');}
async function mkKey(ls){const kp=await crypto.subtle.generateKey(EC,true,['sign','verify']);localStorage.setItem(ls,JSON.stringify(await crypto.subtle.exportKey('jwk',kp.privateKey)));await admInit();render();}
async function impKey(ls,txt){try{const j=JSON.parse(txt.trim());await crypto.subtle.importKey('jwk',j,EC,true,['sign']);localStorage.setItem(ls,JSON.stringify(j));await admInit();render();return true;}catch(e){return false;}}
/* --- rang lista --- */
function isoWeek(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+Math.ceil(((t-y)/864e5+1)/7);}
function weekXP(){const d=new Date(),day=(d.getDay()+6)%7;let s=0;for(let i=0;i<=day;i++)s+=S.daily[dk(dayOff(-i))]||0;return s;}
function myLevel(){const R=S.exam||{};let lv='';for(const l of ['A1','A2','B1','B2'])if(MODS.every(([k])=>((R[l]||{})[k]??-1)>=60))lv=l+' ✓';return lv||UNITS[curIdx()<0?UNITS.length-1:curIdx()>>2].lvl;}
const lbCanon=e=>[e.id,e.n,e.xp,e.wk,e.wid,e.st,e.lv,e.w,e.ts].join('|');
async function myEntry(){const e={v:1,id:S.uid,n:S.nick,xp:S.xp,wk:weekXP(),wid:isoWeek(),st:streakNow(),lv:myLevel(),w:Object.values(S.words).filter(r=>r.ok>r.bad).length+Object.values(S.vocab||{}).filter(r=>r.b>=3).length,ts:Date.now()};if(isStaff())try{Object.assign(e,await actSign(lbCanon(e)));}catch(x){}return e;}
function lbLib(){return Promise.resolve(!!window.mqtt);}
async function lbConnect(){
  if(LB.clients.length)return;LB.status='wait';
  if(!await lbLib()){LB.status='err';lbDraw();return;}
  LB_B.forEach(u=>{try{const c=mqtt.connect(u,{clientId:'bd_'+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:8000,reconnectPeriod:6000,keepalive:30});
    c.on('connect',()=>{LB.status='ok';LB.lastOk=Date.now();c.subscribe([LB_T+'+',CTL+'+']);if(isStaff())c.subscribe(PING+'+');if(ADM.is)c.subscribe(REG+'+');sendAll(c);Object.entries(LB.out).forEach(([k,o])=>{if(!o.ok)pub(c,CTL+k,o.e);});lbDraw();if(S.blocked)render();});
    c.on('message',(t,m)=>lbMsg(t,m));c.on('error',()=>{});LB.clients.push(c);}catch(e){}});
  setTimeout(()=>{if(LB.status==='wait'){LB.status='err';lbDraw();}},10000);
}
function pub(c,topic,obj){try{c.publish(topic,obj===''?'':JSON.stringify(obj),{qos:1,retain:true});}catch(e){}}
function pubAll(topic,obj){LB.clients.forEach(c=>pub(c,topic,obj));}
async function sendAll(c){
  if(!S.first){S.first=Date.now();save();}
  if(!S.pingGone){(c?[c]:LB.clients).forEach(x=>pub(x,PING+S.uid,''));S.pingGone=true;save();}regSend(c);
  if(S.nick&&!S.lbOff){const e=await myEntry();LB.data[S.uid]={...LB.data[S.uid],...e,adm:ADM.is,mod:MODIS()?LB.roles[MOD.pub].n:null};(c?[c]:LB.clients).forEach(x=>pub(x,LB_T+S.uid,e));}
}
function lbPublish(){if(!LB.clients.length){lbConnect();return;}sendAll();}
/* --- kontrolne poruke: roles, ban, block, news, badges, nicks --- */
const CTLS={
  roles:{perm:'__admin',str:e=>'roles|'+e.ts+'|'+JSON.stringify(e.mods),ok:e=>e.mods&&typeof e.mods==='object',apply:e=>{LB.roles=e.mods;if(MODIS())LB.clients.forEach(c=>{if(c.connected)c.subscribe(PING+'+');});['ban','block','news','badges','nicks','gifts'].forEach(k=>{if(LB.raw[k])ctlHandle(k,LB.raw[k]);});if(MOD.pub)render();}},
  ban:{perm:'ban',str:e=>'ban|'+e.ts+'|'+e.ids.join(','),ok:e=>Array.isArray(e.ids),apply:e=>{LB.ban=new Set(e.ids);}},
  block:{perm:'ban',str:e=>'block|'+e.ts+'|'+JSON.stringify(e.list),ok:e=>e.list&&typeof e.list==='object',apply:e=>{LB.block=e.list;applyMyBlock(e);}},
  news:{perm:'news',str:e=>'news|'+e.ts+'|'+e.msg,ok:e=>typeof e.msg==='string',apply:e=>{LB.news={msg:e.msg.slice(0,300),ts:e.ts};newsDraw();}},
  badges:{perm:'badge',str:e=>'badges|'+e.ts+'|'+JSON.stringify(e.map),ok:e=>e.map&&typeof e.map==='object',apply:e=>{LB.badges=e.map;}},
  gifts:{perm:'hearts',str:e=>'gifts|'+e.ts+'|'+JSON.stringify(e.map),ok:e=>e.map&&typeof e.map==='object',apply:e=>{LB.gifts=e.map;applyGifts(e.map);}},
  nicks:{perm:'nick',str:e=>'nicks|'+e.ts+'|'+JSON.stringify(e.map),ok:e=>e.map&&typeof e.map==='object',apply:e=>{LB.nicks=e.map;const n=e.map[S.uid];if(n&&NICK_RE.test(n)&&S.nick&&S.nick!==n){S.nick=n;save();}}},
};
async function ctlHandle(k,e){
  if(e&&LB.out[k]&&LB.out[k].e.ts===e.ts&&!LB.out[k].ok){LB.out[k].ok=true;toast('✓ Spremljeno na server');}
  const C=CTLS[k];if(!C||!e||!C.ok(e)||!(e.ts>(LB.ts[k]||0)))return;
  LB.raw[k]=e;
  const who=C.perm==='__admin'?(await admVerify(C.str(e),e.sig)?'Admin':null):await ctlVerify(C.str(e),e,C.perm);
  if(!who||!(e.ts>(LB.ts[k]||0)))return;
  LB.ts[k]=e.ts;LB.by[k]=who;C.apply(e);lbDrawSoon();
}
function toast(msg,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
function watchOut(k,ts){setTimeout(()=>{const o=LB.out[k];if(o&&o.e.ts===ts&&!o.ok){toast('⚠️ Server još nije potvrdio. Ponovo šaljem…',true);LB.clients.forEach(c=>pub(c,CTL+k,o.e));setTimeout(()=>{const o2=LB.out[k];if(o2&&o2.e.ts===ts&&!o2.ok)toast('⚠️ Nije spremljeno. Provjeri internet i pokušaj ponovo.',true);},8000);}},8000);}
function lbReconnect(){LB.clients.forEach(c=>{try{c.end(true);}catch(e){}});LB.clients=[];LB.status='off';lbConnect();}
function waitConn(){return new Promise(res=>{if(LB.clients.some(c=>c.connected))return res(true);lbConnect();toast('Povezujem se sa serverom…');let n=0;const iv=setInterval(()=>{if(LB.clients.some(c=>c.connected)){clearInterval(iv);setTimeout(()=>res(true),1200);}else if(++n>40){clearInterval(iv);res(false);}},250);});}
async function ctlSend(k,payload){
  if(!await waitConn()){toast('⚠️ Nema veze sa serverom. Pokušaj ponovo.',true);return;}
  const ts=Date.now(),e={...payload,ts};Object.assign(e,await actSign(CTLS[k].str(e)));
  LB.ts[k]=ts;LB.raw[k]=e;LB.by[k]=ADM.is?'Admin':LB.roles[MOD.pub].n;CTLS[k].apply(e);LB.out[k]={e,ok:false};pubAll(CTL+k,e);watchOut(k,ts);lbDrawSoon();
}
async function lbMsg(t,m){
  const s=m&&m.toString?m.toString():'';
  if(t.startsWith(CTL)){let e;try{e=JSON.parse(s);}catch(x){return;}ctlHandle(t.slice(CTL.length),e);return;}
  if(t.startsWith(REG)){regMsg(t,s);return;}
  if(t.startsWith(PING)){const id=t.slice(PING.length);if(!s){delete LB.pings[id];return;}try{const e=JSON.parse(s);if(+e.ts)LB.pings[id]={ts:+e.ts,f:+e.f||+e.ts,lv:String(e.lv||'').slice(0,5)};if(tab==='admin')admDrawSoon();}catch(x){}return;}
  const id=t.slice(LB_T.length);if(!/^[a-z0-9]{6,24}$/.test(id))return;
  if(!s){delete LB.data[id];lbDrawSoon();return;}
  try{const e=JSON.parse(s);if(e.id!==id||typeof e.n!=='string'||!NICK_RE.test(e.n))return;
    const num=(x,max)=>Math.max(0,Math.min(max,Math.floor(+x||0)));
    const r={id,n:e.n,xp:num(e.xp,200000),wk:num(e.wk,20000),wid:String(e.wid||''),st:num(e.st,3650),lv:String(e.lv||'A1').slice(0,5),w:num(e.w,5000),ts:num(e.ts,9e15)};
    if(Date.now()-r.ts>60*864e5)return;
    if(e.sig){const who=await ctlVerify(lbCanon(r),e,null);r.adm=who==='Admin';r.mod=who&&who!=='Admin'?who:null;}
    const o=LB.data[id];if(!o||r.ts>=o.ts){LB.data[id]=r;lbDrawSoon();}
  }catch(err){}
}
let lbT=0;function lbDrawSoon(){clearTimeout(lbT);lbT=setTimeout(()=>{lbDraw();if(tab==='admin')admDraw();},250);}
let APS='last';
let admT=0;function admDrawSoon(){clearTimeout(admT);admT=setTimeout(admDraw,400);}
function lbRemove(){pubAll(LB_T+S.uid,'');delete LB.data[S.uid];}
const dispNick=r=>{const n=LB.nicks[r.id];return n&&NICK_RE.test(n)?n:r.n;};
/* --- uklanjanje s kursa --- */
const isBlockedRec=r=>!!r&&(!r.u||r.u>Date.now());
function applyMyBlock(e){const mine=e.list[S.uid];
  if(isBlockedRec(mine)&&!isStaff()){S.blocked={u:mine.u||0,r:String(mine.r||'').slice(0,200),ts:e.ts};save();render();}
  else if(S.blocked&&e.ts>(S.blocked.ts||0)){S.blocked=null;save();render();}}
function amBlocked(){if(isStaff())return false;const b=S.blocked;if(!b)return false;if(b.u&&b.u<=Date.now()){S.blocked=null;save();return false;}return true;}
function vBlocked(app){const b=S.blocked;
  app.innerHTML=`<div style="text-align:center;padding:60px 24px">${mascot(120,'sad')}<h2 class="t" style="margin-top:16px">Pristup kursu je ukinut</h2>
  <p class="muted" style="font-weight:700;line-height:1.5">Uklonjen si s kursa Bash Deutsch${b.u?` do <b>${fmtD(b.u)}</b>`:''}.</p>
  ${b.r?`<div class="note" style="text-align:left"><b>Razlog:</b> ${esc(b.r)}</div>`:''}
  <p class="small muted" style="font-weight:600;margin-top:16px">Ako misliš da je greška, javi se adminu na Instagram <b>@basa.gtm</b>.</p><button class="btn ghost" id="bchk" style="margin-top:18px">🔄 Provjeri ponovo</button><div class="small muted" id="bst" style="margin-top:8px">${LB.status==='ok'?'Povezano sa serverom':'Povezujem se…'}</div></div>`;
  const bc=document.getElementById('bchk');if(bc)bc.onclick=()=>{document.getElementById('bst').textContent='Provjeravam…';lbReconnect();setTimeout(()=>{const x=document.getElementById('bst');if(x)x.textContent=LB.status==='ok'?'Provjereno: i dalje si uklonjen.':'Nema veze sa serverom. Provjeri internet.';},6000);};}
/* --- obavještenje --- */
function newsDraw(){const el=$('#news');if(!el)return;const n=LB.news;if(!n||!n.msg||n.ts<=(S.newsSeen||0)){el.innerHTML='';return;}
  el.innerHTML=`<div class="newsb"><span style="font-size:22px">📢</span><div style="flex:1"><div class="small" style="font-weight:900;opacity:.8">Obavještenje · ${esc(LB.by.news==='Admin'?'👑 admin':'🛡️ '+(LB.by.news||''))}</div><div>${fmtT(n.msg)}</div></div><button class="xbtn" id="newsx" aria-label="Zatvori">✕</button></div>`;
  $('#newsx').onclick=()=>{S.newsSeen=n.ts;save();el.innerHTML='';};}

function vRank(m){
  if(!S.nick&&!S.lbOff){m.innerHTML=`<div style="text-align:center;padding-top:20px">${mascot(110)}<h2 class="t">Rang lista</h2><p class="muted" style="font-weight:600">Takmiči se s ostalima koji uče njemački u Bash Deutsch. Izaberi nadimak: on je jedino što drugi vide.</p></div>
    <input class="search" id="nk" maxlength="16" placeholder="Nadimak, npr. Basa_93" autocomplete="off" value="${esc((S.reg&&S.reg.nick)||'')}"><div class="small muted" id="nkh">3–16 znakova: slova, brojevi, _ . -</div><button class="btn" id="nks">Pridruži se rang listi</button><button class="btn ghost" id="nkn">Ne želim biti na listi</button>`;
    $('#nks').onclick=()=>{const v=$('#nk').value.trim();if(!NICK_RE.test(v)){$('#nkh').innerHTML='<span class="badc">Nadimak mora imati 3–16 znakova (slova, brojevi, _ . -).</span>';return;}S.nick=v;S.lbOff=false;save();lbPublish();render();};

  <div class="sec"><div class="note">🌐 Rezultati idu preko istih javnih servera kao #Bash igre i osvježavaju se kad neko završi lekciju. Javno se vidi samo nadimak, pa ne koristi pravo ime. <a href="datenschutz.html#bs" target="_blank" rel="noopener">Privatnost</a></div>
  ${S.lbOff?`<button class="btn" id="lbon">Pridruži se rang listi</button>`:`<div class="small muted" style="margin-top:10px">Tvoj nadimak: <b>${esc(S.nick)}</b>${ADM.is?' 👑':MODIS()?' 🛡️':''}${forced?' · promijenio ga je moderator':''}</div>${forced?'':'<button class="btn ghost" id="lbn">Promijeni nadimak</button>'}<button class="btn ghost" id="lbx" style="color:var(--red)">Ukloni me s liste</button>`}</div>`;
  m.querySelectorAll('[data-lbv]').forEach(b=>b.onclick=()=>{LB.view=b.dataset.lbv;m.querySelectorAll('[data-lbv]').forEach(x=>x.classList.toggle('on',x===b));lbDraw();});
  const on=$('#lbon');if(on)on.onclick=()=>{S.lbOff=false;S.nick=null;save();render();};
  const nn=$('#lbn');if(nn)nn.onclick=()=>{lbRemove();S.nick=null;save();render();};
  const x=$('#lbx');if(x)x.onclick=()=>{lbRemove();S.lbOff=true;save();render();};
  $('#lbl').onclick=e=>{const b=e.target.closest('[data-usr]');if(b)userSheet(b.dataset.usr);};

function rowBadges(id){const b=LB.badges[id];return Array.isArray(b)&&b.length?`<span class="bdg">${b.slice(0,3).map(x=>esc(String(x).slice(0,22))).join(' ')}</span>`:'';}
function lbDraw(){
  const el=$('#lbl');if(!el)return;
  if(LB.status==='err'&&Object.keys(LB.data).length<=1){el.innerHTML=`<div class="note">⚠️ Ne mogu se spojiti na server rang liste. Provjeri internet. U verziji unutar Claude chata rang lista ne radi, nego samo na <b>basaofficial.github.io/deutsch</b>.</div>`;return;}
  const wid=isoWeek(),v=LB.view,staff=isStaff();
  let rows=Object.values(LB.data).filter(r=>staff||r.id===S.uid||(!LB.ban.has(r.id)&&!isBlockedRec(LB.block[r.id])));
  if(v==='week')rows=rows.filter(r=>r.wid===wid&&r.wk>0).sort((a,b)=>b.wk-a.wk);
  else if(v==='all')rows=rows.filter(r=>r.xp>0).sort((a,b)=>b.xp-a.xp);
  else rows=rows.filter(r=>r.st>0).sort((a,b)=>b.st-a.st||b.xp-a.xp);
  const val=r=>v==='week'?`⚡ ${r.wk}`:v==='all'?`⚡ ${r.xp}`:`🔥 ${r.st}`;
  const me=rows.findIndex(r=>r.id===S.uid);
  let h=LB.status==='wait'&&rows.length<2?'<p class="muted">Učitavam rezultate…</p>':'';
  if(me>=0)h+=`<div class="lbme">Ti si <b>#${me+1}</b> od ${rows.length}${v==='week'?' ove sedmice':''}</div>`;
  else if(!S.lbOff&&S.nick)h+=`<div class="lbme">Završi lekciju da uđeš na listu.</div>`;
  h+=rows.slice(0,50).map((r,i)=>{const nm=dispNick(r),banned=LB.ban.has(r.id),blk=isBlockedRec(LB.block[r.id]);return `<div class="lbr ${r.id===S.uid?'me':''} ${banned||blk?'ban':''}"><span class="lbp">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="lbav" style="background:${r.adm?'#ffc800':r.mod?'#1cb0f6':PAL[(nm.charCodeAt(0)||0)%PAL.length][0]}">${r.adm?'👑':r.mod?'🛡️':esc(nm[0]||'?').toUpperCase()}</span><span class="lbn"><span>${esc(nm)}${r.adm?' <span class="admb">ADMIN</span>':r.mod?' <span class="admb mod">MOD</span>':''}</span>${rowBadges(r.id)}<small>${esc(r.lv)} · ${r.w} riječi${banned?' · 🚫 skriven':''}${blk?' · ⛔ uklonjen':''}</small></span><span class="lbv">${val(r)}</span>${staff&&r.id!==S.uid?`<button class="banb" data-usr="${r.id}" title="Upravljaj korisnikom">⚙️</button>`:''}</div>`;}).join('');
  if(!rows.length&&LB.status==='ok')h+='<p class="muted">Još niko nije na listi. Budi prvi! 💪</p>';
  el.innerHTML=h;
}
/* --- akcije osoblja --- */
async function actBan(id){if(!can('ban'))return;if(!await waitConn())return toast('⚠️ Nema veze sa serverom.',true);const s=new Set(LB.ban);s.has(id)?s.delete(id):s.add(id);await ctlSend('ban',{ids:[...s]});}
async function actBlock(id,days,reason){if(!can('ban')||id===S.uid||(LB.data[id]&&LB.data[id].adm))return;if(!await waitConn())return toast('⚠️ Nema veze sa serverom.',true);const list={...LB.block};
  if(days===null)delete list[id];else list[id]={u:days?Date.now()+days*864e5:0,r:String(reason||'').slice(0,200)};
  Object.keys(list).forEach(k=>{if(!isBlockedRec(list[k]))delete list[k];});await ctlSend('block',{list});}
async function actNews(msg){if(!can('news'))return;await ctlSend('news',{msg:msg.trim().slice(0,300)});}
async function actBadge(id,b){if(!can('badge'))return;if(!await waitConn())return toast('⚠️ Nema veze sa serverom.',true);const map=JSON.parse(JSON.stringify(LB.badges||{}));const a=new Set(map[id]||[]);a.has(b)?a.delete(b):a.add(b);if(a.size)map[id]=[...a].slice(0,3);else delete map[id];await ctlSend('badges',{map});}
async function actNick(id,n){if(!can('nick'))return;if(!await waitConn())return toast('⚠️ Nema veze sa serverom.',true);const map={...LB.nicks};if(n)map[id]=n;else delete map[id];await ctlSend('nicks',{map});}
function applyGifts(map){S.gUsed=S.gUsed||[];let got=0,inf=0;
  for(const k of [S.uid,'*']){const g=map[k];if(!g||!g.g||S.gUsed.includes(g.g))continue;if(k==='*'&&S.first&&g.t<S.first-864e5)continue;
    S.gUsed.push(g.g);const h=Math.max(0,Math.min(50,+g.h||0)),d=Math.max(0,Math.min(30,+g.d||0));
    if(h){regen();S.hearts=Math.min(99,S.hearts+h);got+=h;}if(d){const u=(+g.t||Date.now())+d*864e5;if(u>Date.now()){S.hInf=Math.max(S.hInf||0,u);inf=d;}}}

async function encForAdmin(obj){
  const apk=await crypto.subtle.importKey('raw',b64d(ADMIN_PUB),DH,false,[]);
  const eph=await crypto.subtle.generateKey(DH,true,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'ECDH',public:apk},eph.privateKey,{name:'AES-GCM',length:256},false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc(JSON.stringify(obj)));
  return {v:1,epk:b64e(await crypto.subtle.exportKey('raw',eph.publicKey)),iv:b64e(iv),ct:b64e(ct)};
}
let ADH=null;
async function decForAdmin(e){
  if(!ADH){const j={...lsGet(ADM_LS)};delete j.key_ops;delete j.alg;ADH=await crypto.subtle.importKey('jwk',j,DH,false,['deriveKey']);}
  const epk=await crypto.subtle.importKey('raw',b64d(e.epk),DH,false,[]);
  const key=await crypto.subtle.deriveKey({name:'ECDH',public:epk},ADH,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},key,b64d(e.ct))));
}
function progSnap(){const V=S.vocab||{},vl={};Object.keys(VOCAB).forEach(lv=>{vl[lv]=VOCW.filter(w=>w.lv===lv&&V[w.id]&&V[w.id].b>=3).length;});
  const d7=[...Array(7)].filter((_,i)=>(S.daily[dk(dayOff(-i))]||0)>0).length,d30=[...Array(30)].filter((_,i)=>(S.daily[dk(dayOff(-i))]||0)>0).length;
  const c=curIdx(),ex={};Object.entries(S.exam||{}).forEach(([lv,o])=>{ex[lv]={};MODS.forEach(([k])=>{if(o[k]!=null)ex[lv][k]=o[k];});});
  return {l:Object.keys(S.done).length,lt:UNITS.length*4,xp:S.xp,st:streakNow(),w:Object.values(S.words).filter(r=>r.ok>r.bad).length,v:vl,ex,cert:certLevels(),d7,d30,u:c<0?'Sve završeno':UNITS[c>>2].lvl+' · '+UNITS[c>>2].t};}
async function regSend(c){if(!S.reg||!ADMIN_PUB)return;S.reg.last=Date.now();S.reg.lv=myLevel();S.reg.first=S.first||S.reg.ts;if('age' in S.reg){delete S.reg.age;save();}try{const e=await encForAdmin({...S.reg,uid:S.uid,p:progSnap()});(c?[c]:LB.clients).forEach(x=>pub(x,REG+S.uid,e));}catch(x){}}
async function regMsg(t,s){if(!ADM.is)return;const id=t.slice(REG.length);if(!s){delete LB.reg[id];admDrawSoon();return;}
  try{const d=await decForAdmin(JSON.parse(s));LB.reg[id]={nick:String(d.nick||[d.fn,d.ln].filter(Boolean).join(' ')||'').slice(0,40),mail:String(d.mail||'').slice(0,80),ts:+d.ts||0,last:+d.last||+d.ts||0,lv:String(d.lv||'').slice(0,5),first:+d.first||+d.ts||0,p:cleanProg(d.p)};admDrawSoon();}catch(x){}}
function cleanProg(p){if(!p||typeof p!=='object')return null;const n=x=>Math.max(0,Math.min(1e7,+x||0)),o={l:n(p.l),lt:n(p.lt),xp:n(p.xp),st:n(p.st),w:n(p.w),d7:Math.min(7,n(p.d7)),d30:Math.min(30,n(p.d30)),u:String(p.u||'').slice(0,60),v:{},ex:{},cert:[]};
  ['A1','A2','B1','B2'].forEach(lv=>{if(p.v&&p.v[lv]!=null)o.v[lv]=n(p.v[lv]);if(p.ex&&p.ex[lv]){o.ex[lv]={};MODS.forEach(([k])=>{if(p.ex[lv][k]!=null)o.ex[lv][k]=Math.min(100,n(p.ex[lv][k]));});}if(Array.isArray(p.cert)&&p.cert.includes(lv))o.cert.push(lv);});return o;}
function progBox(id,full){const g=LB.reg[id],p=g&&g.p;if(!p)return full?'<p class="small muted" style="font-weight:600">Još nema podataka o napretku (korisnik treba otvoriti novu verziju aplikacije).</p>':'';
  const pct=p.lt?Math.round(p.l/p.lt*100):0,vw=Object.values(p.v).reduce((a,b)=>a+b,0);
  let h=`<div class="gbar" style="margin:6px 0 4px"><i style="width:${pct}%"></i></div><div class="small" style="font-weight:700">📘 ${p.l}/${p.lt} lekcija (${pct}%) · 📖 ${p.w+vw} riječi · 🔥 ${p.st} · 📅 ${p.d7}/7 dana${p.cert.length?' · 🎓 '+p.cert.join(', '):''}</div>`;
  if(!full)return h;
  h+=`<div class="card" style="margin-top:8px;padding:10px"><div class="small" style="font-weight:700;line-height:1.7">📍 Trenutno: ${esc(p.u)}<br>⚡ ${p.xp} XP ukupno · aktivan ${p.d30} od zadnjih 30 dana<br>📖 Riječi iz lekcija: ${p.w}${Object.entries(p.v).map(([lv,n])=>` · vokabular ${lv}: ${n}/${VOCW.filter(w=>w.lv===lv).length}`).join('')}</div>`;
  const lvls=Object.keys(p.ex);h+=lvls.length?`<div class="small" style="font-weight:900;margin:8px 0 4px">📝 Probni ispiti</div>`+lvls.map(lv=>`<div class="small" style="font-weight:700">${lv}: ${MODS.map(([k,ic])=>`${ic} ${p.ex[lv][k]!=null?`<span class="${p.ex[lv][k]>=60?'okc':'badc'}">${p.ex[lv][k]}%</span>`:'–'}`).join(' ')}${p.cert.includes(lv)?' · 🎓':''}</div>`).join(''):'<div class="small muted" style="font-weight:600;margin-top:6px">Još nije radio probne ispite.</div>';
  return h+'</div>';}
const needReg=()=>!S.reg&&!isStaff()&&!admHasKey()&&!modHasKey()&&tab!=='admin'&&tab!=='mod';
function vRegister(app){
  const r=S.regDraft||{};
  app.innerHTML=`<div style="padding:28px 18px 40px;max-width:520px;margin:0 auto">
  <div style="text-align:center">${mascot(96)}<h2 class="t" style="margin:10px 0 4px">Dobro došao u Bash Deutsch! 🇩🇪</h2><p class="muted" style="font-weight:600;margin:0 0 18px">Prije početka kursa upiši nadimak i email.</p></div>
  <div class="card" style="display:grid;gap:10px">
   <input class="search" id="rnk" maxlength="16" placeholder="Nadimak (npr. Basa_93)" value="${esc(r.nick||'')}" autocomplete="nickname">
   <input class="search" id="rmail" type="email" maxlength="80" placeholder="Email" value="${esc(r.mail||'')}" autocomplete="email">
   <label class="xck" style="font-size:13px;font-weight:600"><input type="checkbox" id="r16"> <span>Imam 16 ili više godina (ili imam saglasnost roditelja).</span></label>
   <label class="xck" style="font-size:13px;font-weight:600"><input type="checkbox" id="rok"> <span>Pristajem da se ovi podaci i moj napredak u kursu <b>šifrovano</b> pošalju adminu kursa i koriste samo za vođenje kursa. Ne prikazuju se drugim korisnicima. Saglasnost mogu povući i podatke obrisati u Profilu. <a href="datenschutz.html#bs" target="_blank" rel="noopener">Izjava o privatnosti</a></span></label>
   <div class="small" id="rerr"></div>
   <button class="btn" id="rgo">Započni kurs</button></div></div>`;
  const q=id=>document.getElementById(id),val=id=>q(id).value.trim();
  q('rgo').onclick=()=>{
    const d={nick:val('rnk'),mail:val('rmail')};S.regDraft=d;
    const err=m=>{q('rerr').innerHTML=`<span class="badc">${m}</span>`;};
    if(!NICK_RE.test(d.nick))return err('Nadimak mora imati 3–16 znakova (slova, brojevi, _ . -).');
    if(!MAIL_RE.test(d.mail))return err('Email nije ispravan.');
    if(!q('r16').checked)return err('Kurs je za osobe od 16 godina ili uz saglasnost roditelja.');
    if(!q('rok').checked)return err('Potrebna je saglasnost za obradu podataka.');
    S.reg={...d,ts:Date.now()};delete S.regDraft;save();regSend();lbPublish();render();
  };
}
function privSheet(){sheet(`<h3>🔒 Privatnost</h3><div class="tip" style="font-weight:600;line-height:1.55">
  <p><b>Šta se prikuplja:</b> nadimak i email, te napredak u kursu.</p>
  <p><b>Ko vidi:</b> samo admin kursa (Basa). Podaci se na tvom telefonu šifruju adminovim ključem prije slanja, pa ih ne mogu pročitati ni serveri ni moderatori.</p>
  <p><b>Zašto:</b> za vođenje kursa i kontakt s polaznicima. Podaci se ne prodaju niti dijele.</p>
  <p><b>Brisanje:</b> u Profilu → „Moji podaci" → „Obriši moje podatke".</p>
  <p><b>Kontakt:</b> Instagram @basa.gtm</p></div><button class="btn" onclick="closeSheet()">U redu</button>`);}
function myDataSection(){if(!S.reg)return '';const r=S.reg;
  return `<div class="sec"><h3>🪪 Moji podaci</h3><div class="card small" style="font-weight:700;line-height:1.7">${esc(r.nick)}<br>${esc(r.mail)}</div>
  <button class="btn ghost" id="redit">Izmijeni podatke</button><button class="btn ghost" id="rdel" style="color:var(--red)">Obriši moje podatke</button><a class="btn ghost" href="datenschutz.html#bs" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">🔒 Izjava o privatnosti</a></div>`;}
function bindMyData(){const e=$('#redit'),d=$('#rdel');
  if(e)e.onclick=()=>{S.regDraft=S.reg;S.reg=null;save();render();};
  if(d)d.onclick=()=>{sheet(`<h3>Obrisati tvoje podatke?</h3><p class="muted" style="font-weight:600">Podaci se brišu sa servera. Za nastavak kursa morat ćeš ih ponovo upisati.</p><button class="btn red" id="rdy">Obriši</button><button class="btn ghost" id="rdn">Odustani</button>`);
    $('#rdn').onclick=closeSheet;$('#rdy').onclick=()=>{pubAll(REG+S.uid,'');S.reg=null;save();closeSheet();render();};};}
function regRow(id,full){const g=LB.reg[id];return g?`<div class="small" style="font-weight:700;color:var(--blue)">🪪 ${esc(g.nick)} · ✉️ ${esc(g.mail)}</div>${progBox(id,full)}`:'';}
function regCSV(){const rows=[['Nadimak (registracija)','Email','Nadimak (rang lista)','XP','Nivo','Lekcije','Riječi','Niz','Aktivnih dana (7)','Certifikati','Zadnja aktivnost','Registrovan']];
  Object.entries(LB.reg).forEach(([id,g])=>{const r=LB.data[id];const p=g.p||{};rows.push([g.nick,g.mail,r?r.n:'',p.xp??(r?r.xp:''),g.lv||(r?r.lv:''),p.lt?p.l+'/'+p.lt:'',p.w!=null?p.w+Object.values(p.v||{}).reduce((a,b)=>a+b,0):'',p.st??'',p.d7??'',(p.cert||[]).join(' '),g.last?fmtD(g.last):'',g.ts?fmtD(g.ts):'']);});
  return rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const ce=e.target.closest('[data-cert]');if(ce){certSheet(ce.dataset.cert);return;}
  const t=e.target.closest('[data-plan],[data-conf],[data-voc],[data-exam],[data-xset],[data-sim],[data-say],[data-tab],[data-node],[data-start],[data-jump],[data-tip],[data-goal],[data-snd],[data-rate],[data-info]');if(!t)return;
  const d=t.dataset;
  if(d.say!==undefined){speak(d.say,d.slow==='1');return;}
  if(d.voc){const [lv,c]=d.voc.split('|');VSEL={lv,cat:c==null?null:+c};startLesson(0,0,'vocab');return;}
  if(d.conf){confSheet(d.conf);return;}
  if(d.plan){planSheet();return;}
  if(d.exam){const [lv,k,si]=d.exam.split('|');examSheet(lv,k,+si||0);return;}
  if(d.xset){const [lv,i]=d.xset.split('|');S.xsel=S.xsel||{};S.xsel[lv]=+i;save();render();return;}
  if(d.sim){const [lv,i]=d.sim.split('|');simStart(lv,+i);return;}
  if(d.tab){closeSheet();tab=d.tab;render();scrollTo(0,0);}
  else if(d.node)nodeSheet(+d.node);
  else if(d.start){const i=+d.start;startLesson(i>>2,i&3,'lesson');}
  else if(d.jump)startLesson(+d.jump,3,'jump');
  else if(d.tip)tipSheet(+d.tip);
  else if(d.goal){S.goal=+d.goal;save();render();}
  else if(d.snd){S.sound=d.snd==='1';save();render();}
  else if(d.rate){S.rate=+d.rate;save();render();speak('Guten Tag!');}
  else if(d.info){const k=d.info;
    if(k==='hearts'){regen();const mins=Math.max(1,Math.ceil((HEART_MS-(Date.now()-S.heartTs))/60000));sheet(`<h3>❤️ Srca: ${hInf()?'∞':S.hearts+' / 5'}</h3><p class="muted">${hInf()?`🎁 Beskonačna srca do ${fmtD(S.hInf)} ${new Date(S.hInf).toTimeString().slice(0,5)}. `:''}Svaka greška u lekciji košta 1 srce. ${S.hearts<5?`Sljedeće srce za ~${mins} min.`:S.hearts>5?'Imaš bonus srca od admina!':'Sva srca su puna!'} Vježba ne troši srca i daje +1.</p><button class="btn blue" data-tab="practice">Idi na vježbu</button>`);}
    else if(k==='streak')sheet(`<h3>🔥 Niz: ${streakNow()} ${streakNow()===1?'dan':'dana'}</h3><p class="muted">Završi barem jednu lekciju ili vježbu svaki dan da ti niz ne pukne.</p>`);
    else sheet(`<h3>⚡ ${S.xp} XP</h3><p class="muted">Lekcija +10, ispit +20, savršeno bez greške +5, vježba +5.</p>`);}
});
document.addEventListener('keydown',e=>{
  if(!L||!$('#lesson')||$('#sheet'))return;
  if(e.key==='Enter'){e.preventDefault();$('#cb').click();return;}
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(/^[1-4]$/.test(e.key)&&L.state==='ask'){const b=$('#lb').querySelectorAll('.opts .opt')[+e.key-1];if(b)b.click();}
});
setInterval(()=>{if(!L&&S.hearts<5){const h=S.hearts;regen();if(S.hearts!==h)render();}},60000);
render();
admInit();setTimeout(lbPublish,1200);
window.addEventListener('hashchange',()=>{if(location.hash==='#admin'||location.hash==='#mod'){tab=location.hash.slice(1);render();}});
</script>
