<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bash Deutsch – njemački A1–B2</title>
<meta name="description" content="Uči njemački od A1 do B2: lekcije, slušanje, slaganje rečenica, der/die/das, video izvori. Besplatno.">
<link rel="icon" href="../assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--blue-d:#1899d6;--red:#ff4b4b;--red-d:#ea2b2b;--yellow:#ffc800;--orange:#ff9600;
--bg:#fff;--text:#3c3c3c;--muted:#8a8a8a;--line:#e5e5e5;--line-d:#cfcfcf;--card:#fff;--soft:#f7f7f7;--okbg:#d7ffb8;--okfg:#58a700;--badbg:#ffdfe0;--badfg:#ea2b2b}
@media (prefers-color-scheme: dark){:root{--bg:#131f24;--text:#f1f7fb;--muted:#8fa6b2;--line:#37464f;--line-d:#2a383f;--card:#131f24;--soft:#202f36;--okbg:#1e3a14;--okfg:#79d634;--badbg:#3d1a1d;--badfg:#ff7878}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-weight:700}
button{font-family:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.stat.fire{color:var(--orange)}.stat.xp{color:#e5a800}.stat.heart{color:var(--red)}
.flag{font-size:24px}
main{padding:16px 16px 110px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--line);z-index:5}
nav.bottom .in{display:flex;max-width:560px;margin:0 auto}
nav.bottom button{flex:1;background:none;border:0;padding:9px 0 12px;font-size:11px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button .ic{font-size:23px;filter:grayscale(1);opacity:.6}
nav.bottom button.on{color:var(--blue)}
nav.bottom button.on .ic{filter:none;opacity:1}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-d);cursor:default;transform:none}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.card{border:2px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)}.small{font-size:13px}
.goal{display:flex;align-items:center;gap:12px}
.gtxt{flex:1}
.gbar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.gbar i{display:block;height:100%;background:var(--yellow);border-radius:8px}
.lvl{display:flex;align-items:center;gap:10px;margin:34px 0 -6px;font-weight:900;font-size:18px}
.lvl span{background:var(--text);color:var(--bg);border-radius:10px;padding:3px 10px;font-size:15px}
.unit{border-radius:16px;padding:14px 16px;color:#fff;margin:26px 0 22px;display:flex;justify-content:space-between;align-items:center}
.ulbl{font-size:12px;opacity:.9;font-weight:800;letter-spacing:.4px}
.utit{font-size:20px;font-weight:900}
.tipbtn{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);border-radius:12px;font-size:20px;padding:6px 10px;cursor:pointer}
.path{display:flex;flex-direction:column;align-items:center;gap:22px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:72px;height:66px;border-radius:50%;border:0;font-size:28px;font-weight:900;cursor:pointer;background:var(--c);box-shadow:0 7px 0 var(--cd);color:#fff}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.locked{background:var(--line);box-shadow:0 7px 0 var(--line-d);color:var(--muted);font-size:24px}
.node.done{background:var(--yellow);box-shadow:0 7px 0 #e0a800}
.node.cur{outline:5px solid var(--line);outline-offset:6px}
.startb{position:absolute;top:-40px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-weight:900;color:var(--green);font-size:14px;animation:bob 1.2s ease-in-out infinite;white-space:nowrap}
@keyframes bob{50%{transform:translateY(-5px)}}
h2.t{font-size:24px;font-weight:900;margin:6px 0 14px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 30px;max-height:86vh;overflow:auto;animation:up .22s ease-out}
.sheet h3{font-size:22px;margin:4px 0 6px;font-weight:900}
.sh-h{font-weight:900;font-size:14px;letter-spacing:.4px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.tip p{line-height:1.5}
.tip table{border-collapse:collapse;width:100%;margin:8px 0}
.tip td{border:2px solid var(--line);padding:7px 10px}
.tip b{color:var(--blue)}
/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:14px;padding:16px 16px 8px;max-width:600px;margin:0 auto;width:100%}
.xbtn{background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1}
.prog{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .35s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.lbody{flex:1;overflow:auto;padding:10px 18px 20px;max-width:600px;margin:0 auto;width:100%}
.lbody.lock .opt,.lbody.lock .tile,.lbody.lock input,.lbody.lock .chars button{pointer-events:none}
.lfoot{border-top:2px solid var(--line);padding:14px 18px 22px}
.lfoot .fin{max-width:600px;margin:0 auto}
.lfoot.ok{background:var(--okbg);border-color:transparent}
.lfoot.bad{background:var(--badbg);border-color:transparent}
.fbt{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.lfoot.ok .fbt,.lfoot.ok .fbd{color:var(--okfg)}.lfoot.bad .fbt,.lfoot.bad .fbd{color:var(--badfg)}
.fbd{margin-top:4px;font-size:16px}
.combo{display:inline-block;margin-top:6px;background:var(--orange);color:#fff;border-radius:10px;padding:2px 10px;font-size:13px}
.q h2{font-size:22px;font-weight:900;margin:6px 0 18px}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.bubble{border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:19px;flex:1}
.bubble .sub{font-size:14px;color:var(--muted);margin-top:3px}
.spk{width:50px;height:50px;border-radius:14px;border:0;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#fff;font-size:22px;cursor:pointer;flex:none}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.spk.big{width:96px;height:96px;border-radius:24px;font-size:42px}
.spk.slow{width:60px;height:60px;font-size:26px;border-radius:18px}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:10px 0 26px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;background:var(--card);font-size:17px;font-weight:700;color:var(--text);text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .k{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.12);color:var(--blue)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:rgba(88,204,2,.15);color:var(--okfg)}
.opt.wrong{border-color:var(--red);background:rgba(255,75,75,.12);color:var(--badfg)}
.opt.gone{opacity:.3;pointer-events:none}
.art{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.art .opt{justify-content:center;font-size:22px;font-weight:900;padding:22px 8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{justify-content:center;text-align:center;min-height:58px}
.answer-line{min-height:120px;background:repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:26px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 14px;background:var(--card);font-size:17px;font-weight:700;color:var(--text);cursor:pointer;height:48px}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
input.typ{width:100%;font:inherit;font-size:19px;padding:15px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);outline:none}
input.typ:focus{border-color:var(--blue)}
.chars{display:flex;gap:8px;margin-top:10px}
.chars button{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--card);color:var(--text);font-size:18px;font-weight:800;padding:8px 0;cursor:pointer}
.badge{display:inline-block;background:var(--purple,#ce82ff);color:#fff;font-size:12px;font-weight:900;border-radius:8px;padding:3px 10px;letter-spacing:.5px;margin-bottom:12px}
.intro{text-align:center;padding-top:10px}
.intro .de{font-size:34px;font-weight:900;margin:18px 0 6px}
.intro .bs{font-size:20px;color:var(--muted)}
.result{text-align:center;padding-top:30px}
.result h1{font-size:30px;font-weight:900;color:var(--yellow);margin:12px 0 6px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.rs{border:2px solid var(--c);border-radius:14px;overflow:hidden}
.rs .h{background:var(--c);color:#fff;font-size:11px;font-weight:900;padding:5px;letter-spacing:.4px}
.rs .v{font-size:20px;font-weight:900;padding:12px 4px;color:var(--c)}
/* words */
.search{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);outline:none;margin-bottom:6px}
.wgrp{margin-top:20px;font-weight:900;font-size:14px;color:var(--muted);letter-spacing:.4px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid var(--line)}
.wrow .spk{width:40px;height:40px;font-size:17px;border-radius:12px}
.wrow .tx{flex:1}
.wrow .d{font-size:17px;font-weight:800}
.wrow .b{font-size:14px;color:var(--muted)}
.str{letter-spacing:2px;color:var(--yellow);font-size:12px}
/* resources */
.res{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;margin-bottom:12px}
.res .e{font-size:32px;flex:none}
.res .tt{font-weight:900;font-size:17px}
.res .ds{font-size:14px;color:var(--muted);margin-top:2px;font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:900;border-radius:6px;padding:1px 7px;margin-left:6px;background:var(--blue);color:#fff;vertical-align:middle}
/* profile */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.sbox .n{font-size:20px;font-weight:900}
.sbox .l{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px}
.chart .bar.g{background:var(--yellow)}
.chart .lb{font-size:11px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);color:var(--text);padding:10px 6px;font-weight:800;cursor:pointer;font-size:14px}
.seg button.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.1)}
select{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text)}
.sec{margin-top:26px}
.sec h3{font-size:18px;font-weight:900;margin:0 0 10px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;font-weight:600}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>

const RAW=[

tip:`<p>Od 21 do 99 jedinica ide <b>prije</b> desetice:</p>

tip:`<p>Svaka imenica ima rod. Uči je <b>uvijek s članom</b>:</p>
<table><tr><td><b style="color:#1cb0f6">der</b></td><td>muški rod – der Apfel</td></tr><tr><td><b style="color:#ff4b4b">die</b></td><td>ženski rod – die Milch</td></tr><tr><td><b style="color:#58cc02">das</b></td><td>srednji rod – das Brot</td></tr></table>

{t:'Posao',de:'Arbeit',ic:'🛠️',

/* ============ UTILS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const norm=s=>s.toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[.,!?;:"„“'’()\-]/g,' ').replace(/\s+/g,' ').trim();
const tok=s=>s.replace(/[.,!?"„“]/g,'').split(/\s+/).filter(Boolean);
const ART=/^(der|die|das) /;
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 9;const d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return d;};

/* ============ STATE ============ */
const KEY='bashdeutsch-v1', HEART_MS=20*60*1000;
const def=()=>({xp:0,hearts:5,heartTs:Date.now(),streak:0,last:null,done:{},daily:{},goal:20,words:{},sound:true,rate:0.9,voice:'',lessons:0,perfect:0});
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j)return Object.assign(def(),j);}catch(e){}return def();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
function regen(){if(S.hearts>=5){S.hearts=5;S.heartTs=Date.now();return;}const n=Math.floor((Date.now()-S.heartTs)/HEART_MS);if(n>0){S.hearts=Math.min(5,S.hearts+n);S.heartTs=S.hearts>=5?Date.now():S.heartTs+n*HEART_MS;save();}}
function streakNow(){if(!S.last)return 0;return (S.last===dk()||S.last===dk(dayOff(-1)))?S.streak:0;}
const isOpen=i=>i===0||!!S.done[i-1]||!!S.done[i];
function curIdx(){for(let i=0;i<UNITS.length*4;i++)if(!S.done[i]&&isOpen(i))return i;return -1;}

function speak(t,slow){if(!TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=slow?0.55:S.rate;const v=voices.find(v=>v.name===S.voice)||voices.find(v=>v.lang==='de-DE')||voices[0];if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
let actx;
function beep(kind){if(!S.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
const N=kind==='ok'?[[660,0],[990,.1]]:kind==='bad'?[[260,0],[200,.13]]:[[523,0],[659,.12],[784,.24],[1047,.36]];
N.forEach(([f,t])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==='bad'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+t);g.gain.exponentialRampToValueAtTime(.16,t0+t+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+t+.2);o.connect(g);g.connect(actx.destination);o.start(t0+t);o.stop(t0+t+.22);});}catch(e){}}

/* ============ EXERCISE BUILDING ============ */
const PLANS={
0:['intro','intro','intro','mc_de_bs','listen_mc','mc_bs_de','match','article','type','mc_de_bs','build_de','build_bs'],
1:['intro','intro','intro','mc_bs_de','listen_mc','article','match','type','build_de','listen_build','build_bs','mc_de_bs'],
2:['mc_de_bs','type','build_de','listen_build','article','match','build_bs','type','listen_mc','build_de','listen_build','mc_bs_de'],
3:['type','build_de','listen_build','article','type','listen_mc','build_de','match','listen_build','type','build_bs','article','build_de','listen_mc'],
P:['mc_de_bs','type','listen_mc','match','build_de','article','mc_bs_de','listen_build','type','build_bs']
};
function buildQueue(words,sents,plan,skipIntro){
  const wq=shuf(words),sq=shuf(sents);let wi=0,si=0,ii=0;const out=[];
  for(let t of plan){
    if(!TTS){if(t==='listen_mc')t='mc_bs_de';if(t==='listen_build')t='build_de';}
    if(t==='intro'){if(!skipIntro)out.push({type:'intro',w:wq[ii++%wq.length]});continue;}
    if(t==='article'){const c=shuf(words).find(w=>ART.test(w.de));if(c){out.push({type:'article',w:c});continue;}t='mc_de_bs';}
    if(t==='match'){const seen=new Set(),ws=[];for(const w of shuf(words.length>=5?words:words.concat(UNITS[words[0].u].words))){const k=norm(w.de)+'|'+norm(w.bs);if(!seen.has(k)&&!ws.some(x=>norm(x.bs)===norm(w.bs)||norm(x.de)===norm(w.de))){seen.add(k);ws.push(w);}if(ws.length>=5)break;}out.push({type:'match',ws});continue;}
    if(t==='build_de'||t==='build_bs'||t==='listen_build'){if(sq.length){out.push({type:t,s:sq[si++%sq.length]});continue;}t='type';}
    out.push({type:t,w:wq[wi++%wq.length]});
  }
  return out;
}
function distract(w,field,n){const seen=new Set([norm(w[field])]),out=[];for(const x of shuf(UNITS[w.u].words).concat(shuf(ALLW))){const k=norm(x[field]);if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length>=n)break;}return out;}
function extraToks(answer,lang,n){const own=new Set(tok(answer).map(t=>t.toLowerCase()));const c=[];for(const s of shuf(ALLS)){for(const t of tok(s[lang])){const k=t.toLowerCase();if(!own.has(k)&&!c.some(x=>x.toLowerCase()===k))c.push(t);}if(c.length>30)break;}return shuf(c).slice(0,n);}

/* ============ RENDER EXERCISE ============ */
let X=null;

function mc(body,head,opts,label,correct,correctText,sayOnTap){

  let sel=-1;const btns=[...body.querySelectorAll('.opt')];
  btns.forEach(b=>b.onclick=()=>{sel=+b.dataset.i;btns.forEach(x=>x.classList.toggle('sel',x===b));if(sayOnTap)speak(label(opts[sel]));setReady(true);});
  X={ready:false,check:()=>{const ok=opts[sel]===correct;btns[sel].classList.remove('sel');btns[sel].classList.add(ok?'right':'wrong');if(!ok)btns[opts.indexOf(correct)].classList.add('right');return {ok,correct:correctText};}};
}
function tiles(body,head,answer,lang){
  const all=shuf(tok(answer).concat(extraToks(answer,lang,Math.min(4,Math.max(2,tok(answer).length-1)))));
  body.innerHTML=head+`<div class="answer-line" id="al"></div><div class="tiles" id="bank">${all.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
  const ch=[],al=body.querySelector('#al'),bank=body.querySelector('#bank');
  const draw=()=>{al.innerHTML=ch.map(i=>`<button class="tile" data-i="${i}">${esc(all[i])}</button>`).join('');setReady(ch.length>0);};
  bank.onclick=e=>{const b=e.target.closest('.tile');if(!b||b.classList.contains('used'))return;const i=+b.dataset.i;ch.push(i);b.classList.add('used');if(lang==='de')speak(all[i]);draw();};
  al.onclick=e=>{const b=e.target.closest('.tile');if(!b)return;const i=+b.dataset.i;ch.splice(ch.indexOf(i),1);bank.querySelector(`[data-i="${i}"]`).classList.remove('used');draw();};
  X={ready:false,check:()=>({ok:norm(ch.map(i=>all[i]).join(' '))===norm(answer),correct:answer})};
}

  case 'type':{

    setTimeout(()=>{try{inp.focus();}catch(e){}},50);
    X={ready:false,check:()=>{const a=norm(inp.value),t=norm(w.de),na=norm(w.de.replace(ART,''));

      if(a===na&&t!==na)return {ok:true,correct:w.de,note:'Uči riječ i sa članom: '+w.de};
      if((t.length>4&&lev(a,t)<=1)||(na.length>4&&lev(a,na)<=1))return {ok:true,correct:w.de,note:'Mala greška u pisanju: '+w.de};

}
function rec(w,ok){if(!w)return;const r=S.words[w.de]||(S.words[w.de]={ok:0,bad:0});ok?r.ok++:r.bad++;}

/* ============ LESSON FLOW ============ */
let L=null;
function startLesson(u,l,mode){
  closeSheet();regen();
  if(mode!=='practice'&&S.hearts<=0)return noHearts();
  let q;const U=UNITS[u];
  if(mode==='practice')q=buildPractice();
  else if(mode==='jump'||l===3)q=buildQueue(U.words,U.sents,PLANS[3],true);
  else{const W=U.words,h=Math.ceil(W.length/2);
    if(l===0)q=buildQueue(W.slice(0,h),U.sents.slice(0,3),PLANS[0],!!S.done[u*4]);
    else if(l===1)q=buildQueue(W.slice(h),U.sents.slice(2,5),PLANS[1],!!S.done[u*4+1]);
    else q=buildQueue(W,U.sents,PLANS[2],true);}
  L={q,base:q.length,solved:0,okc:0,att:0,mist:0,combo:0,t0:Date.now(),mode,u,l,state:'ask'};
  const d=document.createElement('div');d.className='lesson';d.id='lesson';
  d.innerHTML=`<div class="lhead"><button class="xbtn" id="lx">✕</button><div class="prog"><i id="pg" style="width:0"></i></div><div class="stat heart" id="lh">${mode==='practice'?'❤️ ∞':'❤️ '+S.hearts}</div></div><div class="lbody" id="lb"></div><div class="lfoot" id="lf"><div class="fin"><div id="fbx"></div><button class="btn" id="cb" disabled>Provjeri</button></div></div>`;
  document.body.appendChild(d);
  $('#lx').onclick=quitAsk;$('#cb').onclick=onCheck;
  next();
}
function buildPractice(){
  const us=UNITS.filter((U,u)=>isOpen(u*4)||S.done[u*4]);
  const words=us.flatMap(U=>U.words),sents=us.flatMap(U=>U.sents);
  const sc=w=>{const r=S.words[w.de]||{ok:0,bad:0};return r.ok-r.bad*2+Math.random()*1.5;};
  const weak=words.slice().sort((a,b)=>sc(a)-sc(b)).slice(0,8);
  return buildQueue(weak,shuf(sents).slice(0,6),PLANS.P,true);
}
function updProg(){const p=$('#pg');if(p)p.style.width=Math.min(100,L.solved/L.base*100)+'%';}
function next(){
  if(!L.q.length)return finish();
  const ex=L.q.shift();L.cur=ex;L.state='ask';
  const lb=$('#lb');lb.className='lbody';lb.scrollTop=0;
  $('#lf').className='lfoot';$('#fbx').innerHTML='';
  const cb=$('#cb');cb.className='btn';cb.textContent=ex.type==='intro'?'Nastavi':'Provjeri';
  renderEx(ex,lb);cb.disabled=!X.ready;updProg();
}
function onCheck(){
  if(L.state==='ask'){
    if(!X.ready)return;const r=X.check();const ex=L.cur;
    if(ex.type==='intro'){L.solved++;return next();}
    L.state='fb';$('#lb').classList.add('lock');
    if(!X.match){L.att++;rec(ex.w,r.ok);}
    if(r.ok){L.solved++;L.okc++;L.combo++;beep('ok');
      if(ex.type==='build_de'||ex.type==='type'||ex.type==='mc_bs_de')speak(ex.s?ex.s.de:ex.w.de);}
    else{L.mist++;L.combo=0;beep('bad');L.q.push({...ex});
      if(L.mode!=='practice'){regen();S.hearts=Math.max(0,S.hearts-1);save();$('#lh').textContent='❤️ '+S.hearts;$('#lh').classList.add('shake');}}
    const lf=$('#lf');lf.className='lfoot '+(r.ok?'ok':'bad');
    let h=`<div class="fbt">${r.ok?'✅ '+pick(PRAISE):'❌ Netačno'}</div>`;
    if(!r.ok)h+=`<div class="fbd">Tačan odgovor:<br><b>${esc(r.correct)}</b></div>`;
    else if(r.note)h+=`<div class="fbd">${esc(r.note)}</div>`;
    else if(ex.s&&ex.type!=='build_bs')h+=`<div class="fbd">${esc(ex.s.de)} = ${esc(ex.s.bs)}</div>`;
    if(r.ok&&L.combo>=3&&L.combo%3===0)h+=`<span class="combo">🔥 ${L.combo} zaredom!</span>`;
    $('#fbx').innerHTML=h;
    const cb=$('#cb');cb.textContent='Nastavi';cb.className='btn'+(r.ok?'':' red');cb.disabled=false;updProg();save();
  }else{
    if(L.mode!=='practice'&&S.hearts<=0)return failScreen();
    next();
  }
}
function quitAsk(){
  sheet(`<div style="text-align:center">${mascot(80,'sad')}<h3>Stvarno odustaješ?</h3><p class="muted">Napredak u ovoj lekciji neće biti sačuvan.</p><button class="btn" id="qk">Nastavi učiti</button><button class="btn ghost" id="qq" style="color:var(--red)">Prekini lekciju</button></div>`);
  $('#qk').onclick=closeSheet;$('#qq').onclick=()=>{closeSheet();endLesson();};
}
function endLesson(){try{speechSynthesis.cancel();}catch(e){}const d=$('#lesson');if(d)d.remove();L=null;render();}
function finish(){
  const secs=Math.round((Date.now()-L.t0)/1000),acc=L.att?Math.round(100*L.okc/L.att):100,perfect=L.mist===0;
  let xp=L.mode==='practice'?5:(L.mode==='jump'||L.l===3)?20:10;if(perfect&&L.mode!=='practice')xp+=5;
  const today=dk(),before=S.daily[today]||0;
  S.xp+=xp;S.daily[today]=before+xp;S.lessons++;if(perfect)S.perfect++;
  let streakUp=false;if(S.last!==today){S.streak=(S.last===dk(dayOff(-1)))?S.streak+1:1;S.last=today;streakUp=true;}
  if(L.mode==='practice'){regen();S.hearts=Math.min(5,S.hearts+1);}
  else if(L.mode==='jump'){for(let i=0;i<=L.u*4+3;i++)S.done[i]=true;}
  else S.done[L.u*4+L.l]=true;
  save();beep('win');confetti();
  const goalHit=before<S.goal&&S.daily[today]>=S.goal;
  const title=L.mode==='jump'?'Jedinica preskočena!':L.mode==='practice'?'Vježba završena!':perfect?'Savršena lekcija!':'Lekcija završena!';
  $('#lb').innerHTML=`<div class="result">${mascot(130)}<h1>${title}</h1>
  ${streakUp?`<div style="color:var(--orange);font-weight:900;font-size:18px">🔥 Niz: ${S.streak} ${S.streak===1?'dan':'dana'}!</div>`:''}
  ${goalHit?`<div style="color:#e5a800;font-weight:900;margin-top:6px">🎯 Dnevni cilj ispunjen!</div>`:''}
  ${L.mode==='practice'?`<div class="muted" style="margin-top:6px">+1 ❤️ srce</div>`:''}
  <div class="rstats"><div class="rs" style="--c:#ffc800"><div class="h">UKUPNO XP</div><div class="v">⚡ ${xp}</div></div><div class="rs" style="--c:#58cc02"><div class="h">TAČNOST</div><div class="v">🎯 ${acc}%</div></div><div class="rs" style="--c:#1cb0f6"><div class="h">VRIJEME</div><div class="v">⏱ ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</div></div></div></div>`;
  $('#pg').style.width='100%';$('#lf').className='lfoot';$('#fbx').innerHTML='';
  const cb=$('#cb');cb.textContent='Nastavi';cb.className='btn';cb.disabled=false;cb.onclick=endLesson;L.state='done';
}
function failScreen(){
  $('#lb').innerHTML=`<div class="result">${mascot(130,'sad')}<h1 style="color:var(--red)">Nema više srca</h1><p class="muted">Srca se vraćaju sama: 1 svakih 20 minuta.<br>Ili vježbaj i odmah zaradi srce.</p></div>`;
  $('#lf').className='lfoot';$('#fbx').innerHTML='';
  const cb=$('#cb');cb.textContent='Vježbaj (+1 ❤️)';cb.className='btn blue';cb.disabled=false;cb.onclick=()=>{endLesson();startLesson(0,0,'practice');};

}
function noHearts(){

function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheet-bg';d.id='sheet';d.innerHTML=`<div class="sheet">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet();};document.body.appendChild(d);return d;}

function confetti(){const c=document.createElement('canvas');c.id='cf';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');
const cols=['#58cc02','#1cb0f6','#ff4b4b','#ffc800','#ce82ff','#ff9600'];const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,s:4+Math.random()*6,c:pick(cols),w:Math.random()*.2-.1}));
let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.w;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++t<170)requestAnimationFrame(f);else c.remove();})();}

  if(open)h+=`<button class="btn" data-start="${i}">${done?'Ponovi':'Počni'} +${l===3?20:10} XP</button>`;
  else{h+=`<p class="muted">🔒 Završi prethodne lekcije da otključaš ovu.</p>`;if(l===0)h+=`<button class="btn blue" data-jump="${u}">Znam ovo već: test za preskakanje</button>`;}
  h+=`<button class="btn ghost" data-tip="${u}">📘 Gramatika i video</button>`;
  sheet(h);
}
function tipSheet(u){
  const U=UNITS[u];
  sheet(`<div class="sh-h" style="color:${U.c}">${U.ic} JEDINICA ${u+1}</div><h3>${esc(U.t)} · ${esc(U.de)}</h3><div class="tip">${U.tip}</div>
  <div class="sec"><h3>▶️ Video o ovoj temi</h3>
  <a class="card res" href="https://www.youtube.com/results?search_query=${encodeURIComponent('Deutsch lernen A1 '+U.de)}" target="_blank" rel="noopener"><span class="e">🇩🇪</span><span><div class="tt">YouTube: Deutsch lernen A1 · ${esc(U.de)}</div><div class="ds">Video lekcije na njemačkom za ovu temu</div></span></a>
  <a class="card res" href="https://www.youtube.com/results?search_query=${encodeURIComponent('njemački jezik za početnike '+U.t)}" target="_blank" rel="noopener"><span class="e">🇧🇦</span><span><div class="tt">YouTube: njemački za početnike · ${esc(U.t)}</div><div class="ds">Objašnjenja na našem jeziku</div></span></a></div>
  <div class="sec"><h3>📝 Rečenice iz jedinice</h3>${U.sents.map(s=>`<div class="wrow">${spkBtn(s.de)}<div class="tx"><div class="d">${esc(s.de)}</div><div class="b">${esc(s.bs)}</div></div></div>`).join('')}</div>`);
}
function vPractice(m){
  const all=Object.entries(S.words),weak=all.filter(([k,r])=>r.bad>0).sort((a,b)=>(b[1].bad-b[1].ok)-(a[1].bad-a[1].ok)).slice(0,8);
  m.innerHTML=`<h2 class="t">Vježba</h2><div class="card" style="text-align:center">${mascot(90)}<div style="font-weight:900;font-size:18px;margin-top:6px">Ponovi slabe riječi</div><p class="muted">Vježba bira riječi u kojima najviše griješiš. Ne troši srca i daje <b>+1 ❤️</b> i 5 XP.</p><button class="btn blue" id="pr">Počni vježbu</button></div>
  <div class="sec"><h3>🎯 Riječi za ponavljanje</h3>${weak.length?weak.map(([de,r])=>{const w=ALLW.find(x=>x.de===de);return w?`<div class="wrow">${spkBtn(w.de)}<div class="tx"><div class="d">${esc(w.de)}</div><div class="b">${esc(w.bs)}</div></div><span class="small" style="color:var(--red)">✗ ${r.bad}</span></div>`:'';}).join(''):'<p class="muted">Još nema grešaka. Samo naprijed! 💪</p>'}</div>`;
  $('#pr').onclick=()=>startLesson(0,0,'practice');
}
function vWords(m){
  m.innerHTML=`<h2 class="t">Rječnik</h2><input class="search" id="sq" placeholder="🔍 Traži riječ (njemački ili bosanski)…"><div id="wl"></div>`;
  const draw=()=>{const q=norm($('#sq').value);let h='';
    UNITS.forEach((U,u)=>{const open=isOpen(u*4)||S.done[u*4];const ws=U.words.concat(U.sents).filter(w=>!q||norm(w.de).includes(q)||norm(w.bs).includes(q));if(!ws.length)return;
      h+=`<div class="wgrp">${U.ic} ${esc(U.t.toUpperCase())} ${open?'':'🔒'}</div>`;
      ws.forEach(w=>{const r=S.words[w.de];const st=r?Math.max(0,Math.min(4,r.ok-r.bad)):0;h+=`<div class="wrow">${spkBtn(w.de)}<div class="tx"><div class="d">${esc(w.de)}</div><div class="b">${esc(w.bs)}</div></div>${r?`<span class="str">${'●'.repeat(st)}${'○'.repeat(4-st)}</span>`:''}</div>`;});});
    $('#wl').innerHTML=h||'<p class="muted">Ništa nije pronađeno.</p>';};
  $('#sq').oninput=draw;draw();
}
const RES=[
['📺','DW Learn German · Nicos Weg','Besplatni video kurs A1–B1 od Deutsche Welle: serija s vježbama nakon svake epizode.','A1–B1','https://learngerman.dw.com'],
['🎥','Nicos Weg A1 na YouTube-u','Sve epizode kursa redom, s titlovima.','A1','https://www.youtube.com/results?search_query=Nicos+Weg+A1'],
['🗣️','Easy German','Razgovori s ljudima na ulici, s njemačkim i engleskim titlovima. Pravi, živi jezik.','A2+','https://www.youtube.com/@EasyGerman'],
['🇧🇦','Njemački na našem jeziku','Lekcije objašnjene na bosanskom/hrvatskom/srpskom.','A1','https://www.youtube.com/results?search_query=njema%C4%8Dki+jezik+za+po%C4%8Detnike+A1'],
['📰','Langsam gesprochene Nachrichten','DW vijesti čitane sporo. Odlično za slušanje.','B1','https://www.youtube.com/results?search_query=Langsam+gesprochene+Nachrichten+DW'],
['🎧','Slow German podcast','Kratke priče o životu u Njemačkoj, sporo izgovorene.','A2–B1','https://www.youtube.com/results?search_query=Slow+German+podcast'],
['🏛️','Goethe-Institut','Službeni ispiti (A1, B1…) i besplatne vježbe.','A1–C2','https://www.goethe.de'],
['🔤','DWDS rječnik','Njemački rječnik s primjerima i izgovorom.','sve','https://www.dwds.de'],
['🌐','Google Translate','Prevod njemački ↔ bosanski, s izgovorom i kamerom za pisma.','sve','https://translate.google.com/?sl=de&tl=bs']
];
function vVideo(m){
  m.innerHTML=`<h2 class="t">Video i izvori</h2><p class="muted" style="margin-top:-6px">Najbolji besplatni izvori, uz lekcije. Otvaraju se u YouTube-u ili pregledniku.</p>
  ${RES.map(r=>`<a class="card res" href="${r[4]}" target="_blank" rel="noopener"><span class="e">${r[0]}</span><span><div class="tt">${esc(r[1])}<span class="chip">${r[3]}</span></div><div class="ds">${esc(r[2])}</div></span></a>`).join('')}
  <div class="note" style="margin-top:16px">💡 <b>Plan za svaki dan:</b> 1 lekcija ovdje (5 min) + 1 epizoda Nicos Weg (10 min) + slušaj Easy German usput u autu.</div>`;
}
function vProfile(m){
  const known=Object.values(S.words).filter(r=>r.ok>r.bad).length,doneN=Object.keys(S.done).length;
  const days=[...Array(7)].map((_,i)=>dayOff(i-6)),vals=days.map(d=>S.daily[dk(d)]||0),mx=Math.max(S.goal,...vals);
  const DN=['Ned','Pon','Uto','Sri','Čet','Pet','Sub'];
  m.innerHTML=`<div style="text-align:center">${mascot(100)}<h2 class="t" style="margin-bottom:2px">Moj profil</h2><div class="muted small">Učim njemački 🇩🇪 · Nivo ${curLevel()}</div></div>
  <div class="sec"><h3>Statistika</h3><div class="grid2">
  <div class="sbox"><span style="font-size:26px">🔥</span><div><div class="n">${streakNow()}</div><div class="l">dana zaredom</div></div></div>
  <div class="sbox"><span style="font-size:26px">⚡</span><div><div class="n">${S.xp}</div><div class="l">ukupno XP</div></div></div>
  <div class="sbox"><span style="font-size:26px">✅</span><div><div class="n">${doneN} / ${UNITS.length*4}</div><div class="l">lekcija završeno</div></div></div>
  <div class="sbox"><span style="font-size:26px">📖</span><div><div class="n">${known}</div><div class="l">naučenih riječi</div></div></div>
  </div></div>
  <div class="sec"><h3>Ova sedmica</h3><div class="card"><div class="chart">${vals.map((v,i)=>`<div class="c"><div class="small" style="font-size:11px">${v||''}</div><div class="bar ${v>=S.goal?'g':''}" style="height:${v/mx*100}%"></div><div class="lb">${DN[days[i].getDay()]}</div></div>`).join('')}</div></div></div>
  <div class="sec"><h3>Dnevni cilj</h3><div class="seg">${[[10,'Lagano'],[20,'Normalno'],[30,'Ozbiljno'],[50,'Intenzivno']].map(([v,n])=>`<button data-goal="${v}" class="${S.goal===v?'on':''}">${n}<br><span class="small muted">${v} XP</span></button>`).join('')}</div></div>
  <div class="sec"><h3>Zvuk i izgovor</h3>
  <div class="seg"><button data-snd="1" class="${S.sound?'on':''}">🔔 Efekti uklj.</button><button data-snd="0" class="${!S.sound?'on':''}">🔕 Isklj.</button></div>
  <div class="seg" style="margin-top:8px">${[[0.75,'🐢 Sporije'],[0.9,'Normalno'],[1.05,'⚡ Brže']].map(([v,n])=>`<button data-rate="${v}" class="${S.rate===v?'on':''}">${n}</button>`).join('')}</div>
  ${TTS?(voices.length?`<div style="margin-top:10px"><select id="vs">${voices.map(v=>`<option value="${esc(v.name)}" ${S.voice===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div><button class="btn ghost" data-say="Hallo! Ich lerne Deutsch.">🔊 Probaj glas</button>`:`<div class="note" style="margin-top:10px">Nema njemačkog glasa na uređaju. Na Androidu: Postavke → Pretvaranje teksta u govor → instaliraj njemački jezik, ili otvori aplikaciju u Chrome-u.</div>`):`<div class="note" style="margin-top:10px">🔇 Izgovor nije podržan ovdje. Otvori aplikaciju u Chrome-u.</div>`}
  </div>
  <div class="sec"><a class="card res" href="../"><span class="e">🧪</span><span><div class="tt">bashlab</div><div class="ds">Sve moje aplikacije · @basa.gtm</div></span></a></div>
  <div class="sec"><div class="note">💾 Napredak se čuva u ovom pregledniku na ovom uređaju.</div><button class="btn ghost" id="rst" style="color:var(--red)">Resetuj napredak</button></div>`;
  const vs=$('#vs');if(vs)vs.onchange=()=>{S.voice=vs.value;save();};
  $('#rst').onclick=()=>{sheet(`<div style="text-align:center">${mascot(80,'sad')}<h3>Obrisati sav napredak?</h3><p class="muted">XP, niz i završene lekcije biće izbrisani.</p><button class="btn red" id="ry">Da, obriši</button><button class="btn ghost" id="rn">Odustani</button></div>`);$('#ry').onclick=()=>{S=def();save();closeSheet();render();};$('#rn').onclick=closeSheet;};
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-say],[data-tab],[data-node],[data-start],[data-jump],[data-tip],[data-goal],[data-snd],[data-rate],[data-info]');if(!t)return;
  const d=t.dataset;
  if(d.say!==undefined){speak(d.say,d.slow==='1');return;}
  if(d.tab){closeSheet();tab=d.tab;render();scrollTo(0,0);}
  else if(d.node)nodeSheet(+d.node);
  else if(d.start){const i=+d.start;startLesson(i>>2,i&3,'lesson');}
  else if(d.jump)startLesson(+d.jump,3,'jump');
  else if(d.tip)tipSheet(+d.tip);
  else if(d.goal){S.goal=+d.goal;save();render();}
  else if(d.snd){S.sound=d.snd==='1';save();render();}
  else if(d.rate){S.rate=+d.rate;save();render();speak('Guten Tag!');}
  else if(d.info){const k=d.info;
    if(k==='hearts'){regen();const mins=Math.max(1,Math.ceil((HEART_MS-(Date.now()-S.heartTs))/60000));sheet(`<h3>❤️ Srca: ${S.hearts} / 5</h3><p class="muted">Svaka greška u lekciji košta 1 srce. ${S.hearts<5?`Sljedeće srce za ~${mins} min.`:'Sva srca su puna!'} Vježba ne troši srca i daje +1.</p><button class="btn blue" data-tab="practice">Idi na vježbu</button>`);}
    else if(k==='streak')sheet(`<h3>🔥 Niz: ${streakNow()} ${streakNow()===1?'dan':'dana'}</h3><p class="muted">Završi barem jednu lekciju ili vježbu svaki dan da ti niz ne pukne.</p>`);
    else sheet(`<h3>⚡ ${S.xp} XP</h3><p class="muted">Lekcija +10, ispit +20, savršeno bez greške +5, vježba +5.</p>`);}
});
document.addEventListener('keydown',e=>{
  if(!L||!$('#lesson')||$('#sheet'))return;
  if(e.key==='Enter'){e.preventDefault();$('#cb').click();return;}
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(/^[1-4]$/.test(e.key)&&L.state==='ask'){const b=$('#lb').querySelectorAll('.opts .opt')[+e.key-1];if(b)b.click();}
});
setInterval(()=>{if(!L&&S.hearts<5){const h=S.hearts;regen();if(S.hearts!==h)render();}},60000);
render();
</script>
</body>
