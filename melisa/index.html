.bgimg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,var(--bg) 92%)}
#lock,#app{position:relative;z-index:1}
h1,h2,h3,h4{font-family:"DM Serif Display",Georgia,serif;font-weight:400;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(32px,6vw,52px)}h2{font-size:clamp(24px,3.6vw,32px)}h3{font-size:21px}h4{font-size:17px;color:var(--pink2)}
a{color:var(--pink2)}p{margin:.3em 0 .8em}
.muted{color:var(--muted)}.kicker{color:var(--pink);font-size:13px;letter-spacing:.02em;margin:0 0 6px}
.band{padding:clamp(18px,3.4vw,44px) max(4vw,14px);max-width:1240px;margin:0 auto}
.scroll{overflow-x:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
/* LOCK */
#lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.lockbox{width:min(420px,100%);text-align:center;padding:34px 26px;border-radius:26px;background:rgba(14,5,11,.62);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 80px rgba(255,79,163,.15)}
.lockbox .cherry{width:84px;height:84px;filter:drop-shadow(0 0 18px rgba(255,45,111,.55));animation:sway 4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes sway{50%{transform:rotate(6deg)}}
.lockbox h1{font-size:clamp(30px,8vw,42px);margin:8px 0 4px}.lockbox p{color:var(--muted)}
.inp{width:100%;font:16px Lexend,sans-serif;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;outline:none}
.inp:focus,select.inp:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,79,163,.25)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--pink2) 50%),linear-gradient(135deg,var(--pink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.inp option{background:#1a0b15}
.lockbox form{display:grid;gap:12px;margin-top:18px}.err{color:#ff7a9c;min-height:1.4em;font-size:14px;margin:0}
.rem{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--pink);background:transparent;color:var(--ink);font:500 15px Lexend,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:rgba(255,79,163,.12)}.btn.pri{background:linear-gradient(135deg,var(--pink),var(--deep));border-color:transparent;color:#fff}.btn.sm{min-height:38px;padding:7px 14px;font-size:14px;margin-top:8px}
.btn.on{background:var(--pink);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--pink2);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.row.end{justify-content:flex-end}
/* top */
.top{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;padding:10px max(4vw,14px);background:rgba(7,4,10,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-family:"DM Serif Display",serif;font-size:20px;white-space:nowrap}.brand b{color:var(--pink);font-weight:400}
.brand .cherry{width:30px;height:30px}
.search{position:relative;flex:1;max-width:460px;margin-left:auto}.search input{width:100%;font:16px Lexend,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:42px;outline:none}
.qres{position:absolute;right:0;left:0;top:48px;background:#140910;border:1px solid var(--line);border-radius:14px;max-height:60vh;overflow:auto;box-shadow:0 20px 60px #000;padding:6px}
.qres button,.a3list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:10px;font:15px Lexend,sans-serif;cursor:pointer}
.qres button:hover,.a3list button:hover{background:rgba(255,79,163,.12)}.qres small,.a3list small{display:block;color:var(--muted);font-size:13px}
.nav{position:sticky;top:63px;z-index:19;display:flex;gap:6px;padding:8px max(4vw,14px);background:rgba(7,4,10,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav a{flex:none;padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:14px;border:1px solid transparent;white-space:nowrap}
.nav a.on{color:#fff;border-color:var(--pink);background:rgba(255,79,163,.16)}
@media(max-width:640px){.brand span{display:none}.nav{top:61px}}
/* hero & cards */
.hero h1{max-width:20ch}.lead{font-size:17px;color:#e5cfdb;max-width:64ch}
.home{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;min-height:52vh}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.stats b{display:block;font-family:"DM Serif Display",serif;font-size:clamp(28px,4vw,40px);color:var(--pink);font-weight:400;line-height:1}.stats span{color:var(--muted);font-size:14px}
@media(max-width:760px){.home{grid-template-columns:1fr;min-height:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:block;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--pink);transform:translateY(-2px)}.tile b{display:block;font-family:"DM Serif Display",serif;font-weight:400;font-size:20px;margin-bottom:4px}.tile span{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
details.card>summary{list-style:none;cursor:pointer;display:block;position:relative;padding-right:30px}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";position:absolute;right:0;top:-2px;font-size:26px;color:var(--pink);transition:transform .2s}details.card[open]>summary::after{transform:rotate(45deg)}
details.card>summary h3{margin:0 0 2px}details.card>summary .muted{font-size:14px}details.card[open]>summary{margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.flash{animation:fl 1.6s}@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--pink)}}
.dl{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:6px 16px;margin:0 0 10px}.dl dt{color:var(--pink2);font-size:14px}.dl dd{margin:0}
@media(max-width:600px){.dl{grid-template-columns:1fr}.dl dd{margin-bottom:8px}}
