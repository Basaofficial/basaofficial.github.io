<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bash Talk — offline walkie-talkie i chat | bashlab · basaofficial</title>
<link rel="canonical" href="https://basaofficial.github.io/bashtalk/">
<meta name="description" content="Bash Talk: walkie-talkie i chat bez interneta i mreže za Android. Automatsko spajanje i rad u pozadini.">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root{--bg:#000;--card:#0a0d08;--card2:#11160d;--line:#1d2715;--g:#8dff1a;--g2:#5fd400;--gdim:rgba(141,255,26,.12);--glow:0 0 18px rgba(141,255,26,.45);--t:#e9ffe0;--mut:#7d8f72;--red:#ff3b4e;--yel:#ffd21a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--t);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
input,button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(180deg,#071004,#000)}
.logo{font-family:'Dancing Script',cursive;font-size:28px;font-weight:700;color:var(--g);text-shadow:var(--glow);white-space:nowrap}
.logo small{font-family:system-ui;font-size:11px;color:var(--mut);margin-left:4px;text-shadow:none;letter-spacing:.5px}
body.inapp header .logo{display:none}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;max-width:55vw;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--g);box-shadow:0 0 8px var(--g)}
.dot.mid{background:var(--yel)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn.g{background:var(--g);color:#000;border-color:var(--g);box-shadow:0 4px 16px rgba(141,255,26,.3)}
#people{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);min-height:56px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:13px;font-weight:600;cursor:pointer}
.chip .av{width:26px;height:26px;border-radius:50%;background:var(--gdim);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid var(--g2)}
.chip.talk{border-color:var(--g);box-shadow:var(--glow)}
.chip.me{opacity:.6}
#dmBar{display:none;align-items:center;gap:8px;padding:7px 12px;font-size:13px;color:var(--yel);background:#141100;border-bottom:1px solid #2b2500}
#dmBar button{margin-left:auto;background:none;border:0;color:var(--yel);font-weight:800;cursor:pointer}
#rx{display:none;text-align:center;padding:6px;font-weight:800;color:var(--g);background:#061003;border-bottom:1px solid var(--line)}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word}
.m .n{font-size:12px;font-weight:700;color:var(--g);margin-bottom:2px}
.m .x{font-size:15px;line-height:1.35;white-space:pre-wrap;user-select:text}
.m .tm{font-size:10px;color:var(--mut);text-align:right;margin-top:3px}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#8dff1a,#5fd400);color:#041000;border:0;border-bottom-right-radius:5px}
.m.me .tm,.m.me .n{color:#1d4a00}
.m.dm{border-color:var(--yel)}
.m.dm .n{color:var(--yel)}
.m img{max-width:240px;max-height:280px;border-radius:12px;display:block;cursor:pointer}
.sys{align-self:center;font-size:12px;color:var(--mut);padding:3px 10px;border-radius:99px;background:#0a0d08;text-align:center}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#030502;padding-bottom:max(10px,env(safe-area-inset-bottom));align-items:center}
.compose input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:11px 16px;outline:none;font-size:16px}
.compose input:focus{border-color:var(--g2)}
.ic{width:46px;height:46px;border-radius:50%;padding:0;font-size:19px;flex:none}
#ptt{touch-action:none;user-select:none;-webkit-user-select:none}
#ptt.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 24px rgba(255,59,78,.6)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.ov.show{display:flex}
.box{width:100%;max-width:380px;background:#070a05;border:1px solid var(--g2);border-radius:22px;padding:20px;box-shadow:0 0 40px rgba(141,255,26,.15)}
.box h3{color:var(--g);margin-bottom:12px}
.tin{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;font-size:16px;margin-bottom:10px}
.tin:focus{border-color:var(--g)}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
.row{display:flex;gap:10px;margin-top:6px}
#viewer img{max-width:100%;max-height:100%}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:#0d1709;border:1px solid var(--g2);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.rooms{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
.rooms .btn{justify-content:flex-start}
.m .via{font-size:10px;color:var(--mut);margin:-1px 0 3px;font-weight:600;letter-spacing:.2px}
.m.me .via{color:#1d4a00}
.vn{display:flex;align-items:center;gap:8px}
.vn audio{height:34px;max-width:230px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">#Bash Talk<small>ONLINE</small></div>
    <div class="sp"></div>
    <div class="pill" id="roomPill"><span class="dot" id="netDot"></span><span id="roomName">—</span></div>
    <button class="btn" id="inviteBtn" title="Pozovi">🔗</button>
  </header>
  <div id="people"></div>
  <div id="dmBar">🔒 Privatno (šifrovano) sa <b id="dmName"></b><button id="dmX">✕</button></div>
  <div id="rx"></div>
  <div id="msgs"></div>
  <div class="compose">
    <button class="btn ic" id="attBtn">📎</button>
    <input id="inp" placeholder="Poruka…" maxlength="1000" autocomplete="off">
    <button class="btn ic" id="ptt" title="Drži i pričaj">🎙️</button>
    <button class="btn g ic" id="send">➤</button>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>
</div>

<div class="ov" id="login"><div class="box">
  <div class="logo" style="text-align:center;font-size:38px;margin-bottom:6px">#Bash Talk</div>
  <div class="hint" style="text-align:center;margin-bottom:14px">Chat i walkie-talkie preko interneta – s aplikacijom ili iz preglednika</div>
  <input class="tin" id="nameIn" placeholder="Tvoj nadimak" maxlength="20">
  <button class="btn g" id="loginGo" style="width:100%;padding:13px">Uđi</button>
  <div class="hint" style="text-align:center;margin-top:12px;font-size:12px"><a style="color:inherit" href="../impressum.html">Impressum</a> · <a style="color:inherit" href="../datenschutz.html">Datenschutz</a></div>
</div></div>

<div class="ov" id="roomOv"><div class="box">
  <h3>💬 Soba</h3>
  <div class="rooms" id="recent"></div>
  <input class="tin" id="roomIn" placeholder="Ime sobe (npr. gradiliste-1332)" maxlength="40">
  <input class="tin" id="passIn" placeholder="Šifra (prazno = javna soba)" maxlength="60" type="password">
  <div class="hint" style="margin-bottom:12px">Sa šifrom je soba privatna i sve je šifrovano (AES-256). Bez šifre svako ko zna ime sobe može čitati.</div>
  <div class="row"><button class="btn" style="flex:1" id="roomCancel">Odustani</button><button class="btn g" style="flex:1.4" id="roomGo">Uđi u sobu</button></div>
</div></div>

<div class="ov" id="viewer"><img id="viewImg"></div>
<div id="toast"></div>

<script src="../assets/js/mqtt-mini.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
